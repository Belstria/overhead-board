name: Check

# Every pull request: the relay compiles, the phone app and its light version are up to date with the board, the pages' scripts parse, and
# the boards and the app load against made-up flights without a page error (tools/test/smoke.py).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020    # v4
        with:
          node-version: "20"
      # A stalled package mirror must fail (or recover) within minutes, not hold the job for its 15 (to-do #110: on 26 Oct
      # 2026 an apt-get update hung on azure.archive.ubuntu.com). apt gives up on a silent mirror after 20 s and tries
      # again; the step has 5 minutes and tries the browser install a second time once.
      - name: Tools
        timeout-minutes: 5
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
          pip install playwright cryptography
          python -m playwright install --with-deps chromium || { echo "The browser install failed: trying once more"; sleep 10; python -m playwright install --with-deps chromium; }
      - name: The relay compiles
        run: python -m py_compile relay/serve.py
      - name: The phone app is built from the board
        run: |
          python tools/app/build.py
          git diff --exit-code app/index.html test/index.html || (echo "app/index.html or the versions of i18n.js/sounds.js in test/index.html are out of date: run py tools/app/build.py" && exit 1)
      - name: The scripts parse
        run: python tools/test/smoke.py --syntax
      - name: The pages load without errors
        run: python tools/test/smoke.py
