# Builds the Android app (android/) and, on main, publishes it as a GitHub Release with overhead.apk attached:
# https://github.com/Belstria/overhead-board/releases/latest/download/overhead.apk
# The signing key lives in the repository's Actions secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD), never
# in the repository. Every release must be signed with the same key, or phones refuse it as an update.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Third-party actions are pinned to a commit, not a tag their owners can move: this job holds the signing key. Only
# the release job may write to the repository, and it never sees the key.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.version.outputs.v }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09    # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961    # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a    # v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/overhead.p12"
            echo "OVERHEAD_KEYSTORE=$RUNNER_TEMP/overhead.p12" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key in the secrets: the APK is signed with a throwaway debug key and not released."
          fi

      # The app is named after the project version (the newest entry in the patch notes) and the build number.
      - name: Version
        id: version
        run: |
          v=$(grep -m1 -oP '\{v: "\K[^"]+' test/index.html)
          echo "PROJECT_VERSION=$v" >> "$GITHUB_ENV"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          OVERHEAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OVERHEAD_KEY_ALIAS: overhead
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.PROJECT_VERSION }} (build ${{ github.run_number }})
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk overhead.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02    # v4
        with:
          name: overhead-apk
          path: overhead.apk

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/overhead.p12"

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093    # v4
        with:
          name: overhead-apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "android-build-${{ github.run_number }}" overhead.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Android app $PROJECT_VERSION (build ${{ github.run_number }})" \
            --notes "The Overhead app for Android. On the phone, download overhead.apk and open it. It shows the phone page from the home relay, so it needs the home Wi-Fi."
