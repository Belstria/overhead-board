# Builds the Android app (android/) and, on main, publishes it as a GitHub Release with overhead.apk attached:
# https://github.com/Belstria/overhead-board/releases/latest/download/overhead.apk
# The signing key lives in the repository's Actions secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD), never
# in the repository. Every release must be signed with the same key, or phones refuse it as an update.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/overhead.p12"
            echo "OVERHEAD_KEYSTORE=$RUNNER_TEMP/overhead.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the secrets: the APK is signed with a throwaway debug key and not released."
          fi

      # The app is named after the project version (the newest entry in the patch notes) and the build number.
      - name: Version
        run: |
          echo "PROJECT_VERSION=$(grep -m1 -oP '\{v: "\K[^"]+' test/index.html)" >> "$GITHUB_ENV"

      - name: Build
        env:
          OVERHEAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OVERHEAD_KEY_ALIAS: overhead
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.PROJECT_VERSION }} (build ${{ github.run_number }})
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk overhead.apk

      - uses: actions/upload-artifact@v4
        with:
          name: overhead-apk
          path: overhead.apk

      - name: Release
        if: github.ref == 'refs/heads/main' && env.OVERHEAD_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_number }}" overhead.apk \
            --target "${{ github.sha }}" --latest \
            --title "Android app ${{ env.PROJECT_VERSION }} (build ${{ github.run_number }})" \
            --notes "The Overhead app for Android. On the phone, download overhead.apk and open it. It shows the phone page from the home relay, so it needs the home Wi-Fi."
