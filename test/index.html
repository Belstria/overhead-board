/* ---------- Settings: the sounds of the controls ----------
   Synthesised like the flaps: a rotary selector clicks once for every detent it passes, a toggle switch snaps and its
   body thunks, a thumbwheel ticks, a push button thocks. They play when the flap sound or the chimes are on. */
let ctlNoise = null;
function ctlReady(){
  if (nightOn || !(S.sound || S.chimes) || !actx || actx.state !== "running") return false;
  if (!ctlNoise) {
    const n = Math.floor(actx.sampleRate * .12);
    ctlNoise = actx.createBuffer(1, n, actx.sampleRate);
    const d = ctlNoise.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  return true;
}
function ctlBurst(t, o){      // filtered noise with a sharp attack: metal on metal
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = ctlNoise; src.playbackRate.value = o.rate || 1;
  f.type = o.type || "bandpass"; f.frequency.value = o.f; f.Q.value = o.q || 1;
  g.gain.setValueAtTime(o.gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  src.connect(f).connect(g).connect(sfxOut());
  src.start(t, Math.random() * .08); src.stop(t + o.dur + .02);
}
function ctlRing(t, freq, dur, gain, type = "sine"){   // a short resonance: the switch body, the panel behind it
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .85, t + dur);
  const lo = freq < 400 ? .4 : 1;                      // the deep body tone: speakers drop it, headphones play it all
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain * lo, t + .002);    // eased in: no pop
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(sfxOut()); o.start(t); o.stop(t + dur + .02);
}
const ctlSound = {
  rotary(steps = 1){          // the spring-loaded ball dropping into each detent
    if (!ctlReady()) return;
    const t0 = actx.currentTime + .005;
    for (let i = 0; i < Math.min(Math.max(1, steps), 6); i++) {
      const t = t0 + i * .06, v = 1 - i * .06;
      ctlBurst(t, {f: 4100 + Math.random() * 500, q: 2.2, dur: .013, gain: .55 * v});
      ctlBurst(t + .003, {f: 1400, q: 1.3, dur: .03, gain: .22 * v});
      ctlRing(t, 225 + Math.random() * 15, .045, .16 * v);
      ctlRing(t + .002, 2800 + Math.random() * 150, .06, .025 * v);
    }
  },
  toggle(on){                 // the over-centre spring lets go: a snap, then the handle hits its stop
    if (!ctlReady()) return;
    const t = actx.currentTime + .005;
    ctlBurst(t, {f: 3000, q: .9, dur: .006, gain: .75});
    ctlRing(t + .001, on ? 1700 : 1550, .03, .05, "triangle");
    ctlBurst(t + .008, {f: on ? 880 : 760, q: 1.5, dur: .045, gain: .38});
    ctlRing(t + .008, on ? 150 : 128, .07, .32);
  },
  wheel(){                    // a thumbwheel's ratchet
    if (!ctlReady()) return;
    const t = actx.currentTime + .005;
    ctlBurst(t, {f: 3600, q: 1.2, dur: .009, gain: .28});
    ctlRing(t, 1250, .018, .03, "triangle");
  },
  press(){                    // a push button going down and springing back
    if (!ctlReady()) return;
    const t = actx.currentTime + .005;
    ctlBurst(t, {f: 650, q: .9, dur: .05, gain: .32});
    ctlRing(t, 215, .07, .2);
    ctlBurst(t + .09, {f: 1900, q: 1.2, dur: .018, gain: .12});
  }
};

/* ---------- Settings: Use current location ----------
   Browsers only tell pages where they are on https or on this computer (localhost), and a TV has no idea anyway. The
   Android app (android/ in the repository) offers OverheadAndroid.locate(), which answers through window.__overheadHere. */
function hereNow(){
  return new Promise((ok, no) => {
    const A = window.OverheadAndroid;
    if (A && A.locate) {
      const timer = setTimeout(() => no(new Error(T("The phone didn't say where it is. Is location turned on?"))), 30000);
      window.__overheadHere = (lat, lon, acc, err) => { clearTimeout(timer); err ? no(new Error(err)) : ok({lat, lon, acc}); };
      A.locate();
      return;
    }
    if (!window.isSecureContext || !navigator.geolocation)
      return no(new Error(T(A ? "Update the Fallblatt app to use the phone's location." :
        "This screen can't share its location: browsers only do that for https pages or pages opened on the relay's own computer. Type the latitude and longitude instead.")));
    navigator.geolocation.getCurrentPosition(
      p => ok({lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy}),
      e => no(new Error(T(e.code === 1 ? "Location access was turned down. Allow it in the browser's site settings." : "The location isn't available right now."))),
      {enableHighAccuracy: true, timeout: 20000, maximumAge: 60000});
  });
}
// The nearest airport with scheduled flights, from the relay's airport list (relay 16 or newer); null if unknown.
async function nearestAirport(lat, lon){
  if (!relay() || (window.OVERHEAD_RELAY_VERSION || 0) < 16) return null;
  for (let i = 0; i < 8; i++) {                       // the relay downloads the airport list the first time it's asked
    const j = await fetchJSON(`${relay()}/airports/near?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`, {}, 8000);
    if (j.status === "ok") return (j.airports || [])[0] || null;
    await new Promise(r => setTimeout(r, 2500));
  }
  return null;
}
function wireLocate(box){
  const b = box.querySelector("[data-loc]");
  if (!b) return;
  const note = b.parentNode.querySelector(".note"), ask = b.parentNode.querySelector(".ask");
  const put = (k, v) => { draft[k] = v; const el = box.querySelector(`.lcd[data-k="${k}"]`); if (el) el.value = v; };
  b.onclick = async () => {
    ctlSound.press(); audioInit();
    ask.hidden = true; ask.innerHTML = ""; b.disabled = true;
    note.textContent = T("Finding out where you are …");
    try {
      const p = await hereNow(), lat = +(+p.lat).toFixed(4), lon = +(+p.lon).toFixed(4);
      put("lat", lat); put("lon", lon); cockpitDirty();
      const here = p.acc ? T("Latitude and longitude set (to within {d}).", {d: p.acc < 1000 ? Math.round(p.acc) + " m" : (p.acc / 1000).toFixed(1) + " km"}) : T("Latitude and longitude set.");
      note.textContent = here + " " + T("Looking for the nearest airport …");
      let a = null;
      try { a = await nearestAirport(lat, lon); } catch {}
      const km = a ? (a.km < 10 ? a.km.toFixed(1) : Math.round(a.km)) : 0;
      if (!a) note.textContent = here + " " + T("Press Save to watch this spot.");
      else if (a.code === clean(draft.home)) note.textContent = here + " " + T("The nearest airport, {name} ({code}, {km} km), is already the home airport. Press Save to keep it.", {name: a.city || a.name, code: a.code, km});
      else {
        note.textContent = T("Location set. The nearest airport is {name} ({code}), {km} km away. Make it the home airport?", {name: a.city || a.name, code: a.code, km});
        b.hidden = true;                                // room for the question in the cell
        ask.innerHTML = `<button class="cap small" type="button" data-yes>${escH(T("Use {code}", {code: a.code}))}</button><button class="cap small" type="button" data-no>${escH(T("Keep {code}", {code: clean(draft.home) || T("none")}))}</button>`;
        ask.hidden = false;
        ask.querySelector("[data-yes]").onclick = () => { ctlSound.press(); put("home", a.code); cockpitDirty(); ask.hidden = true; b.hidden = false; note.textContent = T("Home airport set to {code}. Press Save to keep the new location.", {code: a.code}); };
        ask.querySelector("[data-no]").onclick = () => { ctlSound.press(); ask.hidden = true; b.hidden = false; note.textContent = T("Home airport unchanged. Press Save to keep the new location."); };
      }
    } catch (e) {
      note.textContent = e.message || T("The location isn't available right now.");
    } finally {
      b.disabled = false;
    }
  };
}
function applySettings(n){
  const num = v => parseFloat(String(v).replace(",", "."));
  const lat = num(n.lat), lon = num(n.lon), wasDemo = S.demo, hadLogos = S.logos;
  S = {...S, ...n,
    place: String(n.place || "").trim() || DEFAULTS.place,
    lat: isFinite(lat) && Math.abs(lat) <= 90 ? lat : S.lat,
    lon: isFinite(lon) && Math.abs(lon) <= 180 ? lon : S.lon,
    radiusKm: Math.min(20, Math.max(1, num(n.radiusKm) || 15)),
    home: clean(n.home).slice(0, 3), favs: String(n.favs || "").trim(),
    maxAltFt: +n.maxAltFt, refreshS: +n.refreshS, rotateS: +n.rotateS, airtimeMin: +n.airtimeMin, nightDim: +n.nightDim || 40,
    speedPct: +n.speedPct || 85, overKm: +n.overKm || 3,
    nightFrom: n.nightFrom || DEFAULTS.nightFrom, nightTo: n.nightTo || DEFAULTS.nightTo};
  saveSettings(); audioInit();
  AP.code = "";                                               // the home airport may have changed
  pickLang(); $("railViews").innerHTML = "";                 // the language may have changed
  $("railPages").innerHTML = "";                              // the airport layout may have changed the page buttons
  if (wasDemo !== S.demo) {
    feat = null; infoCache.clear(); sightRev = null; relayStats = null; recentFlights = loadRecent(); fullDay = {at: 0, rev: null, date: null, list: null}; airtime.clear();
    spotted = relayV5() ? [] : loadLog(); if (relayV5()) syncSightings();
  }
  applyTheme(); applyNight(true);
  if (hadLogos !== S.logos) layout();
  resize(); renderPage(); if (feat) renderFeatured(); updateFooter(); poll(true); sayHello();
}

/* ---------- keys and the address ---------- */
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h)) switchView(h); else if (!h && view) switchView(null); });
document.addEventListener("keydown", e => {
  audioInit();
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { if (e.key === "Escape" || e.key === "Enter") t.blur(); return; }
  if (e.key === "Escape") { closeDiag(); if (view) switchView(null); return; }
  if (t && t.closest && t.closest("#cockpit") && /^Arrow/.test(e.key)) return;     // the knobs and wheels use the arrow keys
  if (e.key === "t" || e.key === "T") toggleView("spotted");
  if (e.key === "l" || e.key === "L") toggleView("logbook");
  if (e.key === "r" || e.key === "R") toggleView("radar");
  if (e.key === "s" || e.key === "S") toggleView("settings");
  if (e.key === "a" || e.key === "A") toggleView("about");
  if (e.key === "ArrowRight") { if (view === "spotted") svStep(1); else if (!view) stepPage(1); }
  if (e.key === "ArrowLeft") { if (view === "spotted") svStep(-1); else if (!view) stepPage(-1); }
  if (/^[1-9]$/.test(e.key) && pageOrder()[+e.key - 1]) { const p = pageOrder()[+e.key - 1]; view ? switchView(null, {page: p}) : pickPage(p); }
  if (e.key === "d") DIAG.open ? closeDiag() : openDiag();
  if (e.key === "f") toggleFullscreen();
});

/* ---------- diagnostics panel ---------- */
const escH = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clockStr = t => new Date(t).toLocaleTimeString("en-GB");
function agoStr(t){ const s = Math.round((Date.now() - t) / 1000); return s < 3 ? "just now" : s < 120 ? `${s} s ago` : `${Math.round(s / 60)} min ago`; }
function diagRows(){
  const R = +S.radiusKm || 15, polls = DIAG.polls.slice(-30), good = polls.filter(p => p.ok);
  const avg = good.length ? Math.round(good.reduce((a, p) => a + p.ms, 0) / good.length) : 0;
  const state = S.demo ? ["Demo mode", "meh"] : isOffline() ? ["Offline", "bad"] : failures ? [`Retrying (${failures} failed in a row)`, "meh"] : lastOk ? ["Live", "good"] : ["Starting", "meh"];
  const conn = S.demo ? "Demo data, no network" : relay() ? `Home relay at ${relay().replace(/^https?:\/\//, "")}${relayLegacy ? " (older version, please update)" : ""}` : "Direct, no relay: the position services will block this";
  const c = DIAG.closest;
  const pass = !c ? "" : c.dist <= overKm() ? "overhead now" : c.tcpa > 0 ? `closest approach ${c.cpa.toFixed(1)} km in ${countdown(c.tcpa).replace("IN ", "").toLowerCase()}` : "moving away";
  const closest = c ? `${c.name} · ${c.dist.toFixed(1)} km · ${c.alt != null ? nf.format(Math.round(c.alt)) + " ft" : "altitude unknown"} · ${pass} · ${c.dist <= R ? "inside" : "outside"} the ${R} km spotting radius` : "none in range";
  return [
    ["Connection", conn],
    ["Status", `${state[0]}${lastOk ? " · last data " + agoStr(lastOk) : ""}`, state[1]],
    ["Source", feedName ? feedName + (lastFreshness.startsWith("stale") ? ` · last good copy, ${lastFreshness.split(" ")[1]} s old` : "") : "none yet"],
    ["Last 30 updates", polls.length ? `${good.length} of ${polls.length} succeeded${good.length ? ` · ${avg} ms on average` : ""}` : "none yet", null, polls],
    ["In range", `${nearbyCount ?? "–"} aircraft within ${QUERY_KM} km`],
    ["Closest", closest],
    ["On the board", feat ? `${planeName(feat)} · ${MODE_REMARK[feat.mode] || feat.mode}` : "nothing"],
    ["Spotted today", `${spotted.filter(e => !e.sample).length} (a plane is added when it comes within ${R} km)`],
    ["Watching", `${S.lat.toFixed(4)}, ${S.lon.toFixed(4)} · updates every ${POLL_MS / 1000} s`]
  ];
}
function mergedLog(){
  const relayLines = (DIAG.relayEvents || []).map(e => ({t: e.t * 1000, level: e.level, msg: e.msg, src: "relay"}));
  return DIAG.log.concat(relayLines).sort((a, b) => b.t - a.t).slice(0, 250);
}
function renderDiag(){
  diagQueued = false;
  if (!DIAG.open) return;
  $("diagStats").innerHTML = diagRows().map(([k, v, cls, polls]) => {
    const spark = polls ? `<span class="spark">${polls.map(p => `<i class="${p.ok ? (p.stale ? "s" : "") : "f"}"></i>`).join("")}</span>` : "";
    return `<dt>${k}</dt><dd${cls ? ` class="${cls}"` : ""}>${spark}${escH(v)}</dd>`;
  }).join("");
  const st = DIAG.relayStatus;
  $("diagSources").innerHTML = !st ? "" : st.error ? `<h3>Relay sources</h3><p class="bad">Couldn't read the relay's status: ${escH(st.error)}</p>` :
    `<h3>Relay sources · relay up ${Math.round(st.uptime_s / 60)} min</h3><table class="dsrc"><tbody>` + st.sources.map(x => {
      const cls = x.state === "ok" ? "good" : x.state === "untried" ? "" : x.state === "resting" ? "meh" : "bad";
      const label = x.state === "resting" ? `resting ${x.resting_s} s` : x.state;
      return `<tr><td>${escH(x.name)}</td><td class="${cls}">${escH(label)}</td><td>${x.ok} ok · ${x.fail} failed</td><td>${escH(x.last_error || (x.last_ok_age_s != null ? "last answer " + x.last_ok_age_s + " s ago" : ""))}</td></tr>`;
    }).join("") + "</tbody></table>" + (st.screens && st.screens.length ? `<h3>Screens using the relay · ${st.screens.length}</h3><table class="dsrc"><tbody>` +
      st.screens.map(x => `<tr><td>${escH(x.name || x.device)}${x.sid === SID ? " <b>(this screen)</b>" : ""}</td><td>${escH(x.ip + (x.host ? " · " + x.host : ""))}</td>` +
        `<td>${escH([x.board, x.size].filter(Boolean).join(" · "))}</td><td>on for ${escH(forText(x.on_s))}</td></tr>`).join("") + "</tbody></table>" : "");
  const lines = mergedLog();
  $("diagLog").innerHTML = lines.length ? lines.map(e => `<li class="lv-${e.level}"><time>${clockStr(e.t)}</time><span class="tag">${e.src}</span><span>${escH(e.msg)}</span></li>`).join("")
    : `<li class="lv-debug"><time></time><span class="tag"></span><span>Nothing logged yet.</span></li>`;
}
async function refreshRelayStatus(){
  if (!DIAG.open || !relay() || relayLegacy || S.demo) return;
  try { const j = await fetchJSON(`${relay()}/status`, {}, 4000); DIAG.relayStatus = j; DIAG.relayEvents = j.events || []; }
  catch (e) { DIAG.relayStatus = {error: netError(e, "relay")}; }
  scheduleDiag();
}
let diagTimer = null;
function openDiag(){
  DIAG.open = true; $("diag").hidden = false;
  refreshRelayStatus(); renderDiag();
  clearInterval(diagTimer); diagTimer = setInterval(() => { refreshRelayStatus(); renderDiag(); }, 3000);
}
function closeDiag(){ DIAG.open = false; $("diag").hidden = true; clearInterval(diagTimer); }
function diagText(){
  const head = diagRows().map(([k, v]) => `${k}: ${v}`).join("\n");
  const src = (DIAG.relayStatus && DIAG.relayStatus.sources ? "\n\nRelay sources\n" + DIAG.relayStatus.sources.map(x => `${x.name}: ${x.state}${x.resting_s ? " " + x.resting_s + " s" : ""} · ${x.ok} ok · ${x.fail} failed · ${x.last_error || ""}`).join("\n") : "") +
    (DIAG.relayStatus && DIAG.relayStatus.screens ? "\n\nScreens using the relay\n" + DIAG.relayStatus.screens.map(x => `${x.name || x.device}${x.sid === SID ? " (this screen)" : ""} · ${x.device} · ${x.ip}${x.host ? " (" + x.host + ")" : ""} · ${x.board} · ${x.size} · on for ${forText(x.on_s)}`).join("\n") : "");
  const log = mergedLog().map(e => `${new Date(e.t).toISOString().slice(11, 19)}  ${e.src.padEnd(5)}  ${e.level.padEnd(5)}  ${e.msg}`).join("\n");
  return `Fallblatt diagnostics · ${new Date().toString()}\n${navigator.userAgent}\n\n${head}${src}\n\nLog (newest first)\n${log}\n`;
}
$("btnDiag").onclick = e => { e.stopPropagation(); DIAG.open ? closeDiag() : openDiag(); };
$("diagClose").onclick = closeDiag;
$("diagCopy").onclick = async () => {
  const text = diagText(), btn = $("diagCopy");
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch {}
  if (!ok) { const ta = $("diagText"); ta.value = text; ta.focus(); ta.select(); try { ok = document.execCommand("copy"); } catch {} }
  btn.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.textContent = "Copy log"; }, 2000);
};

function forText(sec){
  const m = Math.floor(sec / 60);
  return m < 1 ? "< 1 min" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
}

/* ---------- saying hello to the relay ---------- */
// The relay (version 12 or newer) keeps a list of the screens using it. Every minute, and when the page is hidden or
// shown, the board tells it this screen's name, how big it is drawn and at what quality; closing the page says goodbye.
const relayV12 = () => !!relay() && !relayLegacy && (window.OVERHEAD_RELAY_VERSION || 0) >= 12;
function sayHello(){
  if (!relayV12()) return;
  const q = quality() === "high" ? "4K" : quality();
  const params = new URLSearchParams({name: "", w: Math.round(W * PX), h: Math.round(H * PX),
    q: (S.quality || "auto") === "auto" ? `auto (${q})` : q, vis: document.visibilityState || ""});
  timedFetch(`${relay()}/hello?${params}`, {}, 6000).catch(() => {});
}
setTimeout(sayHello, 2000);
setInterval(sayHello, 60000);
document.addEventListener("visibilitychange", sayHello);
addEventListener("pagehide", () => { try { if (relayV12() && navigator.sendBeacon) navigator.sendBeacon(tagged(`${relay()}/bye`)); } catch {} });

/* ---------- fullscreen, wake lock, idle cursor ---------- */
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
function toggleFullscreen(){
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); } catch {}
}
fx.addEventListener("click", () => { audioInit(); keepAwake(); toggleFullscreen(); });
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { audioInit(); keepAwake(); }, {passive: true, capture: true}));
let idleT = null;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 4000); }
["mousemove","keydown","touchstart"].forEach(ev => addEventListener(ev, wake, {passive: true}));
addEventListener("resize", resize);

/* ---------- main loop ---------- */
let timer = null, busy = false;
async function poll(force){
  if (busy && !force) return;
  clearTimeout(timer); busy = true;
  try {
    const list = S.demo ? demoAircraft() : await getAircraft();
    if (S.demo) DIAG.polls.push({t: Date.now(), ok: true, ms: 0, n: list.length});
    if (!lastOk && !S.demo) dlog("info", `First position data from ${feedName}: ${list.length} aircraft within ${QUERY_KM} km`);
    if (failures) dlog("info", `Position data back after ${failures} failed attempt${failures > 1 ? "s" : ""}`);
    if (wasOffline) dlog("info", "Back online");
    failures = 0; lastOk = Date.now(); wasOffline = false; process(list);
  } catch (e) {
    failures++;
    DIAG.polls.push({t: Date.now(), ok: false, err: e.message});
    dlog(failures >= 3 ? "error" : "warn", `Position update failed: ${e.message || e}`);
    if (isOffline()) {
      if (!wasOffline) dlog("error", "Showing OFFLINE: no position data for over a minute");
      wasOffline = true; feat = null; renderFeatured();
    }
  } finally {
    if (DIAG.polls.length > 60) DIAG.polls.splice(0, DIAG.polls.length - 60);
    busy = false; updateFooter(); scheduleDiag();
    timer = setTimeout(poll, S.demo ? 2000 : failures >= 3 ? POLL_MS * 2 : POLL_MS);
  }
}

async function start(){
  pickLang();
  try {
    await Promise.race([
      Promise.all(["700 40px", "600 20px", "400 40px"].map(s => document.fonts.load(`${s} ${(THEMES[S.theme] || THEMES.classic).font}`))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch {}
  applyTheme(); applyNight(true);
  resize(); wake();
  if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => { clearTiles(); drawStatic(); redrawAll(); });
  tickClock(); setInterval(tickClock, 1000);
  audioInit();   // starts at once where the browser allows it (kiosk setups); otherwise on the first click or key press
  renderPage(); updateFooter(); keepAwake();
  if (relayV5()) syncSightings();
  const h = location.hash.slice(1);
  updateRail();
  for (const b of $("modeSw").children) b.onclick = e => { e.stopPropagation(); setMode(b.dataset.mode); };
  if (VIEWS.includes(h)) switchView(h, {instant: true});
  else if (airportMode()) switchView(null, {instant: true, page: "aplists"});
  dlog("info", `Board started · ${S.demo ? "demo mode" : relay() ? "using the home relay" : "no relay"} · watching ${S.lat.toFixed(4)}, ${S.lon.toFixed(4)}, radius ${+S.radiusKm || 15} km`);
  if (/(^|[?&])debug\b/.test(location.search)) openDiag();
  setTimeout(poll, 500);
}
start();
})();
</script>
