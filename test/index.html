<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallblatt (Test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed 1920x1080 airport flight-information board, scaled to fit any screen.
   Top: gate-style feature of the plane overhead. Bottom: today's sightings as a departures list. */
:root{
  color-scheme: dark;
  --housing:#0b0b0c;
  --wall:#050505;
  --ink:#f3f0e8;
  --amber:#f0b429;
  --muted:#959aa3;
  --line:#26272b;
  --surface:#151618;
  --f-board:"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif;
  --k:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font:15px/1.45 var(--f-board);overflow:hidden;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#stage{position:absolute;background:var(--housing);overflow:hidden}
html{touch-action:manipulation}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{cursor:pointer}

footer{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 calc(64px*var(--k)) calc(20px*var(--k));
  font-size:max(11px,calc(17px*var(--k)));letter-spacing:.03em;color:var(--muted);
  transition:opacity .6s;
}
body.idle footer{opacity:0;pointer-events:none}
footer{background:linear-gradient(transparent,rgba(0,0,0,.6));padding-top:calc(6px*var(--k));padding-bottom:calc(10px*var(--k));z-index:4;pointer-events:none}
footer #status,footer .actions{pointer-events:auto}
body.tiny footer{font-size:max(7px,calc(17px*var(--k)))}
body.tiny #btnDiag{display:none}
#btnNew{color:#17140e;background:#f2c44e;border:0;border-radius:calc(4px*var(--k));padding:calc(4px*var(--k)) calc(10px*var(--k));margin-right:calc(16px*var(--k));font-weight:700;cursor:pointer;animation:lampOn .55s linear}
.pip{position:absolute;left:calc(20px*var(--k));bottom:calc(18px*var(--k));width:max(6px,calc(9px*var(--k)));height:max(6px,calc(9px*var(--k)));
  border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none}
body.idle .pip[data-state=warn]{opacity:.8;background:var(--amber)}
body.idle .pip[data-state=off]{opacity:.9;background:#e0483d}
#status{display:flex;align-items:center;gap:.6em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .brand{margin-right:.9em;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:.55}
.dot{width:.5em;height:.5em;border-radius:50%;background:var(--muted);flex:none}
.dot[data-state=live]{background:#22a058}
.dot[data-state=demo]{background:var(--amber)}
.dot[data-state=off]{background:#c7372d}
.dot[data-state=warn]{background:var(--amber)}
#diag{position:fixed;top:16px;right:16px;bottom:16px;width:min(640px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;
  background:#0e0f11;border:1px solid var(--line);border-radius:12px;padding:16px 18px;z-index:4;
  font:13px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);-webkit-user-select:text;user-select:text;cursor:auto}
#diag header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#diag h2{font:700 22px/1 var(--f-board);letter-spacing:.06em;text-transform:uppercase;margin:0}
#diag h2 span{color:var(--muted);font-weight:400}
#diag h3{font:600 12px/1 var(--f-board);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.dstats{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.dstats dt{color:var(--muted)}
.dstats dd{margin:0;min-width:0;overflow-wrap:anywhere}
.spark{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:8px}
.spark i{width:6px;height:12px;border-radius:1px;background:#27a85e}
.spark i.f{background:#cb3a2f}.spark i.s{background:var(--amber)}
.dsrc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dsrc td{padding:3px 10px 3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dsrc td:last-child{color:var(--muted);overflow-wrap:anywhere}
#diagLogWrap{display:flex;flex-direction:column;flex:1;min-height:0}
#diagLog{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
#diagLog li{display:grid;grid-template-columns:auto 3.6em 1fr;gap:10px;padding:2px 0}
#diagLog time,#diagLog .tag{color:var(--muted)}
.lv-warn{color:var(--amber)}.lv-error{color:#ff6b5e}.lv-debug{color:#a3a7ae}.good{color:#45d483}.bad{color:#ff6b5e}.meh{color:var(--amber)}
#diagText{position:fixed;left:-9999px;top:0;width:10px;height:10px}
.actions{display:flex;gap:.4em;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:.25em .7em;cursor:pointer}
button:hover,button:focus-visible{color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.empty{color:var(--muted);margin:0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 16px}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
label.check{flex-direction:row;align-items:center;gap:8px}
input,select{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--amber)}
output{color:var(--ink);letter-spacing:0}
input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--amber)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.primary{background:var(--amber);color:#15130e;border-color:var(--amber);font-weight:600}
.primary:hover,.primary:focus-visible{color:#15130e;opacity:.92}
textarea.fav{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-height:2.4em;resize:vertical}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
.times{display:flex;gap:8px;align-items:center}
.times input{width:auto;flex:1}
#shade{position:absolute;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none;transition:opacity 2s}
.photo{position:absolute;overflow:hidden;pointer-events:none}
.photo canvas{display:block;width:100%;height:100%}
.photo.plain{border-radius:6px;box-shadow:inset 0 0 0 2px #000,0 6px 18px rgba(0,0,0,.6)}
.photo.screen{border-radius:calc(5px*var(--k));box-shadow:0 0 calc(20px*var(--k)) rgba(165,190,225,.13)}
.photo.screen.on{animation:screenOn .95s ease-out both}
body.lite .photo.screen.on{animation:screenOnLite .8s ease-out both}
@keyframes screenOnLite{0%{opacity:0}16%{opacity:.8}24%{opacity:.45}100%{opacity:1}}
@keyframes screenOn{0%{opacity:0;filter:brightness(.5) saturate(.2)}16%{opacity:.8}24%{opacity:.45}38%{opacity:1;filter:brightness(1.4) saturate(.75)}100%{opacity:1;filter:none}}
#photoImg{display:none}
#stage canvas#flipCv{z-index:2;pointer-events:none}
/* push buttons: plain ivory caps that light up warm white, with a small flicker as the bulb comes on */
.rail{position:absolute;display:flex;z-index:2}
.cap{position:relative;flex:none;width:calc(104px*var(--k));height:calc(44px*var(--k));margin:0 0 0 calc(14px*var(--k));padding:0;border:0;border-radius:calc(4px*var(--k));
  display:grid;place-items:center;text-align:center;font:700 calc(13.5px*var(--k))/1.1 var(--f-board);letter-spacing:.06em;text-transform:uppercase;
  color:rgba(24,22,18,.74);background:linear-gradient(#97928a,#7b776e 70%,#6e6a63);
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(4px*var(--k)) 0 calc(3px*var(--k)) #000,inset 0 calc(1px*var(--k)) 0 rgba(255,255,255,.28),inset 0 calc(-3px*var(--k)) calc(5px*var(--k)) rgba(0,0,0,.3);
  transition:box-shadow .4s ease-out,transform .14s ease-out,filter .3s}
#railPages .cap,#railViews .cap{width:calc(126px*var(--k));display:flex;align-items:center;justify-content:center;gap:calc(7px*var(--k));padding:0 calc(8px*var(--k))}
#railPages .cap .ico,#railViews .cap .ico{flex:none;width:calc(18px*var(--k));height:calc(18px*var(--k));opacity:.8}
#railPages .cap span,#railViews .cap span{text-align:left}
.cap:first-child{margin-left:0}
.cap[aria-current=page],.cap[aria-pressed=true]{color:#17140e;background:radial-gradient(75% 70% at 50% 44%,#fffdf6,#f6ecd4 60%,#e2d0a4);transform:translateY(calc(2.5px*var(--k)));
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(255,224,150,.3),
    inset 0 0 calc(12px*var(--k)) rgba(255,206,120,.5);
  animation:lampOn .55s linear}
.cap.go[aria-pressed=true]{background:radial-gradient(75% 70% at 50% 44%,#eaffd8,#9be07f 58%,#55a443);box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,
  0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(140,235,110,.3),inset 0 0 calc(12px*var(--k)) rgba(40,120,20,.4)}
@keyframes lampOn{0%{filter:brightness(.45)}12%{filter:brightness(1.12)}19%{filter:brightness(.72)}32%{filter:brightness(1.04)}100%{filter:none}}
body.lite .cap[aria-current=page],body.lite .cap[aria-pressed=true]{animation:none}
.cap:hover:not([aria-current]):not([aria-pressed=true]):not(:disabled){filter:brightness(1.12)}
.cap:active:not(:disabled){transform:translateY(calc(3.5px*var(--k)))}
.cap:disabled{cursor:default;filter:brightness(.6)}
.cap.small{width:auto;min-width:calc(64px*var(--k));height:calc(34px*var(--k));padding:0 calc(12px*var(--k));font-size:calc(12px*var(--k))}
.cap.big{width:calc(150px*var(--k));height:calc(56px*var(--k));font-size:calc(16px*var(--k))}
#viewTools{z-index:2}
#modeSw button{position:absolute;z-index:3;padding:0;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:calc(6px*var(--k));outline:none}
#modeSw button:focus-visible{box-shadow:0 0 0 calc(2px*var(--k)) #f6c54a}
#radarCv{position:absolute;z-index:1;pointer-events:none}
#stage #radarCv{inset:auto}

/* Settings: a cockpit panel. Plates with screws, rotary selectors, flip switches, thumbwheels and amber read-outs. */
#cockpit{position:absolute;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.12fr);grid-template-rows:minmax(0,1.12fr) minmax(0,1fr);gap:calc(18px*var(--k));
  font-family:var(--f-board);color:#d8d3c6}
.plate{position:relative;min-width:0;overflow:hidden;background:linear-gradient(#28292c,#1a1b1d);border-radius:calc(8px*var(--k));padding:calc(10px*var(--k)) calc(22px*var(--k)) calc(12px*var(--k));
  box-shadow:0 calc(6px*var(--k)) calc(16px*var(--k)) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 4px rgba(0,0,0,.5);
  display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-content:start;align-items:stretch;gap:calc(8px*var(--k))}
/* Realistic look (Settings → Display; body.real): brushed, bevelled plates, engraved labels, metal knob caps and glowing
   displays. The board's glass glare is #glass. */
#glass{position:absolute;inset:0;pointer-events:none;display:none}
body.real #glass{display:block;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 7%),
  linear-gradient(118deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.012) 33%,rgba(255,255,255,0) 33.3%),
  radial-gradient(ellipse 75% 70% at 50% 42%,rgba(0,0,0,0) 62%,rgba(0,0,0,.2) 100%)}
body.real .plate{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 1px,rgba(0,0,0,.022) 1px 2px,rgba(255,255,255,0) 2px 4px),linear-gradient(#2e2f33,#1a1b1e);
  box-shadow:0 calc(6px*var(--k)) calc(16px*var(--k)) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.05),inset -1px 0 0 rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.65),inset 0 -6px 10px rgba(0,0,0,.35)}
body.real .inst>span,body.real .plate h3{text-shadow:0 1px 0 rgba(255,255,255,.07),0 -1px 0 rgba(0,0,0,.95)}
body.real .inst{box-shadow:inset 0 calc(2px*var(--k)) calc(4px*var(--k)) rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.06)}
body.real .rotary .knob::before{background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 42%),
  conic-gradient(#9a9ea5,#4b4e53,#a7abb1,#43464b,#9a9ea5,#4b4e53,#a7abb1,#43464b,#9a9ea5);box-shadow:0 1px 2px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.35)}
body.real .lcd{text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.55),0 0 1px rgba(246,197,74,.8);
  background-image:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(#0b0e09,#151b10)}
.plate>i{position:absolute;width:calc(9px*var(--k));height:calc(9px*var(--k));border-radius:50%;
  background:linear-gradient(35deg,transparent 42%,rgba(0,0,0,.75) 42% 58%,transparent 58%),radial-gradient(circle at 35% 35%,#8d9095,#45474c 60%,#1b1c1f)}
.plate>i:nth-of-type(1){left:calc(8px*var(--k));top:calc(8px*var(--k))}.plate>i:nth-of-type(2){right:calc(8px*var(--k));top:calc(8px*var(--k))}
.plate>i:nth-of-type(3){left:calc(8px*var(--k));bottom:calc(8px*var(--k))}.plate>i:nth-of-type(4){right:calc(8px*var(--k));bottom:calc(8px*var(--k))}
.plate h3{grid-column:1/-1;display:flex;align-items:center;gap:calc(10px*var(--k));margin:0 0 calc(4px*var(--k));font:600 calc(13px*var(--k))/1 var(--f-board);
  letter-spacing:.22em;text-transform:uppercase;color:rgba(214,208,194,.72);text-shadow:0 -1px 0 rgba(0,0,0,.8)}
.plate h3::before,.plate h3::after{content:"";flex:1;height:1px;background:rgba(214,208,194,.25)}
/* each control sits in its own recessed cell, with its name engraved on a strip above it */
.inst{grid-column:span var(--span,1);min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--k));padding:calc(5px*var(--k)) calc(6px*var(--k)) calc(6px*var(--k));
  border-radius:calc(5px*var(--k));background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.12));box-shadow:inset 0 calc(1px*var(--k)) calc(3px*var(--k)) rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.05)}
.inst[data-hint]{position:relative}
.inst[data-hint]::after{content:attr(data-hint);position:absolute;left:50%;bottom:calc(100% + 8px*var(--k));z-index:30;width:max-content;max-width:calc(240px*var(--k));padding:calc(7px*var(--k)) calc(10px*var(--k));border-radius:calc(6px*var(--k));background:rgba(12,13,15,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 calc(6px*var(--k)) calc(18px*var(--k)) rgba(0,0,0,.6);color:#e9e5da;font:500 calc(13px*var(--k))/1.35 var(--f-board);letter-spacing:0;text-transform:none;text-align:left;white-space:normal;pointer-events:none;opacity:0;transform:translate(-50%,calc(4px*var(--k)));transition:opacity .15s,transform .15s}
.inst[data-hint]:hover::after,.inst[data-hint]:focus-within::after{opacity:1;transform:translate(-50%,0);transition-delay:.35s}
@media (pointer:coarse){   /* a phone: inside the control's own cell (plates clip what sticks out), after a tap */
  .inst[data-hint]::after{left:calc(6px*var(--k));right:calc(6px*var(--k));bottom:calc(6px*var(--k));width:auto;max-width:none;transform:none;text-align:center}
  .inst[data-hint]:hover::after,.inst[data-hint]:focus-within::after{opacity:0;transform:none}
  .inst[data-hint].hinting::after{opacity:1;transform:none;transition-delay:0s}
  .inst[data-hint]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
}
.inst>span{order:-1;align-self:stretch;padding:0 calc(2px*var(--k)) calc(5px*var(--k));border-bottom:1px solid rgba(214,208,194,.16);
  font:700 calc(11.5px*var(--k))/1.15 var(--f-board);letter-spacing:.09em;text-transform:uppercase;color:rgba(238,233,220,.9);text-align:center;text-shadow:0 -1px 0 rgba(0,0,0,.85)}
.inst.wide{grid-column:1/-1;align-items:stretch}
.inst.wide>span{text-align:left}
.inst .lcd{width:100%;box-sizing:border-box}
.inst.loc{justify-content:flex-start;gap:calc(8px*var(--k))}
.inst.loc p{margin:0;font:500 calc(12.5px*var(--k))/1.3 var(--f-board);color:rgba(214,208,194,.7);text-align:center}
.inst.loc .ask{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(10px*var(--k))}
.inst.loc .ask[hidden],.inst.loc .cap[hidden]{display:none}
.inst.loc .ask .cap{margin:0}
.lcd{font:600 calc(20px*var(--k))/1 var(--f-board);letter-spacing:.08em;text-transform:uppercase;color:#f6c54a;background:linear-gradient(#0b0e09,#151b10);
  border:0;border-radius:calc(4px*var(--k));padding:calc(6px*var(--k)) calc(10px*var(--k));text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.45);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #050505,0 1px 0 calc(3px*var(--k)) rgba(255,255,255,.05);-webkit-user-select:text;user-select:text}
.lcd:focus{outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #f6c54a}
/* rotary selector: a fluted knob, its pointer on the chosen position, the positions engraved round it */
.rotary{position:relative;width:calc(140px*var(--k));height:calc(100px*var(--k));outline:none;cursor:pointer}
.rotary .knob{position:absolute;left:50%;top:calc(58px*var(--k));width:calc(54px*var(--k));height:calc(54px*var(--k));margin:calc(-27px*var(--k)) 0 0 calc(-27px*var(--k));border-radius:50%;
  background:repeating-conic-gradient(#1a1b1e 0 6deg,#3b3d42 6deg 12deg);box-shadow:0 calc(4px*var(--k)) calc(8px*var(--k)) rgba(0,0,0,.7),0 0 0 calc(2px*var(--k)) #0b0b0c;
  transform:rotate(var(--rot,0deg));transition:transform .34s cubic-bezier(.82,0,.22,1.28)}   /* stiff, then a snap */
.rotary .knob::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#62656b,#2a2b2f 60%,#18191b)}
.rotary .knob::after{content:"";position:absolute;left:50%;top:7%;width:calc(3px*var(--k));height:38%;margin-left:calc(-1.5px*var(--k));border-radius:2px;background:#f3f0e8;box-shadow:0 0 calc(4px*var(--k)) rgba(255,255,255,.4)}
.rotary:focus-visible .knob{box-shadow:0 0 0 calc(2px*var(--k)) #f6c54a}
.rotary b{position:absolute;left:50%;top:calc(58px*var(--k));font:600 calc(11px*var(--k))/1 var(--f-board);letter-spacing:.06em;color:rgba(214,208,194,.55);white-space:nowrap;
  transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-46px*var(--k))) rotate(calc(-1*var(--a)));transition:color .2s,text-shadow .2s}
.rotary b.on{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.55)}
/* flip switch: an aircraft toggle. A chrome bat handle with a ball tip sticks out of a knurled bushing in a hex nut and
   snaps between tilted up (on) and tilted down (off), swinging through the middle in 3D. */
.toggle{position:relative;width:calc(72px*var(--k));height:calc(90px*var(--k));padding:0;border:0;background:none;cursor:pointer;outline:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:700 calc(10.5px*var(--k))/1 var(--f-board);letter-spacing:.12em;color:rgba(214,208,194,.36)}
.toggle .sw{position:relative;width:calc(40px*var(--k));height:calc(40px*var(--k));perspective:calc(150px*var(--k))}
.toggle .sw::before{content:"";position:absolute;inset:0;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);
  background:linear-gradient(165deg,#e0e2e6,#9a9ea4 28%,#55585e 58%,#2b2d31 85%)}

  background:repeating-linear-gradient(#3c3e43 0 calc(2px*var(--k)),#1a1b1e calc(2px*var(--k)) calc(4px*var(--k)));box-shadow:0 0 0 calc(2px*var(--k)) #0b0b0c}

<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fx" role="img" aria-label="Flight board showing planes passing overhead"></canvas>
  <div id="glass" aria-hidden="true"></div>
  <div id="modeSw"><button type="button" data-mode="overhead" aria-label="Overhead">​</button><button type="button" data-mode="airport" aria-label="Airport">​</button></div>
  <div class="photo screen" id="photoFrame" hidden><canvas id="photoCv"></canvas></div>
  <img id="photoImg" alt="" referrerpolicy="no-referrer">
  <canvas id="radarCv" hidden aria-hidden="true"></canvas>
  <canvas id="flipCv" hidden aria-hidden="true"></canvas>
  <div class="rail" id="railPages" aria-label="Pages"></div>
  <div class="rail" id="railViews" aria-label="Views"></div>
  <div class="rail" id="viewTools" hidden></div>
  <section id="cockpit" hidden aria-label="Settings"></section>
  <div id="shade"></div>
  <span class="pip" id="pip" aria-hidden="true"></span>
  <footer>
    <div id="status"><b class="brand">Fallblatt</b><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
    <div class="actions">
      <button id="btnNew" type="button" hidden></button>

</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const W = 1920, H = 1080, M = 64, IW = W - 2 * M;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let FONT = '"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif';
const COL = {housing:"#0b0b0c", rule:"#25262a", ink:"#f3f0e8", amber:"#f0b429", muted:"#959aa3", labelEn:"#6d7179"};
const FLAP = ["#2b2c2f", "#232427", "#1c1d1f", "#161719"];
const THEMES = {
  classic:   {font:'"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif', flap:["#2b2c2f","#232427","#1c1d1f","#161719"],
              ink:"#f3f0e8", accent:"#f0b429", label2:"#6d7179", metal:["#1d1e21","#141517","#18191c"]},

              ink:"#f5f7fb", accent:"#9ccaff", label2:"#71809c", metal:["#151d2d","#0e1422","#121a29"]}
};
let METAL = THEMES.classic.metal;
// Aircraft worth running to the window for. Type codes are ICAO designators.
const SPECIAL_TYPES = {A388:"SUPERJUMBO", B741:"JUMBO", B742:"JUMBO", B743:"JUMBO", B744:"JUMBO", B748:"JUMBO", B74S:"JUMBO", B74R:"JUMBO",
  A3ST:"BELUGA", A337:"BELUGA", A124:"ANTONOV", A225:"ANTONOV", AN22:"ANTONOV", CONC:"CONCORDE",
  C17:"MILITARY", C5M:"MILITARY", A400:"MILITARY", C130:"MILITARY", C30J:"MILITARY", K35R:"MILITARY", EUFI:"MILITARY", F16:"MILITARY", F35:"MILITARY", P3:"MILITARY",
  C295:"MILITARY", E390:"MILITARY",
  EC35:"HELICOPTER", EC45:"HELICOPTER", EC30:"HELICOPTER", EC55:"HELICOPTER", EC75:"HELICOPTER", AS50:"HELICOPTER", AS65:"HELICOPTER",

  S76:"HELICOPTER", NH90:"HELICOPTER", UH1:"HELICOPTER", H60:"HELICOPTER", AS32:"HELICOPTER"};
// Home airports the board knows runways for (true track of each runway direction).
const AIRPORTS = {VIE: {icao:"LOWW", name:"Vienna", lat:48.1103, lon:16.5697, rwys:[[116,"11"],[296,"29"],[164,"16"],[344,"34"]],
  runways:[["11", 48.1228, 16.5334, "29", 48.1090, 16.5756], ["16", 48.1198, 16.5782, "34", 48.0886, 16.5913]]}};   // runway ends (OurAirports)

/* Drums: the order a real flap module turns through. */
const DRUM_ALPHA = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-/:,'&()";
const DRUM_DIGIT = " 0123456789:";
const DRUM_ALT = " 0123456789,.FTKMH/";   /* short drums for values that change often */
const DRUM_POS = " 0123456789.:KMNESWICADORV";       // the letters of "in … sec" in every language too
const TRENDS = ["", "UP", "LEVEL", "DOWN"];
const TREND_COLOR = {UP: "#45d483", LEVEL: "#c9c6bf", DOWN: "#f6be35"};
const REMARKS = ["", "OVERHEAD", "INBOUND", "FLYING BY", "OUTBOUND", "PASSED", "NEARBY", "NO TRAFFIC", "OFFLINE", "ARRIVING", "DEPARTING", "OVERFLIGHT",
  "CLOSE BY", "NEW TYPE", "NEW AIRLINE", "FAVOURITE", "SUPERJUMBO", "JUMBO", "BELUGA", "ANTONOV", "CONCORDE", "MILITARY", "HELICOPTER", "SPECIAL", "EMERGENCY",
  "DIVERTED", "CARGO", "BIZJET", "PRIVATE", "TAKE-OFF", "CLIMBING", "APPROACH", "FINAL", "LANDED",
  "ABOVE CLOUD", "POLICE", "AMBULANCE", "RESCUE", "FIREFIGHTER", "GOVERNMENT", "ROYAL", "HISTORIC", "CELEBRITY", "VIP",
  "SKYDIVING", "AEROBATIC", "SURVEY", "UNUSUAL"];

const GOLD = {fill:["#e6b94a","#c99a24"], fg:"#1b1508"};
const REMARK_LOOK = {
  OVERHEAD:{fill:["#27a85e","#1d8a4b"], fg:"#ffffff"},
  INBOUND:{fill:["#f6be35","#dc9f1d"], fg:"#17140d"},
  PASSED:{fill:["#3d3f44","#303237"], fg:"#d9d6cf"},
  NEARBY:{fill:["#2c6ec4","#215aa2"], fg:"#ffffff"},
  "FLYING BY":{fill:["#2c6ec4","#215aa2"], fg:"#ffffff"},
  OUTBOUND:{fill:["#3d3f44","#303237"], fg:"#d9d6cf"},
  "NO TRAFFIC":{fill:["#2f3135","#26282b"], fg:"#a6a49e"},

  ARRIVING:{fg:"#45d483"}, DEPARTING:{fg:"#f6be35"}, OVERFLIGHT:{fg:"#86b8ff"}, "CLOSE BY":{fg:"#86b8ff"},
  "NEW TYPE":{fill:["#f4ecd8","#e2d6b8"], fg:"#8c1c1c", tint:"#efe2c0"}, "NEW AIRLINE":{fill:["#f4ecd8","#e2d6b8"], fg:"#8c1c1c", tint:"#efe2c0"},
  FAVOURITE:{fill:["#c93d80","#a72f68"], fg:"#ffffff"},
  SUPERJUMBO:GOLD, JUMBO:GOLD, BELUGA:GOLD, ANTONOV:GOLD, CONCORDE:GOLD, SPECIAL:GOLD,
  MILITARY:{fill:["#66743f","#525e31"], fg:"#f1f0de"}, HELICOPTER:{fill:["#22908f","#187473"], fg:"#ffffff"},
  EMERGENCY:{fill:["#e0372c","#bb2a20"], fg:"#ffffff"},
  DIVERTED:{fill:["#ef8a2b","#d0701a"], fg:"#1a1206"}, CARGO:{fill:["#8a5a2b","#714820"], fg:"#fbe9d2"},
  BIZJET:{fill:["#2d3a55","#232e45"], fg:"#e6c66e", tint:"#e6c66e"}, PRIVATE:{fill:["#4b5560","#3c454e"], fg:"#e8ebee"},
  "TAKE-OFF":{fill:["#f6be35","#dc9f1d"], fg:"#17140d"}, CLIMBING:{fill:["#3d3f44","#303237"], fg:"#f6be35"},
  APPROACH:{fill:["#2c6ec4","#215aa2"], fg:"#ffffff"}, FINAL:{fill:["#27a85e","#1d8a4b"], fg:"#ffffff"},
  LANDED:{fill:["#3d3f44","#303237"], fg:"#d9d6cf"},
  "ABOVE CLOUD":{fill:["#8796a8","#6e7c8e"], fg:"#ffffff"},
  POLICE:{fill:["#1f4e9c","#173d7c"], fg:"#ffffff"}, AMBULANCE:{fill:["#ecebe6","#d3d2cc"], fg:"#c4231b"},
  RESCUE:{fill:["#e86a1f","#c4561a"], fg:"#ffffff"}, FIREFIGHTER:{fill:["#b5261d","#931e17"], fg:"#ffd84a"},
  GOVERNMENT:{fill:["#23324f","#1a263d"], fg:"#e6c66e", tint:"#e6c66e"}, ROYAL:{fill:["#5b2a86","#47206a"], fg:"#f2d36b"},
  HISTORIC:{fill:["#7a5b3a","#634a2f"], fg:"#f4e6c8"}, CELEBRITY:{fill:["#9b2f8f","#7d2573"], fg:"#ffffff"},
  VIP:{fill:["#1d1d1f","#121214"], fg:"#e6c66e", tint:"#e6c66e"}, SKYDIVING:{fill:["#1f8a9b","#176f7d"], fg:"#ffffff"},
  AEROBATIC:{fill:["#d8402f","#b53424"], fg:"#ffffff"}, SURVEY:{fill:["#5b6470","#4a525c"], fg:"#e8ebee"}, UNUSUAL:GOLD
};

/* ---------- settings ---------- */
const DEFAULTS = {place:"Vienna", lat:48.2085, lon:16.3731, radiusKm:15, home:"VIE", maxAltFt:60000, units:"metric", sound:true, soundSet:"recorded", bell:"airport", real:true, speedPct:85, quick:false, refreshS:10, logos:true, overKm:3, demo:false,
  theme:"classic", rotateS:30, statsPage:true, ding:true, favs:"", chimes:true, imperfect:true, night:true, nightFrom:"22:30", nightTo:"07:00", nightDim:40, airtimeMin:3, quality:"auto", mode:"overhead", lang:"auto"};
// A guest (friends and family, relay 19+) keeps their own settings: in this browser under their own key, and on their
// profile, which the relay hands back (OVERHEAD_GUEST). Their place comes first, in the phone app's welcome.
const GUEST = window.OVERHEAD_GUEST || null;
if (GUEST && !(GUEST.settings && GUEST.settings.located)) location.replace("/app/");
const SKEY = GUEST ? "od.settings.g." + GUEST.id : "od.settings";
function loadSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; } catch {}
  if (saved.v !== 2) ["lat", "lon", "place", "home", "radiusKm", "units"].forEach(k => delete saved[k]);  // older saves stored every field
  delete saved.v;
  const {mode, live, livePrev, ...shared} = GUEST && GUEST.settings || {};      // the style stays this device's own (1.40)
  return {...DEFAULTS, ...shared, ...saved};
}
function saveSettings(){
  const changed = {v: 2};
  for (const [k, v] of Object.entries(S)) if (k !== "proxy" && JSON.stringify(v) !== JSON.stringify(DEFAULTS[k])) changed[k] = v;
  try { localStorage.setItem(SKEY, JSON.stringify(changed)); } catch {}
  if (GUEST) {                                       // the profile learns them too, always with the place
    const {v, live, livePrev, mode, ...mine} = changed;     // following the phone and the style are this device's own          // following the phone is this device's own business
    fetch(`${relay()}/me`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({settings: {...mine, lat: S.lat, lon: S.lon, radiusKm: S.radiusKm, place: S.place, located: true}})}).catch(() => {});
  }
}
Object.assign(DEFAULTS, window.OVERHEAD_DEFAULTS || {});  // location etc. supplied by the home relay
let S = loadSettings();
S.sound = S.sound === true || (typeof S.sound === "string" && S.sound !== "off");
(() => { // URL overrides for this session, handy for kiosk setups: ?lat=..&lon=..&radius=..&home=..&place=..&demo
  const q = new URLSearchParams(location.search);
  const num = k => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : null; };
  if (num("lat") != null) S.lat = num("lat");
  if (num("lon") != null) S.lon = num("lon");
  if (num("radius") != null) S.radiusKm = num("radius");
  if (num("over") != null) S.overKm = num("over");
  if (num("maxalt") != null) S.maxAltFt = num("maxalt");
  if (q.get("home")) S.home = q.get("home").toUpperCase();
  if (q.get("place")) S.place = q.get("place");
  if (q.get("units")) S.units = q.get("units") === "metric" ? "metric" : "aviation";
  if (q.has("sound")) { const v = q.get("sound"); S.sound = !(v === "0" || v === "off"); }
  if (q.get("proxy")) S.proxy = q.get("proxy");
  if (q.has("hd")) S.hd = q.get("hd") !== "0";
  if (q.has("logos")) S.logos = !(q.get("logos") === "0" || q.get("logos") === "off");
  if (num("speed") != null) S.speedPct = num("speed");
  if (num("refresh") != null) S.refreshS = Math.min(60, Math.max(3, num("refresh")));
  if (q.has("demo") || /demo/i.test(location.hash)) S.demo = q.get("demo") !== "0";
  if (q.get("theme") && THEMES[q.get("theme")]) S.theme = q.get("theme");
  if (num("rotate") != null) S.rotateS = num("rotate");
  if (q.get("favs")) S.favs = q.get("favs");
  if (q.get("lang")) S.lang = q.get("lang");
  if (q.get("mode")) S.mode = q.get("mode") === "airport" ? "airport" : "overhead";
  if (q.has("chimes")) S.chimes = q.get("chimes") !== "0";
  if (q.has("night")) S.night = q.get("night") !== "0";
  if (num("airtime") != null) S.airtimeMin = Math.max(0, num("airtime"));
  if (q.get("quality")) S.quality = q.get("quality");
})();

/* ---------- diagnostics log ---------- */
const DIAG = {log: [], polls: [], relayEvents: [], relayStatus: null, closest: null, open: false};
let diagQueued = false;
function dlog(level, msg){
  DIAG.log.unshift({t: Date.now(), level, msg: String(msg), src: "board"});
  if (DIAG.log.length > 400) DIAG.log.length = 400;
  scheduleDiag();
}
function scheduleDiag(){ if (DIAG.open && !diagQueued) { diagQueued = true; requestAnimationFrame(() => renderDiag()); } }

/* ---------- text helpers ---------- */
function clean(s){
  return String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "SS").replace(/[Øø]/g, "O").replace(/[Łł]/g, "L")
    .toUpperCase().replace(/[^A-Z0-9 .\-\/:,'&()]/g, "").replace(/\s+/g, " ").trim();
}
function trimTo(s, w){
  if (s.length <= w) return s;
  let cut = -1;
  for (let i = Math.min(w, s.length - 1); i > 0; i--) if (" -/".includes(s[i])) { cut = i; break; }
  return (cut >= Math.ceil(w * .5) ? s.slice(0, cut) : s.slice(0, w)).replace(/[\s,.:\/&'-]+$/, "");   // "PENDIK, ISTANBUL" → "PENDIK", not "PENDIK,"
}
const nf = new Intl.NumberFormat("en-US");
function hhmm(d = new Date()){ return d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}); }

/* ---------- canvas, scaling ---------- */
/* Drawing quality. Fire TV and LG TVs have little graphics power: they draw at 1080p, at 30 frames a second,
   with shorter flap runs and a smaller cache ("1080p, lighter for TVs"). Everything else draws as sharp as the
   screen allows, up to 4K. Settings → Drawing quality, or ?quality=1080 / 1440 / high. */
const WEAK_TV = /AFT[A-Z]|Silk\/|AmazonWebAppPlatform|Web0S|webOS|NetCast|Android TV|GoogleTV|BRAVIA|AndroidTV/i.test(navigator.userAgent || "");
const quality = () => { const q = S.quality || "auto"; return q === "auto" ? (WEAK_TV ? "1080" : "high") : q; };
const LITE = () => quality() === "1080";
const pxCap = () => ({"1080": 1, "1440": 4 / 3}[quality()] || 2);
const stage = $("stage"), bg = $("bg"), fx = $("fx");
const bgx = bg.getContext("2d"), fxx = fx.getContext("2d");
let PX = 1, K = 1;

/* ---------- fields ---------- */
const fields = {}, allCells = [];
const LIST_ROWS = 8;
function def(id, o){ fields[id] = {id, drum: DRUM_ALPHA, style: "ink", align: "left", loud: .7, ...o}; }

def("remarks", {kind:"word",  n:9, dur:70, words:"remarks", label:["Status",""], loud:1});
def("fromCode",{kind:"chars", n:3, dur:82, style:"amber", label:["From","Von"], loud:1});
def("fromCity",{kind:"chars", n:11, dur:82, loud:1});
def("toCode",  {kind:"chars", n:3, dur:82, style:"amber", label:["To","Nach"], loud:1});
def("toCity",  {kind:"chars", n:11, dur:82, loud:1});
def("type",    {kind:"chars", n:17, dur:66, label:["Aircraft","Flugzeug"]});
def("tier",    {kind:"word",  n:1, dur:110, words:"tier"});
def("reg",     {kind:"chars", n:7, dur:66, label:["Reg.","Kennz."]});
def("alt",     {kind:"chars", n:9, dur:66, drum:DRUM_ALT, align:"right", label:["Altitude","Höhe"]});
def("trend",   {kind:"word",  n:2, dur:110, words:"trend"});
def("speed",   {kind:"chars", n:8, dur:66, drum:DRUM_ALT, align:"right", label:["Speed","Geschw."]});
def("pos",     {kind:"chars", n:9, dur:66, drum:DRUM_POS, label:["Position",""]});
def("depTime", {kind:"chars", n:5, dur:80, drum:DRUM_DIGIT, label:["Departure","Abflug"]});
def("arrTime", {kind:"chars", n:5, dur:80, drum:DRUM_DIGIT, label:["Arrival","Ankunft"]});
def("airTime", {kind:"chars", n:5, dur:80, drum:DRUM_DIGIT, label:["Flight time","Flugzeit"]});
def("toGo",    {kind:"chars", n:9, dur:70, drum:DRUM_ALT, align:"right", label:["To go",""]});
def("seen",    {kind:"chars", n:20, dur:60, style:"amber", label:["Remarks",""]});
for (let i = 0; i < LIST_ROWS; i++) {
  const lab = (en, de) => i === 0 ? [en, de] : null;
  def(`l${i}time`,   {kind:"chars", n:5, drum:DRUM_DIGIT, dur:60, style:"amber", loud:.5, label:lab("Time","Zeit")});
  def(`l${i}logo`,   {kind:"logo",  n:3, dur:95, loud:.5});

  def(`l${i}from`,   {kind:"chars", n:11, dur:60, loud:.5, label:lab("From","Von")});
  def(`l${i}to`,     {kind:"chars", n:11, dur:60, loud:.5, label:lab("To","Nach")});
  def(`l${i}type`,   {kind:"chars", n:18, dur:60, loud:.5, label:lab("Aircraft","Flugzeug")});
  def(`l${i}remarks`,{kind:"word",  n:10, dur:60, words:"remarks", small:true, loud:.5, label:lab("Remarks","Hinweis")});
}
// The lower half rotates between pages. Spotted today uses the list flaps; the other pages have their own.
const LIST_IDS = [];
for (let i = 0; i < LIST_ROWS; i++) LIST_IDS.push(`l${i}time`, `l${i}logo`, `l${i}flight`, `l${i}from`, `l${i}to`, `l${i}type`, `l${i}remarks`);
const PAGE_FIELDS = {stats: [], aircraft: [], aplists: []};
function pdef(pg, id, o){ def(id, {...o, pageOff: true}); PAGE_FIELDS[pg].push(id); }
pdef("stats", "stPlanes",   {kind:"chars", n:4, dur:70, drum:DRUM_DIGIT, align:"right", label:["Planes","Flugzeuge"]});
pdef("stats", "stAirlines", {kind:"chars", n:3, dur:70, drum:DRUM_DIGIT, align:"right", label:["Airlines","Airlines"]});

function drawPlaque(g){
  const x = M, y = Y.list0 + 6, w = PHOTO.w, h = PHOTO.h;
  for (const [i, a] of [[3, .55], [9, .4]]) {                          // a double groove round the plate

}

// @sounds-end
// The recordings are decoded once, when sound first starts; until then (and with CLASSIC) the synthesised sounds play.
const SND = {};
let sndLoading = false;
function loadSounds(){
  if (sndLoading || !actx) return;
  sndLoading = true;
  for (const [k, list] of Object.entries(SOUND_DATA)) {
    SND[k] = [];
    for (const b64 of list) {
      try {
        const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const p = actx.decodeAudioData(bin.buffer, buf => SND[k].push(buf), () => {});   // the callback form: older TVs
        if (p && p.catch) p.catch(() => {});
      } catch {}
    }
  }
}
// One take of a recording at time t: a different one each time, a hair faster or slower, so repeats never sound copied.
// `hall`: how much of it also goes into the hall (a longer, softer echo than the room every sound gets).
function sample(k, t, gain, rate = 1, hall = 0){
  const list = SND[k];
  if (!list || !list.length) return false;            // the recorded sounds always (1.33: no more classic switch)
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = list[Math.floor(Math.random() * list.length)];
  src.playbackRate.value = rate * (.97 + Math.random() * .06);
  g.gain.value = gain;
  src.connect(g).connect(sfxOut());
  if (hall && sfxHall) { const h = actx.createGain(); h.gain.value = hall; g.connect(h).connect(sfxHall); }
  src.start(t);

}
function audioInit(){
  if (!S.sound && !S.chimes && !soundForced) return;
  try {
    // iPhones mute web sound with the ring/silent switch unless the page says it plays sound on purpose (Safari 16.4+).
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(actx.sampleRate * .012);
      noise = actx.createBuffer(1, len, actx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
      loadSounds();
    }
    actx.resume();
  } catch { actx = null; }
}
// Every sound goes through one output (sfxOut): a cut of the deepest rumble and of the hiss above ~6.5 kHz, a short room
// and a limiter. Phone and TV speakers play neither the low tones nor the top octaves and add a room of their own;
// headphones play everything, bone-dry, so the synthesised clicks sounded hissy and fake there (the noise bursts reach
// up to 20 kHz). The limiter keeps overlapping clicks from distorting.

    hp.type = "highpass"; hp.frequency.value = 110; hp.Q.value = .7;

    lp.type = lp2.type = "lowpass"; lp.frequency.value = lp2.frequency.value = 6500; lp.Q.value = lp2.Q.value = .6;
    lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1;
    trim.gain.value = .82;                            // the compressor's own make-up gain, taken back

    for (let c = 0; c < 2; c++) {

function clack(n){

  // The flaps always clack synthesised (chosen over the recording); the recordings are for the controls.
  const src = actx.createBufferSource(); src.buffer = noise; src.playbackRate.value = .7 + Math.random() * .5;
  const fl = actx.createBiquadFilter(); fl.type = "bandpass"; fl.frequency.value = 1400 + Math.random() * 1800; fl.Q.value = 1;

// A soft station chime: two falling notes for special aircraft, three rising ones for favourites.
// The airport bell (1.32): three soft notes rising, like the chime before an announcement in a terminal. Each is a
// vibraphone-like bar (its fundamental with the 4th and 10th partials, a slow tremolo, a long ring) struck by a soft
// mallet; the last rings longest. tools/sounds/make_bell.py renders the same into app/airport-bell.wav.
const BELL_NOTES = [[392.00, 0, 2.6], [523.25, .55, 2.6], [659.25, 1.1, 4.0]];
function airportBell(out, t0){

    bus.gain.value = .84; trem.frequency.value = 4.6; depth.gain.value = .16;
    trem.connect(depth).connect(bus.gain); bus.connect(out); trem.start(t); trem.stop(t + len + .1);
    for (const [mult, amp, dec] of [[1, .30, len], [4, .055, len * .3], [10, .012, len * .1]]) {

function chime(kind, opts = {}){
  if ((!opts.force && (!S.chimes || nightOn)) || !actx || actx.state !== "running") return;
  const t0 = actx.currentTime + .03, out = actx.createGain();
  out.gain.value = .55; out.connect(sfxOut());
  if (kind === "special" && (opts.set || S.bell || "airport") === "airport") return airportBell(out, t0);
  const notes = kind === "fav" ? [[523.25, 0], [659.25, .17], [783.99, .34]] : kind === "emergency" ? [[587.33, 0], [440, .32], [587.33, .64], [440, .96]] : [[659.25, 0], [523.25, .55]];
  for (const [freq, dt] of notes) {
    for (const [mult, amp] of [[1, .26], [2.01, .07], [3.02, .035], [4.2, .015]]) {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + dt;
      o.type = "sine"; o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8 / mult);
      o.connect(g).connect(out); o.start(t); o.stop(t + 1.9);
    }
  }
}

// The achievement's sound (1.45): a short festive flourish, a quick rising arpeggio of bright bells, a sparkle on top
// and a held major chord under the last note, so it doesn't sound like the airport bell.
function fanfare(){
  if (!S.chimes || nightOn || !actx || actx.state !== "running") return;
  const t0 = actx.currentTime + .03, out = actx.createGain();
  out.gain.value = .5; out.connect(sfxOut());
  const bell = (f, t, amp, dec) => {
    for (const [mult, a] of [[1, 1], [2, .32], [3, .12], [4.2, .05]]) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = mult === 1 ? "triangle" : "sine"; o.frequency.value = f * mult;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp * a, t + .008); g.gain.exponentialRampToValueAtTime(amp * a * .002, t + dec / mult ** .5);
      o.connect(g).connect(out); o.start(t); o.stop(t + dec + .05);
    }
  };
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, t0 + i * .085, .2, .6));          // C E G C, quick
  for (const f of [523.25, 659.25, 783.99, 1046.5]) bell(f, t0 + .38, .085, 1.9);                // the chord, held
  [2093, 2637, 3136, 2637, 3520].forEach((f, i) => bell(f, t0 + .42 + i * .06, .035, .35));    // sparkle
}

// The seat-belt ding (1.43): one soft cabin chime when a new plane comes on top (not for a special plane, which has its
// own chime; not at night, not in the background, not twice within 15 s, not in the first seconds; 1.45: only on the
// main page, and the recorded Airbus cabin chime, both notes since 1.46, with the synthesised one until it is decoded).
let dingAt = 0;
function seatbeltDing(force){
  if (!force && (!S.ding || nightOn || document.hidden || !onMainPage() || performance.now() < 8000 || Date.now() - dingAt < 15000)) return;
  if (!actx || actx.state !== "running") return;
  dingAt = Date.now();
  const t = actx.currentTime + .02, out = actx.createGain(), rec = SND.ding && SND.ding[0];
  if (rec) {
    const src = actx.createBufferSource();
    src.buffer = rec; out.gain.value = .32;
    src.connect(out).connect(sfxOut()); src.start(t);
    return;
  }
  out.gain.value = .16; out.connect(sfxOut());                  // subtle: well under the chimes
  for (const [mult, amp, dec] of [[1, .30, 1.4], [2.76, .04, .5], [.5, .03, .9]]) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = 1318.5 * mult;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .012); g.gain.exponentialRampToValueAtTime(amp * .002, t + dec);
    o.connect(g).connect(out); o.start(t); o.stop(t + dec + .05);
  }
}

/* ---------- geometry ---------- */
const COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
function geo(ac){
  const kx = 111.32 * Math.cos(S.lat * Math.PI / 180), ky = 110.57;
  const x = (ac.lon - S.lon) * kx, y = (ac.lat - S.lat) * ky;
  const dist = Math.hypot(x, y), brg = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
  const v = (ac.gs || 0) * 1.852 / 3600, th = (ac.track || 0) * Math.PI / 180;
  const vx = v * Math.sin(th), vy = v * Math.cos(th), vv = vx * vx + vy * vy;
  const tcpa = vv > 0 ? -(x * vx + y * vy) / vv : Infinity;
  const cpa = isFinite(tcpa) ? Math.hypot(x + vx * tcpa, y + vy * tcpa) : dist;
  return {dist, dir: COMPASS[Math.round(brg / 45) % 8], tcpa, cpa};
}

// Every request to the relay carries this page's session id, so the relay can tell the screens apart (see sayHello).
const SID = (Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(-12);
function tagged(url){
  const r = relay();
  return r && String(url).startsWith(r + "/") ? url + (String(url).includes("?") ? "&" : "?") + "sid=" + SID : url;
}
function timedFetch(url, opts = {}, ms = 9000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  url = tagged(url);
  return fetch(url, {...opts, signal: ctl.signal, cache: "no-store"}).finally(() => clearTimeout(t));
}
function netError(e, what){
  if (e && e.name === "AbortError") return `${what} didn't answer within 9 seconds`;
  if (e instanceof TypeError) return relay() && what === "relay" ? "couldn't reach the relay (is serve.py still running?)" : `${what} couldn't be reached or blocked the request`;
  return (e && e.message) || String(e);
}

  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  url = tagged(url);
  try {
    const res = await fetch(url, {...opts, signal: ctl.signal, cache: "no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

      throw new Error(`relay answered ${res.status}${detail ? ": " + detail : ""}`);

    const src = res.headers.get("X-Relay-Source") || "relay", fresh = res.headers.get("X-Relay-Data") || "live";
    if (src !== feedName && feedName) dlog("info", `Now getting positions from ${src}`);

function baseInfo(ac){

// Route databases go by callsign, and airlines reuse callsigns: Ryanair's RYR3EG can be listed as Newcastle to
// Dublin while that callsign is flying something else entirely. So a listed route is only used when the plane
// is actually somewhere along it, heading the right way.
function routeFits(from, to, ac){
  if (!from || !to || from.lat == null || to.lat == null || ac.lat == null || ac.lon == null) return true;
  const rad = Math.PI / 180, R = 6371, p = {lat: ac.lat, lon: ac.lon};
  const ang = (a, b) => Math.acos(Math.min(1, Math.max(-1, Math.sin(a.lat * rad) * Math.sin(b.lat * rad) +
    Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.cos((b.lon - a.lon) * rad))));
  const brg = (a, b) => Math.atan2(Math.sin((b.lon - a.lon) * rad) * Math.cos(b.lat * rad),
    Math.cos(a.lat * rad) * Math.sin(b.lat * rad) - Math.sin(a.lat * rad) * Math.cos(b.lat * rad) * Math.cos((b.lon - a.lon) * rad));
  const len = ang(from, to) * R, d13 = ang(from, p), toDest = ang(p, to) * R;
  if (Math.min(d13 * R, toDest) < 80) return true;                       // climbing out or coming in
  const off = brg(from, p) - brg(from, to);
  const xt = Math.asin(Math.sin(d13) * Math.sin(off)) * R;                // distance from the straight route
  const at = Math.acos(Math.min(1, Math.max(-1, Math.cos(d13) / Math.cos(xt / R)))) * R * (Math.cos(off) < 0 ? -1 : 1);
  if (Math.abs(xt) > Math.max(120, len * .3) || at < -100 || at > len + 100) return false;
  if (ac.track != null) {                                                 // and flying towards the destination
    const want = (brg(p, to) / rad + 360) % 360, diff = Math.abs(((ac.track - want + 540) % 360) - 180);
    if (diff > 100) return false;

  return true;
}
// Both route sources are asked at once (1.25.2; before, adsb.lol only after adsbdb, which could take its full 9 s

async function routeLookup(cs, ac){
  const db = routeDb(cs, ac), lol = routeLol(cs, ac);

  let out = first.r;

  else out = out ? (await Promise.race([db, new Promise(ok => setTimeout(() => ok(null), 1500))]) || out) : await db;
  if (!out) dlog("debug", `No route listed for ${cs}`);

async function routeDb(cs, ac){

        to: {code: fr.destination.iata_code || fr.destination.icao_code, city: fr.destination.municipality || fr.destination.name, lat: fr.destination.latitude, lon: fr.destination.longitude}
      };

      } else {

        if (fr.airline && fr.airline.name) out.airline = fr.airline.name;

/* ---------- footer ---------- */
function updateFooter(){
  const dot = $("dot"), txt = $("statusText");
  dot.dataset.state = ""; txt.textContent = T("Connecting…");
  if (S.demo) { dot.dataset.state = "demo"; txt.textContent = T("Demo mode · sample flights, not live data"); }
  else if (isOffline()) { dot.dataset.state = "off"; txt.textContent = relay() ? T("No flight data for over a minute · retrying · press D for details") : T("No flight data here · open the board through your home relay"); }
  else if (!lastOk && failures) { dot.dataset.state = "warn"; txt.textContent = T(failures > 1 ? "Waiting for flight data · {n} failed attempts · press D for details" : "Waiting for flight data · {n} failed attempt · press D for details", {n: failures}); }
  else if (lastOk) {
    const age = Math.round((Date.now() - lastOk) / 1000), stale = lastFreshness.startsWith("stale");
    dot.dataset.state = failures || stale ? "warn" : "live";
    // All well: a quiet "Live". The details (source, age, range) are in Diagnostics, and here when something is off.
    txt.textContent = failures || stale || age > 30
      ? T("Live via {src}", {src: feedName}) + (stale ? " " + T("(last good copy)") : "") + " · " + T("updated {n} s ago", {n: age}) + (failures ? " · " + T("retrying") : "")
      : T("Live · {n} aircraft nearby", {n: nearbyCount ?? 0});
  }
  if (nightOn) txt.textContent += " · " + T("night mode");
  else if ((S.sound || S.chimes) && !(actx && actx.state === "running")) txt.textContent += " · " + T("click or press any key for sound");
  $("pip").dataset.state = dot.dataset.state || "";
}

// A newer version published? Ask for this page now and then and light a lamp to update; nothing reloads by itself.
function watchVersion(show){
  const check = async () => {
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), {cache: "no-store"});
      const m = /\{v: "(\d[\d.]*)"/.exec(await r.text());
      if (m && m[1] !== VERSION) show(m[1]);
    } catch {}
  };
  setTimeout(check, 60000);
  setInterval(check, 10 * 60000);
}
watchVersion(v => { const b = $("btnNew"); b.textContent = T("New version · tap to update") + ` (${v})`; b.hidden = false; b.onclick = () => location.reload(); });

  ["The sound for special planes: an AIRPORT announcement bell, or the CLASSIC two-note chime. Plays when you switch.", "Der Klang für besondere Flugzeuge: eine FLUGHAFEN-Durchsageglocke oder der KLASSISCHE Zweiklang. Spielt beim Umschalten.", "Le son des avions spéciaux : un carillon d'annonce d'AÉROPORT, ou le CLASSIQUE à deux notes. Joué quand vous changez.", "El sonido de los aviones especiales: una campana de aviso de AEROPUERTO o el CLÁSICO de dos notas. Suena al cambiar.", "Het geluid voor bijzondere toestellen: een LUCHTHAVEN-omroepbel of de KLASSIEKE tweetoon. Speelt bij het omschakelen."],
  ["With the app open, a notification plays the bell. To hear it when the app is closed (Android): save the bell, then in Android's settings open Notifications → Chrome → {host} → Sound and pick it.", "Bei offener App spielt eine Benachrichtigung die Glocke. Um sie auch bei geschlossener App zu hören (Android): Glocke speichern, dann in den Android-Einstellungen Benachrichtigungen → Chrome → {host} → Ton öffnen und sie wählen.", "Application ouverte, une notification joue le carillon. Pour l'entendre application fermée (Android) : enregistrez le carillon, puis dans les réglages d'Android ouvrez Notifications → Chrome → {host} → Son et choisissez-le.", "Con la app abierta, una notificación suena con la campana. Para oírla con la app cerrada (Android): guarda la campana y en los ajustes de Android abre Notificaciones → Chrome → {host} → Sonido y elígela.", "Met de app open speelt een melding de bel. Om hem ook met de app dicht te horen (Android): bewaar de bel en kies hem in de Android-instellingen bij Meldingen → Chrome → {host} → Geluid."],

  ["Favourites light up and get a chime and a notification. Hidden planes stay off the board, the lists and the notifications (they are still in the logbook).", "Favoriten leuchten auf und bekommen einen Gong und eine Benachrichtigung. Ausgeblendete Flugzeuge erscheinen nicht auf der Tafel, in den Listen und Benachrichtigungen (im Logbuch bleiben sie).", "Les favoris s'allument et ont un carillon et une notification. Les avions masqués n'apparaissent plus sur le tableau, dans les listes ni les notifications (ils restent dans le carnet).", "Los favoritos se iluminan y tienen campanilla y notificación. Los aviones ocultos no salen en el panel, las listas ni las notificaciones (siguen en el registro).", "Favorieten lichten op en krijgen een gong en een melding. Verborgen toestellen blijven van het bord, de lijsten en de meldingen (in het logboek staan ze nog)."],

  ["Every sighting scores by how rare its type is, from how many fly today: common 1, uncommon 3, rare 10, very rare 25, special 50. Types fill the collections.", "Jede Sichtung zählt danach, wie selten ihr Typ ist, gemessen daran, wie viele heute fliegen: gewöhnlich 1, ungewöhnlich 3, selten 10, sehr selten 25, besonders 50. Typen füllen die Sammlungen.", "Chaque observation compte selon la rareté de son type, d'après le nombre en service : commun 1, peu commun 3, rare 10, très rare 25, spécial 50. Les types remplissent les collections.", "Cada avistamiento puntúa según lo raro que es su tipo, por cuántos vuelan hoy: común 1, poco común 3, raro 10, muy raro 25, especial 50. Los tipos llenan las colecciones.", "Elke waarneming scoort naar hoe zeldzaam het type is, naar hoeveel er vandaag vliegen: gewoon 1, ongewoon 3, zeldzaam 10, zeer zeldzaam 25, bijzonder 50. Typen vullen de verzamelingen."],

  ["Hi {name}!", "Hallo {name}!", "Bonjour {name} !", "¡Hola, {name}!", "Hoi {name}!"],

  ["Your location, Spotted today and logbook are your own, and this device remembers you.", "Dein Standort, Heute gesichtet und dein Logbuch gehören dir, und dieses Gerät merkt sich dich.", "Votre position, Vus aujourd'hui et votre carnet sont les vôtres, et cet appareil se souvient de vous.", "Tu ubicación, Vistos hoy y tu cuaderno son tuyos, y este dispositivo te recuerda.", "Je locatie, Vandaag gezien en je logboek zijn van jou, en dit apparaat onthoudt je."],
  ["To keep it like an app: on Android, Chrome's menu → Add to home screen; on an iPhone, Safari → Share → Add to Home Screen.", "Als App behalten: auf Android Chrome-Menü → Zum Startbildschirm hinzufügen; auf dem iPhone Safari → Teilen → Zum Home-Bildschirm.", "Pour l'avoir comme une appli : sur Android, menu de Chrome → Ajouter à l'écran d'accueil ; sur iPhone, Safari → Partager → Sur l'écran d'accueil.", "Para tenerla como app: en Android, menú de Chrome → Añadir a pantalla de inicio; en iPhone, Safari → Compartir → Añadir a pantalla de inicio.", "Als app bewaren: op Android Chrome-menu → Toevoegen aan startscherm; op een iPhone Safari → Deel → Zet op beginscherm."],
  ["Privacy: the relay keeps your name, the devices you joined on, your settings and the planes spotted around your location, nothing else. Flight positions come from adsb.lol, adsb.fi and airplanes.live (ODbL) and AvioADSB (CC BY 4.0), routes and aircraft from adsbdb, photos from airport-data.com.", "Datenschutz: Das Relay speichert deinen Namen, die Geräte, mit denen du beigetreten bist, deine Einstellungen und die Flugzeuge rund um deinen Standort, sonst nichts. Flugpositionen kommen von adsb.lol, adsb.fi und airplanes.live (ODbL) und AvioADSB (CC BY 4.0), Routen und Flugzeuge von adsbdb, Fotos von airport-data.com.", "Confidentialité : le relais conserve votre nom, les appareils avec lesquels vous avez rejoint, vos réglages et les avions repérés autour de votre position, rien d'autre. Les positions viennent d'adsb.lol, adsb.fi et airplanes.live (ODbL) et d'AvioADSB (CC BY 4.0), les routes et avions d'adsbdb, les photos d'airport-data.com.", "Privacidad: el relé guarda tu nombre, los dispositivos con los que te uniste, tus ajustes y los aviones vistos cerca de tu ubicación, nada más. Las posiciones vienen de adsb.lol, adsb.fi y airplanes.live (ODbL) y AvioADSB (CC BY 4.0), las rutas y aviones de adsbdb, las fotos de airport-data.com.", "Privacy: de relay bewaart je naam, de apparaten waarmee je bent aangesloten, je instellingen en de vliegtuigen rond je locatie, verder niets. Posities komen van adsb.lol, adsb.fi en airplanes.live (ODbL) en AvioADSB (CC BY 4.0), routes en toestellen van adsbdb, foto's van airport-data.com."],
  ["Turn the knobs and flip the switches, then press Save. Settings are kept with your profile, on every device you use.", "Drehe die Knöpfe und lege die Schalter um, dann Speichern drücken. Die Einstellungen gehören zu deinem Profil, auf jedem Gerät.", "Tournez les boutons et basculez les interrupteurs, puis appuyez sur Enregistrer. Les réglages suivent votre profil, sur chaque appareil.", "Gira los mandos y acciona los interruptores, luego pulsa Guardar. Los ajustes van con tu perfil, en cada dispositivo.", "Draai aan de knoppen en zet de schakelaars om, druk dan op Opslaan. De instellingen horen bij je profiel, op elk apparaat."],

  ["The town of the place being watched, shown under the title. It fills itself in when the location changes.", "Der Ort, der beobachtet wird, unter dem Titel. Er füllt sich selbst aus, wenn sich der Standort ändert.", "La ville surveillée, affichée sous le titre. Elle se remplit seule quand la position change.", "La ciudad que se vigila, bajo el título. Se rellena sola cuando cambia la ubicación.", "De plaats die gevolgd wordt, onder de titel. Vult zichzelf in als de locatie verandert."],

  ["Your profile, places and logbook stay on the relay; sign back in with your account or a new invite link.", "Dein Profil, deine Orte und dein Logbuch bleiben auf dem Relais; melde dich mit deinem Konto oder einem neuen Einladungslink wieder an.", "Votre profil, vos lieux et votre carnet restent sur le relais ; reconnectez-vous avec votre compte ou un nouveau lien d'invitation.", "Tu perfil, lugares y cuaderno se quedan en el relé; vuelve a entrar con tu cuenta o un nuevo enlace de invitación.", "Je profiel, plaatsen en logboek blijven op de relay; log weer in met je account of een nieuwe uitnodigingslink."],

  ["Logbook: everything you've ever spotted: types, airlines, records, the collection, trophies and the weekly bingo.", "Logbuch: alles, was du je gesichtet hast: Typen, Airlines, Rekorde, die Sammlung, Trophäen und das Wochen-Bingo.", "Carnet : tout ce que vous avez repéré : types, compagnies, records, la collection, les trophées et le bingo de la semaine.", "Cuaderno: todo lo que has visto: tipos, aerolíneas, récords, la colección, trofeos y el bingo semanal.", "Logboek: alles wat je ooit zag: types, maatschappijen, records, de verzameling, trofeeën en de bingo van de week."],

  ["Settings: your place, what counts as overhead, the look and the sounds. Press Save to keep them.", "Einstellungen: dein Ort, was als überfliegend zählt, das Aussehen und die Töne. Speichern, um sie zu behalten.", "Réglages : votre lieu, ce qui compte comme au-dessus, l'apparence et les sons. Enregistrez pour les garder.", "Ajustes: tu lugar, qué cuenta como encima, el aspecto y los sonidos. Pulsa Guardar para mantenerlos.", "Instellingen: je plaats, wat als overvliegend telt, het uiterlijk en de geluiden. Druk op Bewaren om ze te houden."],

  ["A plane can be more than one of these; the board shows the most special one, in the order listed. Arriving, Departing and Overflight only show in the lists.", "Ein Flugzeug kann mehreres davon sein; die Tafel zeigt das Besonderste, in der Reihenfolge der Liste. Ankunft, Abflug und Überflug erscheinen nur in den Listen.", "Un avion peut cumuler plusieurs de ces statuts ; le tableau affiche le plus spécial, dans l'ordre de la liste. Arrivée, Départ et Survol n'apparaissent que dans les listes.", "Un avión puede ser varias de estas cosas; el panel muestra la más especial, en el orden de la lista. Llegada, Salida y Sobrevuelo solo aparecen en las listas.", "Een vliegtuig kan meer dan één hiervan zijn; het bord toont de meest bijzondere, in de volgorde van de lijst. Aankomst, Vertrek en Overvlucht staan alleen in de lijsten."],
  ["The logbook is kept by the home relay (version 5 or newer), so every screen shares it and nothing is lost on a restart.", "Das Logbuch führt das Relais zu Hause (ab Version 5), so teilen es alle Bildschirme und bei einem Neustart geht nichts verloren.", "Le carnet est tenu par le relais à la maison (version 5 ou plus), donc tous les écrans le partagent et rien n'est perdu au redémarrage.", "El registro lo guarda el relé de casa (versión 5 o posterior), así que todas las pantallas lo comparten y no se pierde nada al reiniciar.", "Het logboek wordt bijgehouden door het relais thuis (versie 5 of nieuwer), zodat alle schermen het delen en er bij een herstart niets verloren gaat."],

  ["shows the plane flying over you right now on a split-flap board, like the ones in airport halls, with what passed today, a lifetime logbook and a radar. In Airport style it follows the planes taking off and landing at an airport.", "zeigt das Flugzeug, das gerade über dich fliegt, auf einer Fallblattanzeige wie in Flughafenhallen, dazu was heute vorbeikam, ein Logbuch und ein Radar. In der Flughafen-Ansicht folgt sie den startenden und landenden Flugzeugen eines Flughafens.", "affiche l'avion qui passe au-dessus de vous sur un tableau à palettes comme dans les halls d'aéroport, avec ce qui est passé aujourd'hui, un carnet de bord et un radar. En vue Aéroport, il suit les avions qui décollent et atterrissent.", "muestra el avión que pasa ahora sobre ti en un panel de paletas como los de los aeropuertos, con lo que pasó hoy, un registro y un radar. En la vista Aeropuerto sigue los aviones que despegan y aterrizan.", "toont het vliegtuig dat nu boven je vliegt op een klapbord zoals in vertrekhallen, met wat vandaag langskwam, een logboek en een radar. In de luchthavenweergave volgt het de vliegtuigen die opstijgen en landen."],
  ["Made by Belstria, with Claude Code. Source and guide:", "Gemacht von Belstria, mit Claude Code. Quellcode und Anleitung:", "Réalisé par Belstria, avec Claude Code. Source et guide :", "Hecho por Belstria, con Claude Code. Código y guía:", "Gemaakt door Belstria, met Claude Code. Broncode en handleiding:"],
  ["Positions from adsb.lol, adsb.fi and airplanes.live through the relay at home, with AvioADSB (CC BY 4.0) as a backup; routes and aircraft from adsbdb and adsb.lol, flight numbers from Flightradar24, times from Vienna Airport, airports from OurAirports, the watchlist from plane-alert-db (ODbL), photos from airport-data.com, logos from Aviasales.", "Positionen von adsb.lol, adsb.fi und airplanes.live über das Relais zu Hause, mit AvioADSB (CC BY 4.0) als Reserve; Routen und Flugzeuge von adsbdb und adsb.lol, Flugnummern von Flightradar24, Zeiten vom Flughafen Wien, Flughäfen von OurAirports, die Beobachtungsliste von plane-alert-db (ODbL), Fotos von airport-data.com, Logos von Aviasales.", "Positions d'adsb.lol, adsb.fi et airplanes.live via le relais à la maison, avec AvioADSB (CC BY 4.0) en secours ; trajets et avions d'adsbdb et adsb.lol, numéros de vol de Flightradar24, horaires de l'aéroport de Vienne, aéroports d'OurAirports, la liste de surveillance de plane-alert-db (ODbL), photos d'airport-data.com, logos d'Aviasales.", "Posiciones de adsb.lol, adsb.fi y airplanes.live a través del relé de casa, con AvioADSB (CC BY 4.0) como reserva; rutas y aviones de adsbdb y adsb.lol, números de vuelo de Flightradar24, horarios del aeropuerto de Viena, aeropuertos de OurAirports, la lista de vigilancia de plane-alert-db (ODbL), fotos de airport-data.com, logotipos de Aviasales.", "Posities van adsb.lol, adsb.fi en airplanes.live via het relais thuis, met AvioADSB (CC BY 4.0) als reserve; routes en toestellen van adsbdb en adsb.lol, vluchtnummers van Flightradar24, tijden van Vienna Airport, luchthavens van OurAirports, de volglijst van plane-alert-db (ODbL), foto's van airport-data.com, logo's van Aviasales."],

  ["The phone didn't say where it is. Is location turned on?", "Das Telefon hat seinen Standort nicht gemeldet. Ist die Standortermittlung an?", "Le téléphone n'a pas indiqué sa position. La localisation est-elle activée ?", "El teléfono no ha dicho dónde está. ¿Está activada la ubicación?", "De telefoon gaf geen locatie door. Staat locatie aan?"],
  ["Update the Fallblatt app to use the phone's location.", "Aktualisiere die Fallblatt-App, um den Standort des Telefons zu nutzen.", "Mettez à jour l'app Fallblatt pour utiliser la position du téléphone.", "Actualiza la app Fallblatt para usar la ubicación del teléfono.", "Werk de Fallblatt-app bij om de locatie van de telefoon te gebruiken."],
  ["This screen can't share its location: browsers only do that for https pages or pages opened on the relay's own computer. Type the latitude and longitude instead.", "Dieser Bildschirm kann seinen Standort nicht teilen: Browser tun das nur für https-Seiten oder Seiten auf dem Computer des Relais. Gib Breite und Länge stattdessen ein.", "Cet écran ne peut pas partager sa position : les navigateurs ne le font que pour les pages https ou ouvertes sur l'ordinateur du relais. Saisissez plutôt la latitude et la longitude.", "Esta pantalla no puede compartir su ubicación: los navegadores solo lo hacen en páginas https o abiertas en el ordenador del relé. Escribe la latitud y la longitud.", "Dit scherm kan zijn locatie niet delen: browsers doen dat alleen voor https-pagina's of pagina's op de computer van het relais. Typ de breedte- en lengtegraad in."],

/* ---------- cards (1.34): a plane, an airline or a place, and the favourite/hide sheet ----------
   One overlay (#cardBox) for the boards (a tap or a click) and the phone app. The facts come from what the board knows,
   the logbook and the relay's airport list; a short description and pictures from Wikipedia (Wikimedia Commons). */
const listsOk = () => !S.demo && !!relay() && (window.OVERHEAD_RELAY_VERSION || 0) >= 31;
let cardTok = 0;
function cardOpen(html, wire){
  let box = $("cardBox");
  if (!box) {
    box = document.createElement("div"); box.id = "cardBox"; document.body.appendChild(box);
    box.addEventListener("click", e => { if (e.target === box) cardClose(); });
    box.addEventListener("click", cardToggle);
  }
  box.innerHTML = `<div class="cardIn" role="dialog" aria-modal="true"><button class="cardX" type="button" aria-label="${escH(T("Close"))}">×</button>${html}</div>`;
  box.hidden = false;
  box.querySelector(".cardX").onclick = () => { ctlSound.press(); cardClose(); };
  if (wire) wire(box.querySelector(".cardIn"));
  return ++cardTok;
}
function cardClose(){ const b = $("cardBox"); if (b) b.hidden = true; cardTok++; }
// 1.42: a card that needs to look things up opens as a short loading window and shows itself once everything (the
// words, the airport, the pictures) is in, or after a few seconds with what there is, so nothing jumps about.
const cardWait = (p, ms) => Promise.race([Promise.resolve(p).catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
const cardLoading = () => cardOpen(`<div class="cLoad"><span class="cSpin" aria-hidden="true"></span>${escH(T("Loading …"))}</div>`);
function imgsReady(html, ms = 3000){
  const srcs = [...String(html).matchAll(/<img[^>]+src="([^"]+)"/g)].map(m => m[1].replace(/&amp;/g, "&"));
  return cardWait(Promise.all(srcs.map(s => new Promise(r => { const i = new Image(); i.referrerPolicy = "no-referrer"; i.onload = i.onerror = r; i.src = s; }))), ms);
}
async function cardWhenReady(tok, html, wire){
  await imgsReady(html);
  if (tok === cardTok && cardOpenNow()) cardOpen(html, wire);
}
const cardOpenNow = () => { const b = $("cardBox"); return !!b && !b.hidden; };
addEventListener("keydown", e => {
  if (cardOpenNow() && (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 10009 || e.keyCode === 461)) { e.preventDefault(); e.stopPropagation(); cardClose(); }
}, true);
const factsHtml = facts => `<dl class="cFacts">${facts.filter(f => f[1]).map(([k, v, w]) => `<div${w ? ' class="w"' : ""}><dt>${escH(T(k))}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
const wikiHtml = w => w ? `<p class="cWiki">${escH(w.text.length > 420 ? w.text.slice(0, 400).replace(/\s+\S*$/, "") + " …" : w.text)}` +
  (w.url ? ` <a href="${escH(w.url)}" target="_blank" rel="noopener">${escH(T("More on Wikipedia"))}</a>` : "") + `</p>` : "";
function chipHtml(r){
  const L = REMARK_LOOK[r] || {}, fill = L.fill ? L.fill[0] : "#2f3135";
  return r ? `<span class="cChip" style="background:${fill};color:${L.fg || "#e8ebee"}">${escH(T(r))}</span>` : "";
}

// Wikipedia's summary of a page (its first paragraph and picture), in English: the titles are matched in English.
const wikiCache = new Map();
function wikiPage(title){
  const k = String(title || "");
  if (!k) return Promise.resolve(null);
  if (!wikiCache.has(k)) wikiCache.set(k, fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(k.replace(/ /g, "_"))}`)
    .then(r => r.ok ? r.json() : null).then(j => j && j.type !== "disambiguation" && j.extract ? {title: j.title, desc: j.description || "", text: j.extract,
      img: j.thumbnail ? j.thumbnail.source : "", url: j.content_urls && j.content_urls.desktop ? j.content_urls.desktop.page : ""} : null).catch(() => null));
  return wikiCache.get(k);
}
// The first of these pages that is about the right kind of thing (its description says so).
async function wikiFind(titles, like){
  for (const t of [...new Set(titles.filter(Boolean))]) {
    const p = await wikiPage(t);
    if (p && (!like || like.test(p.desc + " " + p.text.slice(0, 160)))) return p;
  }
  return null;
}
const wikiImg = (src, w) => String(src || "").replace(/\/(\d+)px-/, `/${w}px-`);
// A picture of the aircraft model, for planes with no photo of their own (1.34): the model's Wikipedia picture.
const modelPics = new Map();
// The names to try for a model: as given, "747 8F" as "747-8F", without a freighter/variant letter, the family.
function modelTitles(names){
  const out = [];
  for (const n0 of [].concat(names)) {
    const n = String(n0 || "").trim().replace(/(\d)\s+(\d)/, "$1-$2");
    if (n) out.push(n, n.replace(/neo$/i, "neo family"), n.replace(/(\d)[A-Z]{1,3}$/, "$1"), n.replace(/-\d+\w*$/, ""));
  }
  return out;
}
const modelWiki = names => wikiFind(modelTitles(names), /aircraft|airliner|airplane|aeroplane|helicopter|jet|plane|airlifter|transport/i);
function modelPic(names, onReady){
  names = [].concat(names).map(n => String(n || "").trim()).filter(Boolean);
  if (!names.length || S.demo) return "";
  const k = names.join("|").toLowerCase();
  if (modelPics.has(k)) return modelPics.get(k);
  modelPics.set(k, "");
  modelWiki(names).then(p => { if (p && p.img) { modelPics.set(k, wikiImg(p.img, 500)); if (onReady) onReady(); } });
  return "";
}
const isModelPic = src => /wikimedia\.org|wikipedia\.org/.test(String(src || ""));

// Favourites and hidden planes (lists on the relay): the sheet for one plane, the toggles on the cards, the manager.
const KIND_NAME = {reg: "Aircraft", type: "Type", airline: "Airline", flight: "Flight"};
async function listsSave(next){
  const r = await fetch(`${relay()}/lists`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(next)});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  userLists = {fav: j.fav || [], hide: j.hide || [], at: Date.now(), v: userLists.v + 1};
  if (typeof listsChanged === "function") listsChanged();
}
// The choices for one plane: its aircraft (registration), type, airline and flight, those it has.
function listChoices(x){
  const cs = clean(x.callsign || ""), al = (cs.match(/^([A-Z]{3})\d/) || [])[1] || "";
  return [["reg", x.reg, x.reg], ["type", x.typeCode, x.type || TYPES[x.typeCode] || x.typeCode],
    ["airline", al, x.airline || (AIRLINES[al] || [])[1] || al], ["flight", cs, x.flight || cs]].filter(c => c[1]).map(([k, v, n]) => ({k, v: clean(v), n: String(n || v)}));
}
const sameItem = (i, c) => i.k === c.k && clean(i.v).replace(/[\s-]/g, "") === clean(c.v).replace(/[\s-]/g, "");
const inList = (L, c) => L.some(i => sameItem(i, c));
async function listFlip(which, c){
  const on = inList(userLists[which], c), next = {fav: userLists.fav.slice(), hide: userLists.hide.slice()};
  ctlSound.toggle(!on);

  if (!on) { const o = which === "fav" ? "hide" : "fav"; next[o] = next[o].filter(i => !sameItem(i, c)); }   // not both at once

// Toggle buttons for some choices: data-tog = "fav|hide", the choice in data-k/v/n; cardToggle handles every card.

  `data-k="${c.k}" data-v="${escH(c.v)}" data-n="${escH(c.n)}"><small>${escH(T(KIND_NAME[c.k]))}</small>${label || escH(c.n)}</button>`;

    listsSave(next).then(() => favManager(el)).catch(e => note(e.message));

// What was typed: "Austrian (AUA)" from the list, an airline or type code, a registration, a flight, or a name.
function parseListEntry(t){
  t = String(t || "").trim();
  if (!t) return null;
  const m = t.match(/\(([A-Z0-9]{2,4})\)\s*$/i), code = clean(m ? m[1] : t).replace(/\s/g, ""), name = m ? t.replace(/\s*\([^)]*\)\s*$/, "") : "";
  if (AIRLINES[code]) return {k: "airline", v: code, n: name || AIRLINES[code][1]};
  if (TYPES[code]) return {k: "type", v: code, n: name || TYPES[code]};
  const byName = Object.entries(AIRLINES).find(([, a]) => clean(a[1]) === clean(t));
  if (byName) return {k: "airline", v: byName[0], n: byName[1][1]};
  const tName = Object.entries(TYPES).find(([, n]) => clean(n) === clean(t));
  if (tName) return {k: "type", v: tName[0], n: tName[1]};
  const tWord = Object.entries(TYPES).find(([, n]) => (" " + clean(n) + " ").includes(" " + code + " "));   // A380, 787 ...
  if (tWord && !/^[A-Z]{3}\d/.test(code)) return {k: "type", v: tWord[0], n: tWord[1]};
  if (/^[A-Z0-9]{1,2}-[A-Z0-9]{2,5}$/i.test(t) || /^N\d{1,5}[A-Z]{0,2}$/i.test(t)) return {k: "reg", v: clean(t), n: clean(t)};
  if (/^[A-Z]{3}\d[A-Z0-9]{0,4}$/i.test(code) || /^[A-Z0-9]{2}\d{1,4}[A-Z]?$/i.test(code)) return {k: "flight", v: code, n: code};
  if (/^[A-Z][A-Z0-9]{2,3}$/i.test(code)) return {k: "type", v: code, n: code};
  return null;
}
// The old Favourites text moves into the lists once (relay 31).

/* ---------- achievements (1.38) ----------
   A completed collection, a new bingo line or a trophy won (the logbook's `game`) pops up once on each device: a card
   with a little confetti and the bell, closing by itself after 10 s (a TV must never get stuck on it). What was
   already celebrated is kept in this browser; the first time, everything there is now counts as seen, quietly. */
const ACH_KEY = GUEST ? "od.ach.g." + GUEST.id : "od.ach";
const ACH_MS = 10000;
let achQueue = [], achTimer = 0;
function achList(g0){
  const out = [];
  if (!g0) return out;
  for (const s of g0.sets || []) if (s.total && (s.have || []).length >= s.total)
    out.push({k: "set:" + s.name, icon: "▣", title: T("Collection complete"), text: T("{name}: all {n} seen", {name: T(s.name), n: s.total})});
  const b = g0.bingo;
  if (b && b.week) {
    for (let n = 1; n <= Math.min(8, b.lines || 0); n++)
      out.push({k: `line:${b.week}:${n}`, icon: "▦", title: T("Bingo!"), text: n === 1 ? T("A line on this week's bingo card") : T("Line {n} on this week's bingo card", {n})});
    if (Object.keys(b.done || {}).length >= 9) out.push({k: "card:" + b.week, icon: "▦", title: T("Full card"), text: T("All nine on this week's bingo card")});
  }
  for (const id of Object.keys(g0.trophies || {})) {
    const [name, desc] = trophyText(id);
    out.push({k: "tr:" + id, icon: "★", title: T("Trophy: {name}", {name}), text: desc});
  }
  return out;
}
function achCheck(g0){
  if (!g0 || S.demo) return;
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(ACH_KEY) || "null"); } catch {}
  const all = achList(g0), first = !Array.isArray(seen);
  const known = new Set(first ? [] : seen), fresh = all.filter(a => !known.has(a.k));
  if (!first && !fresh.length) return;
  const keep = [...new Set([...(first ? [] : seen), ...all.map(a => a.k)])].slice(-400);
  try { localStorage.setItem(ACH_KEY, JSON.stringify(keep)); } catch {}
  if (first) return;                                   // the first look: what's there now was won before
  for (const a of fresh) if (!achQueue.some(q => q.k === a.k)) achQueue.push(a);
  achNext();

// One card at a time (up to three achievements on it); it waits while another card is open.
function achNext(){
  clearTimeout(achTimer);
  if (!achQueue.length) return;
  if (cardOpenNow()) { achTimer = setTimeout(achNext, 5000); return; }
  const list = achQueue.splice(0, 3);
  const tok = cardOpen(`<div class="achBadge" aria-hidden="true">${escH(list[0].icon)}</div>` +
    `<p class="shH">${escH(T("Achievement"))}</p>` +
    list.map(a => `<h3>${escH(a.title)}</h3><p class="achTx">${escH(a.text)}</p>`).join("") +
    `<div class="achBar"><i style="animation-duration:${ACH_MS}ms"></i></div>`, el => el.classList.add("ach"));
  confetti();
  fanfare();
  achTimer = setTimeout(() => { if (cardTok === tok && cardOpenNow()) cardClose(); achTimer = setTimeout(achNext, 1500); }, ACH_MS);

// A short burst of paper bits over the page (fewer and shorter on the weaker TVs; none with reduced motion).

  const bits = Array.from({length: n}, () => ({x: w / 2 + (Math.random() - .5) * w * .3, y: h * .45, vx: (Math.random() - .5) * w * .9,
    vy: -h * (.5 + Math.random() * .7), r: Math.random() * 6, vr: (Math.random() - .5) * 12, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
