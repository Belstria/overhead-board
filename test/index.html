<style>
/* Layout: a fixed 1920x1080 airport flight-information board, scaled to fit any screen.
   Top: gate-style feature of the plane overhead. Bottom: today's sightings as a departures list. */
:root{
  color-scheme: dark;
  --housing:#0b0b0c;
  --wall:#050505;
  --ink:#f3f0e8;
  --amber:#f0b429;
  --muted:#959aa3;
  --line:#26272b;
  --surface:#151618;
  --f-board:"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif;
  --k:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font:15px/1.45 var(--f-board);overflow:hidden;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#stage{position:absolute;background:var(--housing);overflow:hidden}
html{touch-action:manipulation}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{cursor:pointer}

footer{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:calc(16px*var(--k));
  padding:0 calc(64px*var(--k)) calc(20px*var(--k));
  font-size:calc(17px*var(--k));letter-spacing:.03em;color:var(--muted);
  transition:opacity .6s;
}
body.idle footer{opacity:0;pointer-events:none}
footer{background:linear-gradient(transparent,rgba(0,0,0,.6));padding-top:calc(6px*var(--k));padding-bottom:calc(10px*var(--k));z-index:4;pointer-events:none}
footer #status,footer .actions{pointer-events:auto}
footer button{border-radius:calc(6px*var(--k))}
body.tiny footer{font-size:max(7px,calc(17px*var(--k)))}
body.tiny #btnDiag{display:none}
body[data-snap] #fx{opacity:.72}
#snapTag{position:fixed;left:50%;top:calc(30px*var(--k));transform:translateX(-50%);z-index:90;padding:calc(8px*var(--k)) calc(20px*var(--k));border:calc(2px*var(--k)) solid #f2c44e;border-radius:calc(8px*var(--k));background:rgba(20,18,14,.92);color:#f2c44e;font:700 calc(24px*var(--k)) var(--f-board);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
#nvBox{position:fixed;left:50%;top:calc(22px*var(--k));transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:calc(18px*var(--k));max-width:calc(1500px*var(--k));padding:calc(14px*var(--k)) calc(16px*var(--k)) calc(14px*var(--k)) calc(26px*var(--k));border-radius:calc(10px*var(--k));background:#f2c44e;color:#17140e;font:700 calc(26px*var(--k))/1.25 var(--f-board);box-shadow:0 calc(8px*var(--k)) calc(30px*var(--k)) rgba(0,0,0,.65);animation:lampOn .55s linear}
#nvBox button{flex:none;border:0;border-radius:calc(7px*var(--k));padding:calc(10px*var(--k)) calc(20px*var(--k));background:#17140e;color:#f2c44e;font:inherit;cursor:pointer}
#nvBox button:focus{outline:calc(4px*var(--k)) solid #fff;outline-offset:calc(2px*var(--k))}
#btnNew{color:#17140e;background:#f2c44e;border:0;border-radius:calc(4px*var(--k));padding:calc(4px*var(--k)) calc(10px*var(--k));margin-right:calc(16px*var(--k));font-weight:700;cursor:pointer;animation:lampOn .55s linear}
.pip{position:absolute;left:calc(20px*var(--k));bottom:calc(18px*var(--k));width:max(6px,calc(9px*var(--k)));height:max(6px,calc(9px*var(--k)));
  border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none}
body.idle .pip[data-state=warn]{opacity:.8;background:var(--amber)}
body.idle .pip[data-state=off]{opacity:.9;background:#e0483d}
#status{display:flex;align-items:center;gap:.6em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .brand{margin-right:.9em;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:.55}
.dot{width:.5em;height:.5em;border-radius:50%;background:var(--muted);flex:none}
.dot[data-state=live]{background:#22a058}
.dot[data-state=demo]{background:var(--amber)}
.dot[data-state=off]{background:#c7372d}
.dot[data-state=warn]{background:var(--amber)}
#diag{position:fixed;top:16px;right:16px;bottom:16px;width:min(640px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;
  background:#0e0f11;border:1px solid var(--line);border-radius:12px;padding:16px 18px;z-index:4;
  font:13px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);-webkit-user-select:text;user-select:text;cursor:auto}
#diag header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#diag h2{font:700 22px/1 var(--f-board);letter-spacing:.06em;text-transform:uppercase;margin:0}
#diag h2 span{color:var(--muted);font-weight:400}
#diag h3{font:600 12px/1 var(--f-board);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.dstats{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.dstats dt{color:var(--muted)}
.dstats dd{margin:0;min-width:0;overflow-wrap:anywhere}
.spark{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:8px}
.spark i{width:6px;height:12px;border-radius:1px;background:#27a85e}
.spark i.f{background:#cb3a2f}.spark i.s{background:var(--amber)}
.dsrc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dsrc td{padding:3px 10px 3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dsrc td:last-child{color:var(--muted);overflow-wrap:anywhere}
#diagLogWrap{display:flex;flex-direction:column;flex:1;min-height:0}
#diagLog{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
#diagLog li{display:grid;grid-template-columns:auto 3.6em 1fr;gap:10px;padding:2px 0}
#diagLog time,#diagLog .tag{color:var(--muted)}
.lv-warn{color:var(--amber)}.lv-error{color:#ff6b5e}.lv-debug{color:#a3a7ae}.good{color:#45d483}.bad{color:#ff6b5e}.meh{color:var(--amber)}
#diagText{position:fixed;left:-9999px;top:0;width:10px;height:10px}
.actions{display:flex;gap:.4em;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:.25em .7em;cursor:pointer}
button:hover,button:focus-visible{color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.empty{color:var(--muted);margin:0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 16px}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
label.check{flex-direction:row;align-items:center;gap:8px}
input,select{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--amber)}
output{color:var(--ink);letter-spacing:0}
input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--amber)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.primary{background:var(--amber);color:#15130e;border-color:var(--amber);font-weight:600}
.primary:hover,.primary:focus-visible{color:#15130e;opacity:.92}
textarea.fav{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-height:2.4em;resize:vertical}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
.times{display:flex;gap:8px;align-items:center}
.times input{width:auto;flex:1}
#shade{position:absolute;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none;transition:opacity 2s}
/* 1.53: the night view, dark red on black so it doesn't light up the room */
#nightView{position:absolute;inset:0;z-index:6;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(14px*var(--k));font-family:var(--f-board);color:#7a1810;text-align:center;opacity:1;transition:opacity .4s;cursor:default}
#nightView[hidden]{display:none}
#nightView.off{opacity:0}
#nightView .nvClock{display:flex;gap:calc(14px*var(--k));margin-bottom:calc(40px*var(--k))}
#nightView .nvClock b{display:block;position:relative;width:calc(170px*var(--k));height:calc(250px*var(--k));border-radius:calc(12px*var(--k));
  background:linear-gradient(#120404,#0a0202 49.6%,#000 49.6%,#000 50.4%,#0c0303 50.4%,#070101);font:700 calc(220px*var(--k))/calc(250px*var(--k)) var(--f-board);color:#8c1d13}
#nightView .nvColon{font:700 calc(180px*var(--k))/calc(250px*var(--k)) var(--f-board);font-style:normal;color:#5c120b}
#nightView .nvFlight{font:700 calc(92px*var(--k))/1.1 var(--f-board);letter-spacing:.06em;color:#7d1a11}
#nightView .nvRoute{font:600 calc(52px*var(--k))/1.2 var(--f-board);color:#64140d;max-width:90%}
#nightView .nvType{font:500 calc(42px*var(--k))/1.2 var(--f-board);color:#50100a}
#nightView .nvNone{font:600 calc(52px*var(--k))/1.2 var(--f-board);color:#50100a}
#nightView .nvCount{margin-top:calc(56px*var(--k));font:600 calc(40px*var(--k))/1.2 var(--f-board);letter-spacing:.08em;color:#4a0f09;text-transform:uppercase}
.photo{position:absolute;overflow:hidden;pointer-events:none}
.photo canvas{display:block;width:100%;height:100%}
.photo.plain{border-radius:6px;box-shadow:inset 0 0 0 2px #000,0 6px 18px rgba(0,0,0,.6)}
.photo.screen{border-radius:calc(5px*var(--k));box-shadow:0 0 calc(20px*var(--k)) rgba(165,190,225,.13)}
.photo.screen.on{animation:screenOn .95s ease-out both}
body.lite .photo.screen.on{animation:screenOnLite .8s ease-out both}
@keyframes screenOnLite{0%{opacity:0}16%{opacity:.8}24%{opacity:.45}100%{opacity:1}}
@keyframes screenOn{0%{opacity:0;filter:brightness(.5) saturate(.2)}16%{opacity:.8}24%{opacity:.45}38%{opacity:1;filter:brightness(1.4) saturate(.75)}100%{opacity:1;filter:none}}
#photoImg{display:none}
/* 1.93: the photo's credit on its screen, in its small caps; a Planespotters photo is a link to its page (the whole
   screen for a mouse, the credit for the remote's ring, which shows on :focus: older TV browsers lack :focus-visible) */
.pLink{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 calc(7px*var(--k)) calc(6px*var(--k)) 0;
  pointer-events:none;text-decoration:none;outline:none;-webkit-tap-highlight-color:transparent}
.pLink[href]{pointer-events:auto;cursor:pointer}
#photoCr{display:flex;max-width:100%;box-sizing:border-box;padding:calc(3px*var(--k)) calc(5px*var(--k));border-radius:calc(4px*var(--k));
  font-weight:600;font-size:calc(13px*var(--k));line-height:1.1;letter-spacing:calc(1.5px*var(--k));text-transform:uppercase;color:rgba(235,240,245,.62);text-shadow:0 0 calc(3px*var(--k)) rgba(0,0,0,.8)}
.pLink[href]:hover #photoCr{color:rgba(243,240,232,.92)}
.pLink:focus #photoCr{color:#f3f0e8;background:rgba(0,0,0,.45);box-shadow:0 0 0 calc(3px*var(--k)) #f6c54a,0 0 calc(22px*var(--k)) calc(2px*var(--k)) rgba(246,197,74,.35)}
.pLink:focus:not(:focus-visible) #photoCr{color:rgba(235,240,245,.62);background:none;box-shadow:none}
#stage canvas#flipCv{z-index:2;pointer-events:none}
/* push buttons: plain ivory caps that light up warm white, with a small flicker as the bulb comes on */
.rail{position:absolute;display:flex;z-index:2}
.cap{position:relative;flex:none;width:calc(104px*var(--k));height:calc(44px*var(--k));margin:0 0 0 calc(14px*var(--k));padding:0;border:0;border-radius:calc(4px*var(--k));
  display:grid;place-items:center;text-align:center;font:700 calc(13.5px*var(--k))/1.1 var(--f-board);letter-spacing:.06em;text-transform:uppercase;
  color:rgba(24,22,18,.74);background:linear-gradient(#97928a,#7b776e 70%,#6e6a63);
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(4px*var(--k)) 0 calc(3px*var(--k)) #000,inset 0 calc(1px*var(--k)) 0 rgba(255,255,255,.28),inset 0 calc(-3px*var(--k)) calc(5px*var(--k)) rgba(0,0,0,.3);
  transition:box-shadow .4s ease-out,transform .14s ease-out,filter .3s}
#railPages .cap,#railViews .cap{width:calc(126px*var(--k));display:flex;align-items:center;justify-content:center;gap:calc(7px*var(--k));padding:0 calc(8px*var(--k))}
#railPages .cap .ico,#railViews .cap .ico{flex:none;width:calc(18px*var(--k));height:calc(18px*var(--k));opacity:.8}
#railPages .cap span,#railViews .cap span{text-align:left}
.cap:first-child{margin-left:0}
.cap[aria-current=page],.cap[aria-pressed=true]{color:#17140e;background:radial-gradient(75% 70% at 50% 44%,#fffdf6,#f6ecd4 60%,#e2d0a4);transform:translateY(calc(2.5px*var(--k)));
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(255,224,150,.3),
    inset 0 0 calc(12px*var(--k)) rgba(255,206,120,.5);
  animation:lampOn .55s linear}
.cap.go[aria-pressed=true]{background:radial-gradient(75% 70% at 50% 44%,#eaffd8,#9be07f 58%,#55a443);box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,
  0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(140,235,110,.3),inset 0 0 calc(12px*var(--k)) rgba(40,120,20,.4)}
@keyframes lampOn{0%{filter:brightness(.45)}12%{filter:brightness(1.12)}19%{filter:brightness(.72)}32%{filter:brightness(1.04)}100%{filter:none}}
body.lite .cap[aria-current=page],body.lite .cap[aria-pressed=true]{animation:none}
.cap:hover:not([aria-current]):not([aria-pressed=true]):not(:disabled){filter:brightness(1.12)}
.cap:active:not(:disabled){transform:translateY(calc(3.5px*var(--k)))}
.cap:disabled{cursor:default;filter:brightness(.6)}
.cap.favCap{display:flex;align-items:center;gap:calc(5px*var(--k));width:86%;height:calc(30px*var(--k));align-self:center;box-sizing:border-box;margin:0;padding:0 calc(6px*var(--k)) 0 calc(7px*var(--k));text-align:left;font-size:calc(11px*var(--k));letter-spacing:.03em}
.cap.favCap span{flex:1;min-width:0;overflow:hidden;text-overflow:clip}
.cap.favCap .fIco{flex:none;width:calc(15px*var(--k));height:calc(15px*var(--k));opacity:.8}
.cap.favCap .favN{flex:none;width:auto;min-width:calc(22px*var(--k));padding:calc(2px*var(--k)) calc(5px*var(--k));font-size:calc(12px*var(--k));text-align:right;letter-spacing:.04em;pointer-events:none}
.inst.favs{gap:calc(14px*var(--k));justify-content:center}   /* 1.61: smaller caps with room around them */
.cap.small{width:auto;min-width:calc(64px*var(--k));height:calc(34px*var(--k));padding:0 calc(12px*var(--k));font-size:calc(12px*var(--k))}
.cap.big{width:calc(150px*var(--k));height:calc(56px*var(--k));font-size:calc(16px*var(--k))}
/* 1.50: the filter above Spotted today (the board on a computer, the app) */
.svFind{position:relative;display:inline-flex;align-items:center}
.svFind input{box-sizing:border-box;width:calc(250px*var(--k));height:calc(34px*var(--k));margin:0;padding:0 calc(32px*var(--k)) 0 calc(12px*var(--k));border-radius:calc(8px*var(--k));
  border:1px solid rgba(255,255,255,.16);background:#0f1012;color:#f3f0e8;font:600 calc(14px*var(--k)) "Archivo Narrow","Arial Narrow",sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.svFind input:focus{border-color:#f0b429}
.svFind input::placeholder{color:rgba(243,240,232,.42)}
.svFind input::-webkit-search-cancel-button{display:none}
.svFind button{all:unset;position:absolute;right:calc(6px*var(--k));width:calc(22px*var(--k));height:calc(22px*var(--k));line-height:calc(22px*var(--k));text-align:center;border-radius:50%;
  cursor:pointer;color:#f3f0e8;background:rgba(255,255,255,.14);font:700 calc(15px*var(--k)) sans-serif}
.svFind button[hidden]{display:none}
#viewTools{z-index:2}
#viewTools.two{flex-direction:column;align-items:flex-end;gap:calc(12px*var(--k))}
#viewTools .vtRow{display:flex}
#viewTools.rdr{display:block;pointer-events:none}
#viewTools.rdr .cap{position:absolute;pointer-events:auto;min-width:calc(64px*var(--k))}
#viewTools.rdr .cap[data-z]{font-size:calc(24px*var(--k));line-height:1;font-weight:700}
/* 1.92: the Logbook's plates as buttons for the remote's ring (a click goes through to the board), and their cards. The
   rings are on :focus, taken back with :not(:focus-visible) for a mouse; a TV browser too old for :focus-visible drops
   that rule and keeps the ring (the plates only ever get focus from keys). */
#viewTools .cap:focus{outline:2px solid var(--amber);outline-offset:2px}

#lbHits{position:absolute;inset:0;z-index:2;pointer-events:none}
#lbHits[hidden]{display:none}

#lbHits button:focus{box-shadow:0 0 0 calc(3px*var(--k)) #f6c54a,0 0 calc(22px*var(--k)) calc(2px*var(--k)) rgba(246,197,74,.35)}
#fx.lbHov{cursor:pointer}
body.idle #fx.lbHov{cursor:none}

#cardBox .lbNums{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(10px*var(--ck,1)) calc(8px*var(--ck,1));margin:calc(12px*var(--ck,1)) 0 calc(4px*var(--ck,1))}
#cardBox .lbNums b{display:block;font:700 calc(26px*var(--ck,1))/1.05 var(--f-board);color:#f3f0e8}
#cardBox .lbNums span{font:600 calc(11px*var(--ck,1))/1.3 var(--f-board);letter-spacing:.1em;text-transform:uppercase;color:#959aa3}
#cardBox .lbRk{list-style:none;margin:calc(6px*var(--ck,1)) 0 0;padding:0}
#cardBox .lbRow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:calc(26px*var(--ck,1)) minmax(0,1fr) auto;gap:calc(4px*var(--ck,1)) calc(8px*var(--ck,1));align-items:baseline;width:100%;
  padding:calc(7px*var(--ck,1)) calc(4px*var(--ck,1));border-bottom:1px solid rgba(255,255,255,.06);border-radius:calc(4px*var(--ck,1));font:600 calc(15px*var(--ck,1))/1.25 var(--f-board);color:#f3f0e8}
#cardBox button.lbRow{cursor:pointer}
#cardBox button.lbRow:hover{background:rgba(255,255,255,.05)}
#cardBox .lbRow .no{color:#6d7179;font-size:calc(12px*var(--ck,1))}
#cardBox .lbRow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cardBox .lbRow .nm small{margin-left:.6em;color:#959aa3;font-weight:500;font-size:calc(12px*var(--ck,1))}
#cardBox .lbRow>b{color:#f0b429;font-variant-numeric:tabular-nums}

/* Settings: a cockpit panel. Plates with screws, rotary selectors, flip switches, thumbwheels and amber read-outs. */
#cockpit{position:absolute;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.12fr);grid-template-rows:minmax(0,1.12fr) minmax(0,1fr);gap:calc(18px*var(--k));
  font-family:var(--f-board);color:#d8d3c6}
.plate{--pt:calc(10px*var(--k));--px:calc(22px*var(--k));position:relative;min-width:0;overflow:hidden;background:linear-gradient(#28292c,#1a1b1d);border-radius:calc(8px*var(--k));padding:var(--pt) var(--px) calc(12px*var(--k));
  box-shadow:0 calc(6px*var(--k)) calc(16px*var(--k)) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 4px rgba(0,0,0,.5);
  display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-content:start;align-items:stretch;gap:calc(8px*var(--k))}
/* Realistic look (Settings → Display; body.real): brushed, bevelled plates, engraved labels, metal knob caps and glowing
   displays. The board's glass glare is #glass. */
#glass{position:absolute;inset:0;pointer-events:none;display:none}
body.real #glass{display:block;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 7%),
  linear-gradient(118deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.012) 33%,rgba(255,255,255,0) 33.3%),
  radial-gradient(ellipse 75% 70% at 50% 42%,rgba(0,0,0,0) 62%,rgba(0,0,0,.2) 100%)}
body.real .plate{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 1px,rgba(0,0,0,.022) 1px 2px,rgba(255,255,255,0) 2px 4px),linear-gradient(#2e2f33,#1a1b1e);
  box-shadow:0 calc(6px*var(--k)) calc(16px*var(--k)) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12),inset 1px 0 0 rgba(255,255,255,.05),inset -1px 0 0 rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.65),inset 0 -6px 10px rgba(0,0,0,.35)}
body.real .inst>span,body.real .plate h3{text-shadow:0 1px 0 rgba(255,255,255,.07),0 -1px 0 rgba(0,0,0,.95)}
body.real .inst{box-shadow:inset 0 calc(2px*var(--k)) calc(4px*var(--k)) rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.06)}
body.real .rotary .knob::before{background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 42%),
  conic-gradient(#9a9ea5,#4b4e53,#a7abb1,#43464b,#9a9ea5,#4b4e53,#a7abb1,#43464b,#9a9ea5);box-shadow:0 1px 2px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.35)}
body.real .lcd{text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.55),0 0 1px rgba(246,197,74,.8);
  background-image:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,rgba(0,0,0,0) 1px 3px),linear-gradient(#0b0e09,#151b10)}
.plate>i{position:absolute;width:calc(9px*var(--k));height:calc(9px*var(--k));border-radius:50%;
  background:linear-gradient(35deg,transparent 42%,rgba(0,0,0,.75) 42% 58%,transparent 58%),radial-gradient(circle at 35% 35%,#8d9095,#45474c 60%,#1b1c1f)}
.plate>i:nth-of-type(1){left:calc(8px*var(--k));top:calc(8px*var(--k))}.plate>i:nth-of-type(2){right:calc(8px*var(--k));top:calc(8px*var(--k))}
.plate>i:nth-of-type(3){left:calc(8px*var(--k));bottom:calc(8px*var(--k))}.plate>i:nth-of-type(4){right:calc(8px*var(--k));bottom:calc(8px*var(--k))}
.plate h3{grid-column:1/-1;display:flex;align-items:center;gap:calc(10px*var(--k));margin:0 0 calc(4px*var(--k));font:600 calc(13px*var(--k))/1 var(--f-board);
  letter-spacing:.22em;text-transform:uppercase;color:rgba(214,208,194,.72);text-shadow:0 -1px 0 rgba(0,0,0,.8)}
.plate h3::before,.plate h3::after{content:"";flex:1;height:1px;background:rgba(214,208,194,.25)}
/* the title's middle level with the top screws' (8 + 9/2) and its lines ending 6 short of them (8 + 9 + 6), whatever the
   plate's padding (--pt, --px); what follows moves up with it */
.plate>h3{margin:calc(6px*var(--k) - var(--pt)) calc(23px*var(--k) - var(--px)) calc(4px*var(--k))}
/* each control sits in its own recessed cell, with its name engraved on a strip above it */
.inst{grid-column:span var(--span,1);min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--k));padding:calc(5px*var(--k)) calc(6px*var(--k)) calc(6px*var(--k));
  border-radius:calc(5px*var(--k));background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.12));box-shadow:inset 0 calc(1px*var(--k)) calc(3px*var(--k)) rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.05)}
.inst[data-hint]{position:relative}
.inst[data-hint]::after{content:attr(data-hint);position:absolute;left:50%;bottom:calc(100% + 8px*var(--k));z-index:30;width:max-content;max-width:calc(240px*var(--k));padding:calc(7px*var(--k)) calc(10px*var(--k));border-radius:calc(6px*var(--k));background:rgba(12,13,15,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 calc(6px*var(--k)) calc(18px*var(--k)) rgba(0,0,0,.6);color:#e9e5da;font:500 calc(13px*var(--k))/1.35 var(--f-board);letter-spacing:0;text-transform:none;text-align:left;white-space:normal;pointer-events:none;opacity:0;transform:translate(-50%,calc(4px*var(--k)));transition:opacity .15s,transform .15s}
#hintTip{position:fixed;z-index:96;box-sizing:border-box;width:max-content;max-width:min(calc(260px*var(--tipK,1)),calc(100vw - 16px));padding:calc(7px*var(--tipK,1)) calc(10px*var(--tipK,1));border-radius:calc(6px*var(--tipK,1));
  background:rgba(12,13,15,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 calc(6px*var(--tipK,1)) calc(18px*var(--tipK,1)) rgba(0,0,0,.6);color:#e9e5da;font:500 calc(13px*var(--tipK,1))/1.35 var(--f-board);
  pointer-events:none;opacity:0;transition:opacity .15s}
#hintTip.on{opacity:1}
@media (pointer:coarse){   /* a phone: inside the control's own cell (plates clip what sticks out), after a tap */
  .inst[data-hint]::after{left:calc(6px*var(--k));right:calc(6px*var(--k));bottom:calc(6px*var(--k));width:auto;max-width:none;transform:none;text-align:center}
  .inst[data-hint]:hover::after,.inst[data-hint]:focus-within::after{opacity:0;transform:none}
  .inst[data-hint].hinting::after{opacity:1;transform:none;transition-delay:0s}
  .inst[data-hint]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
}
.inst>span{order:-1;align-self:stretch;padding:0 calc(2px*var(--k)) calc(5px*var(--k));border-bottom:1px solid rgba(214,208,194,.16);
  font:700 calc(11.5px*var(--k))/1.15 var(--f-board);letter-spacing:.09em;text-transform:uppercase;color:rgba(238,233,220,.9);text-align:center;text-shadow:0 -1px 0 rgba(0,0,0,.85)}
.inst.wide{grid-column:1/-1;align-items:stretch}
.inst.wide>span{text-align:left}
.inst .lcd{width:100%;box-sizing:border-box}
.inst.loc{justify-content:flex-start;gap:calc(8px*var(--k))}
.inst.loc p{margin:0;font:500 calc(12.5px*var(--k))/1.3 var(--f-board);color:rgba(214,208,194,.7);text-align:center}
.inst.loc .ask{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(10px*var(--k))}
.inst.loc .ask[hidden],.inst.loc .cap[hidden]{display:none}
.inst.loc .ask .cap{margin:0}
.lcd{font:600 calc(20px*var(--k))/1 var(--f-board);letter-spacing:.08em;text-transform:uppercase;color:#f6c54a;background:linear-gradient(#0b0e09,#151b10);
  border:0;border-radius:calc(4px*var(--k));padding:calc(6px*var(--k)) calc(10px*var(--k));text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.45);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #050505,0 1px 0 calc(3px*var(--k)) rgba(255,255,255,.05);-webkit-user-select:text;user-select:text}
.lcd:focus{outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #f6c54a}
/* rotary selector: a fluted knob, its pointer on the chosen position, the positions engraved round it */
.rotary{position:relative;width:calc(140px*var(--k));height:calc(100px*var(--k));outline:none;cursor:pointer}
.rotary .knob{position:absolute;left:50%;top:calc(58px*var(--k));width:calc(54px*var(--k));height:calc(54px*var(--k));margin:calc(-27px*var(--k)) 0 0 calc(-27px*var(--k));border-radius:50%;
  background:repeating-conic-gradient(#1a1b1e 0 6deg,#3b3d42 6deg 12deg);box-shadow:0 calc(4px*var(--k)) calc(8px*var(--k)) rgba(0,0,0,.7),0 0 0 calc(2px*var(--k)) #0b0b0c;
  transform:rotate(var(--rot,0deg));transition:transform .34s cubic-bezier(.82,0,.22,1.28)}   /* stiff, then a snap */
.rotary .knob::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#62656b,#2a2b2f 60%,#18191b)}
.rotary .knob::after{content:"";position:absolute;left:50%;top:7%;width:calc(3px*var(--k));height:38%;margin-left:calc(-1.5px*var(--k));border-radius:2px;background:#f3f0e8;box-shadow:0 0 calc(4px*var(--k)) rgba(255,255,255,.4)}
.rotary:focus-visible .knob{box-shadow:0 0 0 calc(2px*var(--k)) #f6c54a}
.rotary b{position:absolute;left:50%;top:calc(58px*var(--k));font:600 calc(11px*var(--k))/1 var(--f-board);letter-spacing:.06em;color:rgba(214,208,194,.55);white-space:nowrap;
  transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--r,46)*-1px*var(--k))) rotate(calc(-1*var(--a)));transition:color .2s,text-shadow .2s}
.rotary b.on{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.55)}
/* flip switch: an aircraft toggle. A chrome bat handle with a ball tip sticks out of a knurled bushing in a hex nut and
   snaps between tilted up (on) and tilted down (off), swinging through the middle in 3D. */
.toggle{position:relative;width:calc(72px*var(--k));height:calc(96px*var(--k));padding:0;border:0;background:none;cursor:pointer;outline:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:700 calc(10.5px*var(--k))/1 var(--f-board);letter-spacing:.12em;color:rgba(214,208,194,.36)}
.toggle .sw{position:relative;width:calc(40px*var(--k));height:calc(40px*var(--k));perspective:calc(150px*var(--k))}
.toggle .sw::before{content:"";position:absolute;inset:0;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);
  background:linear-gradient(165deg,#e0e2e6,#9a9ea4 28%,#55585e 58%,#2b2d31 85%)}
.toggle .sw::after{content:"";position:absolute;inset:calc(-3px*var(--k));z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent)}
.toggle .bush{position:absolute;inset:21%;border-radius:50%;
  background:radial-gradient(circle,#050506 0 34%,#3a3c40 36%,transparent 40%),repeating-conic-gradient(#a8acb1 0 6deg,#4f5257 6deg 12deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 calc(3px*var(--k)) rgba(0,0,0,.85)}
.toggle .shade{position:absolute;left:50%;top:50%;width:calc(9px*var(--k));height:calc(24px*var(--k));margin-left:calc(-4.5px*var(--k));border-radius:calc(5px*var(--k));
  background:rgba(0,0,0,.55);filter:blur(calc(2.5px*var(--k)));transform-origin:50% 0;transform:translateY(calc(4px*var(--k))) scaleY(1);transition:transform .11s}
.toggle[aria-pressed=true] .shade{transform:translateY(calc(2px*var(--k))) scaleY(.35)}
.toggle .bat{position:absolute;left:50%;top:50%;width:calc(8px*var(--k));height:calc(40px*var(--k));margin:calc(-40px*var(--k)) 0 0 calc(-4px*var(--k));
  border-radius:calc(4px*var(--k));transform-origin:50% 100%;transform-style:preserve-3d;transform:rotateX(-122deg);transition:transform .11s cubic-bezier(.55,0,.35,1.3);
  background:linear-gradient(90deg,#4a4d52,#c9ccd1 30%,#ffffff 44%,#b4b7bc 64%,#3f4246)}
.toggle .bat::after{content:"";position:absolute;left:50%;top:calc(-4px*var(--k));width:calc(14px*var(--k));height:calc(14px*var(--k));margin-left:calc(-7px*var(--k));border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff,#d6d9dd 28%,#80848a 66%,#3a3c40);transform:rotateX(122deg) translateZ(calc(6px*var(--k)));transition:transform .11s cubic-bezier(.55,0,.35,1.3)}
.toggle[aria-pressed=true] .bat{transform:rotateX(-58deg)}
.toggle[aria-pressed=true] .bat::after{transform:rotateX(58deg) translateZ(calc(6px*var(--k)))}
.toggle.guard .bat::after{background:radial-gradient(circle at 38% 32%,#ffb1a6,#e0473b 34%,#9e2a20 70%,#4e100b)}
.toggle .up,.toggle .down{transition:color .2s,text-shadow .2s}
.toggle[aria-pressed=true] .up,.toggle[aria-pressed=false] .down{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.5)}
.toggle:focus-visible .sw::after{background:radial-gradient(closest-side,rgba(246,197,74,.6),transparent)}
/* thumbwheel: a ridged drum with a number in a window */
.wheels{display:flex;align-items:center;gap:calc(4px*var(--k))}
.wheels>em{font:700 calc(26px*var(--k))/1 var(--f-board);font-style:normal;color:#d8d3c6}
.wheel{display:flex;flex-direction:column;align-items:center;outline:none}
.wheel button{width:calc(52px*var(--k));height:calc(18px*var(--k));padding:0;border:0;border-radius:calc(3px*var(--k));font-size:calc(9px*var(--k));color:rgba(214,208,194,.6);
  background:repeating-linear-gradient(#3c3e43 0 calc(2px*var(--k)),#1a1b1e calc(2px*var(--k)) calc(4px*var(--k)));box-shadow:0 0 0 calc(2px*var(--k)) #0b0b0c}
.wheel button:hover{color:#f6c54a}
.wheel .win{position:relative;overflow:hidden;width:calc(52px*var(--k));height:calc(44px*var(--k));margin:calc(4px*var(--k)) 0;border-radius:calc(4px*var(--k));display:grid;place-items:center;
  font:700 calc(28px*var(--k))/1 var(--f-board);color:#f3f0e8;background:linear-gradient(#2a2b2f,#17181b 50%,#0e0f11 50%,#1f2023);
  box-shadow:inset 0 0 0 calc(2px*var(--k)) #000,0 calc(2px*var(--k)) calc(4px*var(--k)) rgba(0,0,0,.6)}
.wheel .win::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.9)}
.wheel:focus-visible .win{box-shadow:inset 0 0 0 calc(2px*var(--k)) #f6c54a}
.wheel .win b.up{animation:rollUp .22s ease-out}.wheel .win b.down{animation:rollDown .22s ease-out}
@keyframes rollUp{0%{transform:translateY(60%);opacity:.2}100%{transform:none;opacity:1}}
@keyframes rollDown{0%{transform:translateY(-60%);opacity:.2}100%{transform:none;opacity:1}}
.plate p{grid-column:1/-1;margin:0;font:500 calc(14px*var(--k))/1.35 var(--f-board);color:rgba(214,208,194,.6)}

// 1.72: leather for First Class: a fine pebble grain, soft creases lit from above, and a stitched champagne seam.
function leatherGrain(g, w, h, rnd, creases = true){
  for (let i = 0; i < (creases ? 14 : 0); i++) {        // creases (not on the app's repeating tile)
    const x = rnd() * w, y = rnd() * h, r = 80 + rnd() * 240, cg = g.createRadialGradient(x, y, 0, x, y, r);
    cg.addColorStop(0, `rgba(255,220,200,${.03 + rnd() * .04})`); cg.addColorStop(1, "rgba(255,220,200,0)");

    g.fillStyle = `rgba(0,0,0,${.12 + rnd() * .18})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = `rgba(255,235,220,${.03 + rnd() * .05})`; g.beginPath(); g.arc(x - r * .4, y - r * .5, r * .6, 0, Math.PI * 2); g.fill();

/* Unlockable styles (1.59, to-do #66, relay 51): colour palettes for points, flap finishes for trophies, a title badge

   default look doesn't change until someone picks something. [id, name, what unlocks it (none: always)] */
const PALETTES = {heathrow: {ink: "#ffd23a", accent: "#ffd23a"}, solari: {ink: "#e2f6d9", accent: "#5fd17a"},
  ice: {ink: "#e6f3ff", accent: "#7cc4ff"}, sunset: {ink: "#ffe8d4", accent: "#ff8f5a"}};
const STYLES = [
  // 1.72: unlocked by level, one by one (the game's points), and First Class by winning last week's league
  ["palette", "Colours", [["", "Board colours"], ["heathrow", "Heathrow yellow", {lvl: 2}], ["solari", "Solari green", {lvl: 5}],
    ["ice", "Ice blue", {lvl: 9}], ["sunset", "Sunset", {lvl: 12}]]],
  ["finish", "Flaps", [["", "Standard flaps"], ["white", "Black on white", {lvl: 4}], ["brass", "Brass trim", {lvl: 7}],
    ["enamel", "Worn enamel", {lvl: 11}], ["led", "LED dots", {lvl: 15}]]],
  ["badge", "Title badge", [["", "No badge"], ["star", "Star", {lvl: 3}], ["prop", "Propeller", {lvl: 6}], ["heli", "Helicopter", {lvl: 10}],

  ["theme", "Board style", [["classic", "Classic"], ["frankfurt", "Frankfurt"], ["blue", "Blue"],
    ["frankfurt70", "Frankfurt 1970s", {lvl: 8}], ["tokyo", "Tokyo night", {lvl: 14}], ["goldleaf", "Gold leaf", {lvl: 18}],
    ["firstclass", "First Class", {champ: 1}]]]];
const BADGE_IDS = STYLES.find(x => x[0] === "badge")[2].map(x => x[0]).filter(Boolean);
const styleGame = () => (typeof lbData === "function" && lbData() || {}).game || null;
// 1.60: a style the owner granted by hand (g0.styleGrants: "all" or a list of ids) counts like an earned one; pass no id for earned only.
const styleOk = (rule, g0, id) => !rule || !!g0 && ((id != null && (g0.styleGrants === "all" || (Array.isArray(g0.styleGrants) && g0.styleGrants.includes(id)))) || (rule.lvl ? (g0.level || 0) >= rule.lvl : rule.champ ? !!g0.champion : rule.pts ? (g0.points || 0) >= rule.pts : rule.tr ? !!(g0.trophies || {})[rule.tr] : (g0.bingoCards || 0) >= rule.cards));

const classicLook = () => (typeof LIGHT !== "undefined" && LIGHT) || !S.theme || S.theme === "classic";
// The board style, with a palette laid over it.
const GAME_LEVELS = ["Plane Watcher", "Window Spotter", "Fence Spotter", "Logkeeper", "Tail Reader", "Contrail Chaser", "Cadet",

  "Fleet Captain", "Chief Pilot", "Wing Commander", "Air Commodore", "Ace", "Legend"];

  // 1.72: First Class only while this profile is the champion (once the logbook says it isn't, the board goes Classic)
  const champOff = S.theme === "firstclass" && styleGame() && !styleGame().champion && !(styleGame().styleGrants === "all");
  const T = (!champOff && THEMES[S.theme]) || THEMES.classic, P = classicLook() && PALETTES[S.palette];

function badgeGlyph(g, id, k){

/* device-pixel geometry for every cell */
function geometry(){
  for (const f of Object.values(fields)) {
    f.pw = Math.round((f.kind === "chars" ? f.cw : f.wordW) * PX);
    f.ph = Math.round(f.ch * PX);
    const wear = S.imperfect ? Math.min(f.pw, f.ph) : 0;           // worn modules sit a hair out of line
    f.cells.forEach((c, i) => {
      c.x = Math.round((f.x + i * f.step) * PX + c.jx * wear * .02);
      c.y = Math.round(f.y * PX + c.jy * wear * .028);
    });
  }
}

// own chime; not at night, not in the background, not twice within 15 s, not in the first seconds; 1.45: only on the
// main page, and the recorded Airbus cabin chime, both notes since 1.46, with the synthesised one until it is decoded).
let dingAt = 0;
function seatbeltDing(force){
  if (!force && (!S.ding || nightOn || document.hidden || !onMainPage() || performance.now() < 8000 || Date.now() - dingAt < 15000)) return;
  if (!actx || actx.state !== "running") return;
  dingAt = Date.now();
  const t = actx.currentTime + .02, out = actx.createGain(), rec = SND.ding && SND.ding[0];
  if (rec) {
    const src = actx.createBufferSource();
    src.buffer = rec; out.gain.value = .32;
    src.connect(out).connect(sfxOut()); src.start(t);
    return;
  }
  out.gain.value = .16; out.connect(sfxOut());                  // subtle: well under the chimes
  for (const [mult, amp, dec] of [[1, .30, 1.4], [2.76, .04, .5], [.5, .03, .9]]) {
    const o = actx.createOscillator(), g = actx.createGain();

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .012); g.gain.exponentialRampToValueAtTime(amp * .002, t + dec);
    o.connect(g).connect(out); o.start(t); o.stop(t + dec + .05);

function aboutTap(){

const COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
function geo(ac){
  const kx = 111.32 * Math.cos(S.lat * Math.PI / 180), ky = 110.57;
  const x = (ac.lon - S.lon) * kx, y = (ac.lat - S.lat) * ky;
  const dist = Math.hypot(x, y), brg = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
  const v = (ac.gs || 0) * 1.852 / 3600, th = (ac.track || 0) * Math.PI / 180;
  const vx = v * Math.sin(th), vy = v * Math.cos(th), vv = vx * vx + vy * vy;
  const tcpa = vv > 0 ? -(x * vx + y * vy) / vv : Infinity;
  const cpa = isFinite(tcpa) ? Math.hypot(x + vx * tcpa, y + vy * tcpa) : dist;
  return {dist, dir: COMPASS[Math.round(brg / 45) % 8], tcpa, cpa};
}
// 1.84 (the tracking review): the board judges where a plane is now, as Sky view does. A position is a few seconds old
// when it comes (seen_pos, and the relay's shared answer: its source time against ours, at most 6 s so a wrong clock
// can't run away with it) and older by the time the board looks again; it moves on straight at its speed, for at most
// a minute.
function ageOf(ac, list){
  const at = list && list.recvAt || Date.now(), lag = list && list.now ? Math.min(6, Math.max(0, (at - list.now) / 1000)) : 0;
  return Math.min(60, lag + Math.max(0, +ac.seen_pos || 0) + (Date.now() - at) / 1000);

  if (!(s > 0) || !(ac.gs > 0) || ac.track == null || ac.lat == null) return ac;
  const km = ac.gs * 1.852 / 3600 * s, th = ac.track * Math.PI / 180;
  return {...ac, lat: ac.lat + km * Math.cos(th) / 110.57, lon: ac.lon + km * Math.sin(th) / (111.32 * Math.cos(ac.lat * Math.PI / 180))};

    g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(x, y, w, 1);

  g.fillRect(cx + tw / 2 + 10, cy, Math.max(0, x + w - 23 - (cx + tw / 2 + 10)), 1);
  g.textAlign = "left"; g.textBaseline = "middle";

  g.fillStyle = real ? "rgba(0,0,0,.95)" : "rgba(0,0,0,.8)"; g.fillText(t, cx - tw / 2, cy - .5);

}

  const m = t.match(/\(([A-Z0-9]{2,4})\)\s*$/i), code = clean(m ? m[1] : t).replace(/\s/g, ""), name = m ? t.replace(/\s*\([^)]*\)\s*$/, "") : "";

  if (TYPES[code]) return {k: "type", v: code, n: name || TYPES[code]};
  const byName = Object.entries(AIRLINES).find(([, a]) => clean(a[1]) === clean(t));
  if (byName) return {k: "airline", v: byName[0], n: byName[1][1]};
  const tName = Object.entries(TYPES).find(([, n]) => clean(n) === clean(t));
  if (tName) return {k: "type", v: tName[0], n: tName[1]};

// A short burst of paper bits over the page (fewer and shorter on the weaker TVs; none with reduced motion).
function confetti(){
  if (typeof REDUCED !== "undefined" && REDUCED) return;
  const weak = typeof WEAK_TV !== "undefined" && WEAK_TV, n = weak ? 36 : 90, life = weak ? 1800 : 2600;
  const cv = document.createElement("canvas"), w = innerWidth, h = innerHeight, dpr = weak ? 1 : Math.min(2, devicePixelRatio || 1);
  cv.className = "confetti"; cv.width = w * dpr; cv.height = h * dpr;
  document.body.appendChild(cv);
  const g = cv.getContext("2d"), cols = ["#f6be35", "#e0372c", "#27a85e", "#4f8fe0", "#b483ff", "#f3eee0"];
  const bits = Array.from({length: n}, () => ({x: w / 2 + (Math.random() - .5) * w * .3, y: h * .45, vx: (Math.random() - .5) * w * .9,
    vy: -h * (.5 + Math.random() * .7), r: Math.random() * 6, vr: (Math.random() - .5) * 12, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
  let last = t0;
  const step = now => {
    const t = now - t0, dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (t > life || !cv.isConnected) return cv.remove();
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.globalAlpha = Math.min(1, (life - t) / 500);
    for (const b of bits) {
      b.vy += h * 1.4 * dt; b.vx *= .985; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2 * Math.abs(Math.cos(b.r * 2)) + 1); g.restore();
    }
    requestAnimationFrame(step);
  };

}

const MODE_TIP = "Two styles: Overhead shows the planes flying over you, Airport the take-offs and landings at your home airport. Switch between them here.";

function tip(id, target, text, auto){

    Object.assign(ring.style, {left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`});

/* 1.93.1 (to-do #111, a phone kept showing a village far away where it had been days before): Chrome on Android (155)

// A position for the Log: its age (browsers only), how exact it is, how far from the point being watched.
function geoNote(p){

// Where the board looked before following the phone, to go back to (a label, or just the point).

/* 1.93.1 (Dave: ask each time): turning live location off with its switch asks where to watch now: Stay here (the

// Stay here: the last fresh position becomes the place, without a label (the profile's own place). A name or airport

async function liveStay(){

  placeAfter(); settingsSync();

  if (S.live || S.lat !== lat || S.lon !== lon || !n && !a) return;

// A place's name: "" where there is none (out at sea), null when the relay didn't answer (1.93.0.1)
async function geoReverse(lat, lon){

}
async function liveFix(p){

/* ---------- airport mode ----------
   For someone at an airport, looking out of the window: the planes taking off from the home airport and the ones
   coming in to land there, worked out from the positions around it. A plane is taking off when it rolls fast along
   the ground or climbs away low and close; it is landing when it comes down towards the airport, and LANDED once it
   rolls out on the ground. The board shows the two lists in place of the plane overhead (Settings → Board). */
const airportMode = () => S.mode === "airport";

// The home airport's position: from the board's own table (Vienna), otherwise asked of the relay (18 or newer).
function airportPos(){
  const code = clean(S.home).slice(0, 3);

  const known = AIRPORTS[code];

  if (AP.lat == null && code.length === 3 && AP.asked !== code && relay() && (window.OVERHEAD_RELAY_VERSION || 0) >= 18) {
    AP.asked = code;
    fetchJSON(`${relay()}/airport?code=${code}`, {}, 8000).then(j => {
      if (AP.code !== code) return;
      if (j.status === "ok") { Object.assign(AP, {lat: j.lat, lon: j.lon, name: j.name || "", city: j.city || "", rwys: rwyFrom(j.runways)}); airportChanged(); }
      else if (j.status === "loading") setTimeout(() => { if (AP.asked === code) AP.asked = ""; }, 3000);
    }).catch(() => setTimeout(() => { if (AP.asked === code) AP.asked = ""; }, 10000));

// Where to ask for positions: around the home airport in airport mode, around the board's location otherwise.
const queryCenter = () => (airportMode() && airportPos()) || [S.lat, S.lon];
function airportProcess(list){
  const at = airportPos(), now = Date.now();

  const [alat, alon] = at, kx = 111.32 * Math.cos(alat * Math.PI / 180), ky = 110.57;
  const deps = [], arrs = [], here = new Set();
  for (const ac of list) {
    if (ac.lat == null || ac.lon == null || !ac.hex) continue;
    const x = (ac.lon - alon) * kx, y = (ac.lat - alat) * ky, dist = Math.hypot(x, y);

    if (rate == null && prev && prev.alt != null && alt != null && now - prev.at > 4000) rate = (alt - prev.alt) / ((now - prev.at) / 60000);
    // 0°: flying straight away from the airport, 180°: straight towards it
    const out = ac.track == null || dist < .3 ? 90 : Math.abs(((ac.track - Math.atan2(x, y) * 180 / Math.PI) % 360 + 540) % 360 - 180);
    let kind = null, st = "", t = null;

      if (dist <= 5 && gs >= 30) {                    // on the runway at speed: a take-off roll, or rolling out after landing
        kind = prev && prev.kind ? prev.kind : prev && prev.gs != null && gs < prev.gs - 2 ? "arr" : "dep";
        st = kind === "arr" ? "LANDED" : "TAKE-OFF";

      if (kind === "arr") t = prev && prev.landed ? prev.landed : now;

/* ---------- runways in use ----------

function rwyFrom(list){       // [[ident, lat, lon, ident, lat, lon], ...] -> [{a: {id, lat, lon}, b: {...}}]

// The runway end a plane is using: its threshold `from` and the far end `to`, or null.
function rwyMatch(e, G){

   screen nobody has touched for half an hour refreshes then. Never while a card, Settings or a text field is open

  const check = async () => {
    try {
      let v = "";
      if ((window.OVERHEAD_RELAY_VERSION || 0) >= 45) v = (await fetchJSON(`${relay()}/pageversion?p=${encodeURIComponent(sub)}`, {}, 8000)).v || "";
      else {

function ctlBurst(t, o){      // filtered noise with a sharp attack: metal on metal

/* ---------- Settings: Use current location ----------
   Browsers only tell pages where they are on https or on this computer (localhost), and a TV has no idea anyway. The
   Android app (android/ in the repository) offers OverheadAndroid.locate(), which answers through window.__overheadHere. */
function hereNow(){
  return new Promise((ok, no) => {
    const A = window.OverheadAndroid;
    if (A && A.locate) {
      const timer = setTimeout(() => no(new Error(T("The phone didn't say where it is. Is location turned on?"))), 30000);
      window.__overheadHere = (lat, lon, acc, err) => { clearTimeout(timer); err ? no(new Error(err)) : ok({lat, lon, acc}); };
      A.locate();
      return;
    }
    if (!window.isSecureContext || !navigator.geolocation)
      return no(new Error(T(A ? "Update the Fallblatt app to use the phone's location." :
        "This screen can't share its location: browsers only do that for https pages or pages opened on the relay's own computer. Type the latitude and longitude instead.")));
    // 1.93.1: a position the browser kept from earlier (say on a trip) is no answer: wait for a fresh one
    let watch = null;
    const end = () => { clearTimeout(timer); navigator.geolocation.clearWatch(watch); };
    const timer = setTimeout(() => { end(); no(new Error(T("The location isn't available right now."))); }, 20000);
    watch = navigator.geolocation.watchPosition(p => {
      const q = geoPos(p);

      end(); ok(q);

    {enableHighAccuracy: true, timeout: 20000, maximumAge: 60000});
  });
}

      if (id.endsWith("to")) return placeCard(e.to);
      if (id.endsWith("type")) return typeCard(e);
    }
  }
  if (page === "aplists") {
    for (const [k, list] of [["d", AP.deps], ["a", AP.arrs]]) for (let i = 0; i < 5; i++) {
      const id = fieldAt(["time", "flight", "city", "st"].map(c => `apl${k}${i}${c}`), x, y), e = list[i];
      if (!id || !e) continue;
      if (id.endsWith("city")) return placeCard(e.info && (k === "d" ? e.info.to : e.info.from));
      return planeCard(radarObj(e.ac));
    }
  }
  if (isAc(page) && feat && feat.o) {
    const id = fieldAt(["acReg", "acHex", "acFlight", "acType", "acOwner", "acCountry", "acRoute"], x, y), info = feat.info || baseInfo(feat.o.ac);
    if (id === "acOwner") return airlineCard(liveFacts(feat.o.ac, info));
    if (id === "acType") return typeCard({typeCode: feat.o.ac.t, type: info.type});
    if (id === "acRoute") return placeCard(x < fields.acRoute.x + fields.acRoute.n * fields.acRoute.step / 2 ? info.from : info.to);
    if (id) return planeCard(feat.o);
  }
}
// The lists changed (a favourite, a hidden plane): draw what depends on them.
function listsChanged(){ favCounts(); if (!view) { renderFeatured(); renderPage(); } else if (view === "spotted") renderSpottedBoard(); }
function planeAgain(){ if (planeShown && cardOpenNow()) { const b = planeBody(planeShown); const el = $("cardBox").querySelector(".cardIn"); if (el) { el.innerHTML = `<button class="cardX" type="button" aria-label="${escH(T("Close"))}">×</button>` + b.html; el.querySelector(".cardX").onclick = cardClose; b.wire(el); } } }
["pointerdown", "keydown", "touchstart", "touchend"].forEach(ev => addEventListener(ev, () => { audioInit(); keepAwake(); }, {passive: true, capture: true}));
let idleT = null;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 4000); }
["mousemove","keydown","touchstart"].forEach(ev => addEventListener(ev, wake, {passive: true}));
addEventListener("resize", resize);

/* ---------- main loop ---------- */
let timer = null, busy = false, lastList = null;
// Each update is numbered: when a forced one starts while another is on its way (a new place, a new style), only the
// newest answer counts, and only one timer stays running. A bug while drawing isn't a failed update (it used to count
// as one, and three in a row showed OFFLINE).
let pollSeq = 0;
async function poll(force){
  if (busy && !force) return;
  clearTimeout(timer); busy = true;
  const seq = ++pollSeq;
  let list = null;
  try {
    list = S.demo ? demoAircraft() : await getAircraft();
    if (seq !== pollSeq) { list = null; return; }
    if (S.demo) DIAG.polls.push({t: Date.now(), ok: true, ms: 0, n: list.length});
    if (!lastOk && !S.demo) dlog("info", `First position data from ${feedName}: ${list.length} aircraft within ${QUERY_KM} km`);
    if (failures) dlog("info", `Position data back after ${failures} failed attempt${failures > 1 ? "s" : ""}`);
    if (wasOffline) dlog("info", "Back online");
    failures = 0; lastOk = Date.now(); wasOffline = false;
    if (snapShown) snapLive();
  } catch (e) {
    if (seq !== pollSeq) return;
    failures++;
    DIAG.polls.push({t: Date.now(), ok: false, err: e.message});
    dlog(failures >= 3 ? "error" : "warn", `Position update failed: ${e.message || e}`);
    if (isOffline()) {
      if (!wasOffline) dlog("error", "Showing OFFLINE: no position data for over a minute");
      wasOffline = true; feat = null; renderFeatured();
    }
  } finally {
    if (seq === pollSeq) {
      if (DIAG.polls.length > 60) DIAG.polls.splice(0, DIAG.polls.length - 60);
      busy = false; updateFooter(); scheduleDiag();
      const every = Math.min(60, Math.max(3, +S.refreshS || 10)) * 1000;          // Settings → Update every (the app: 5 s)
      clearTimeout(timer);
      timer = setTimeout(poll, S.demo ? 2000 : failures >= 3 ? every * 2 : every);
    }
  }
  if (!list) return;
  if (liveWaiting() && !S.demo) { const none = []; none.now = list.now; list = none; }   // 1.90: not around a spot saved before
  lastList = list;
  try { skyCheck(); listsLoad(); process(list); watchAsk(list); if (typeof arFeed === "function") arFeed(list); snapSave(); }
  catch (e) { dlog("error", `Couldn't draw the update: ${e && e.message || e}`); }
}
// 1.84 (the tracking review): between updates (10 s on a board, 5 s in the app) the board looks at the last one again
// every 2 s with its planes moved on, so OVERHEAD, APPROACHING and PASSED come when they happen. Not in the Airport style,
// which picks its plane its own way, nor while the page is hidden or the update is half a minute old.
setInterval(() => {
  if (!lastList || busy || S.demo || airportMode() || document.hidden || Date.now() - (lastList.recvAt || 0) > 30000) return;
  try { process(lastList, true); } catch (e) { dlog("error", `Couldn't look again: ${e && e.message || e}`); }
}, 2000);

async function start(){
  pickLang();
  try {
    await Promise.race([
      Promise.all(["700 40px", "600 20px", "400 40px"].map(s => document.fonts.load(`${s} ${(THEMES[S.theme] || THEMES.classic).font}`))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch {}
  applyTheme(); applyNight(true);
  resize(); wake();
  if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => { clearTiles(); drawStatic(); redrawAll(); });
  tickClock(); setInterval(tickClock, 1000);
  audioInit();   // starts at once where the browser allows it (kiosk setups); otherwise on the first click or key press
  if (snapLoad()) renderFeatured();         // the last known board at once, until fresh data comes (1.51)
  renderPage(); updateFooter(); keepAwake();
  if (relayV5()) syncSightings();
  const h = location.hash.slice(1);
  updateRail();
  for (const b of $("modeSw").children) b.onclick = e => { e.stopPropagation(); setMode(b.dataset.mode); };
  if (VIEWS.includes(h)) switchView(h, {instant: true});
  else if (airportMode()) switchView(null, {instant: true, page: "aplists"});
  dlog("info", `Board started · ${S.demo ? "demo mode" : relay() ? "using the home relay" : "no relay"} · watching ${S.lat.toFixed(4)}, ${S.lon.toFixed(4)}, radius ${+S.radiusKm || 15} km`);
  if (/(^|[?&])debug\b/.test(location.search)) openDiag();
  listsLoad(true).then(() => listsMigrate());
  setTimeout(() => boardTips(view), 20000);
  poll(); if (relayV5()) fetchLogbook(); if (airportMode()) airportPos();   // everything at once on the first load, then the usual timers
}
start();
})();
