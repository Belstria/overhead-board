    const t = now - t0, dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (t > life || !cv.isConnected) return cv.remove();
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.globalAlpha = Math.min(1, (life - t) / 500);
    for (const b of bits) {
      b.vy += h * 1.4 * dt; b.vx *= .985; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c; g.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2 * Math.abs(Math.cos(b.r * 2)) + 1); g.restore();
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- accounts (relay 30): a username, passkeys and a password, to sign in on a new device ----------
   The guest's profile is made by their invite link; the account is extra and their own choice (About, or the end of
   the welcome). Passkeys need https (the public address); a password works anywhere. Signing in on a new device is the
   relay's /signin page, linked from its "private" page. */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const ub64 = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((t.length + 3) % 4)), c => c.charCodeAt(0));
const accountsOk = () => !!GUEST && (window.OVERHEAD_RELAY_VERSION || 0) >= 30;
const passkeysHere = () => window.isSecureContext && !!window.PublicKeyCredential;
async function acctPost(path, body){
  const r = await fetch(`${relay()}${path}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const deviceName = () => { const u = navigator.userAgent;
  return /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Macintosh/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows" : "Device"; };
async function passkeyAdd(){
  const o = await acctPost("/account/passkey/begin");
  const c = await navigator.credentials.create({publicKey: {...o, challenge: ub64(o.challenge), user: {...o.user, id: ub64(o.user.id)},
    excludeCredentials: (o.excludeCredentials || []).map(x => ({...x, id: ub64(x.id)}))}});
  return acctPost("/account/passkey/finish", {id: c.id, clientDataJSON: b64u(c.response.clientDataJSON),
    attestationObject: b64u(c.response.attestationObject), name: deviceName()});
}
// Set or change the password in a window of its own: the current one (if there is one) and the new one twice.
function pwCard(a, done){

  cardOpen(`<h3>${escH(T(a.password ? "Change password" : "Set a password"))}</h3><form data-pw>` +

    `<p class="note" data-pn aria-live="polite"></p><div class="cBtns"><button class="cBtn" type="button" data-pc>${T("Cancel")}</button>` +
    `<button class="cBtn go" type="submit">${T("Apply")}</button></div></form>`, el => {
    const f = el.querySelector("[data-pw]"), v = id => (f.querySelector("#" + id) || {}).value || "", say = t => { f.querySelector("[data-pn]").textContent = t; };

    f.onsubmit = async ev => {

/* ---------- tips (1.42) ----------
   Short pop-ups for what isn't obvious at first: each one rings the thing it explains and fades the rest gently,
   shows once on this device (Settings brings them back), and on the full board closes by itself after a while. */
const TIPS_KEY = "od.tips" + (GUEST ? ".g." + GUEST.id : "");
let tipsSeen = {};
try { tipsSeen = JSON.parse(localStorage.getItem(TIPS_KEY) || "{}") || {}; } catch {}
const tipQueue = [];
let tipCur = null;
function tipsReset(){ tipsSeen = {}; try { localStorage.removeItem(TIPS_KEY); } catch {} }
function tip(id, target, text, auto){
  if (tipsSeen[id] || (tipCur && tipCur.id === id) || tipQueue.some(t => t.id === id)) return;
  tipQueue.push({id, target, text, auto});
  setTimeout(tipNext, 60);
}
function tipNext(){
  if (tipCur || !tipQueue.length) return;
  if (cardOpenNow() || document.hidden) { setTimeout(tipNext, 2000); return; }
  const t = tipQueue.shift();
  const el = typeof t.target === "function" ? t.target() : t.target;
  if (t.target && (!el || !el.getClientRects().length)) { setTimeout(tipNext, 60); return; }     // not on screen now: another time
  tipCur = t;
  if (el) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 90) el.scrollIntoView({block: "center"}); }
  const L = document.createElement("div");
  L.id = "tipLayer";
  L.innerHTML = `<div class="tipShade"></div>${el ? '<div class="tipRing"></div>' : ""}<div class="tipBub" role="dialog" aria-live="polite"><p></p><button class="tipOk" type="button"></button></div>`;
  L.querySelector("p").textContent = t.text;
  L.querySelector(".tipOk").textContent = T("Got it");
  document.body.appendChild(L);
  const bub = L.querySelector(".tipBub"), ring = L.querySelector(".tipRing"), shade = L.querySelector(".tipShade");
  const place = () => {
    const bw = bub.offsetWidth, bh = bub.offsetHeight;
    if (!el) { shade.style.background = "rgba(6,6,8,.32)"; Object.assign(bub.style, {left: "16px", top: `${innerHeight - bh - 24}px`}); return; }
    const r = el.getBoundingClientRect(), pad = 6, x = r.left - pad, y = r.top - pad, w = r.width + pad * 2, h = r.height + pad * 2;
    Object.assign(ring.style, {left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`});
    const cx = x + w / 2, cy = y + h / 2;
    shade.style.background = `radial-gradient(ellipse ${w / 2 + 90}px ${h / 2 + 90}px at ${cx}px ${cy}px, rgba(6,6,8,0) 0%, rgba(6,6,8,0) 52%, rgba(6,6,8,.6) 100%)`;
    const below = y + h + 14 + bh < innerHeight - 8;
    Object.assign(bub.style, {left: `${Math.max(12, Math.min(innerWidth - bw - 12, cx - bw / 2))}px`, top: `${below ? y + h + 14 : Math.max(8, y - bh - 14)}px`});
  };
  const done = () => {
    if (tipCur !== t) return;
    tipsSeen[t.id] = Date.now();
    try { localStorage.setItem(TIPS_KEY, JSON.stringify(tipsSeen)); } catch {}
    tipCur = null;
    L.style.pointerEvents = "none";                        // fading out: a second tap goes nowhere
    removeEventListener("resize", place); removeEventListener("scroll", place, true); removeEventListener("keydown", key, true);
    L.classList.remove("on"); setTimeout(() => L.remove(), 380);
    setTimeout(tipNext, 700);
  };
  const key = e => { e.preventDefault(); e.stopPropagation(); done(); };
  L.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); ctlSound.press(); done(); });
  addEventListener("resize", place); addEventListener("scroll", place, {passive: true, capture: true}); addEventListener("keydown", key, true);
  setTimeout(() => { place(); L.classList.add("on"); }, el ? 280 : 30);
  if (t.auto) setTimeout(done, t.auto);
}

/* ---------- places (relay 33; simpler since 1.38) ----------
   A profile's saved places: labels ("Home", "Work" …, all alike, kept on the relay for all its devices) for where the
   board watches, plus "live", a phone following its owner. A screen tells the relay which place it watches with each
   position request, its sightings carry that place, and its Spotted today shows that place only; the logbook counts
   them all, and a plane seen from two places in the same pass is one sighting. A location without a label is the
   profile's own ("home": no `pl`, the relay knows it) or, away from it, "here". */
const placesRelay = () => !!relay() && !S.demo && (window.OVERHEAD_RELAY_VERSION || 0) >= 33;
let places = {list: [], at: 0};
let allPlaces = false;                       // the app's Today: every place instead of this one
// The relay's own place (at home): a label there records as "home" too, so today's list carries on.
const ownSpot = () => !GUEST && DEFAULTS.lat != null && gcKm(+S.lat, +S.lon, +DEFAULTS.lat, +DEFAULTS.lon) < 0.1;
const placeKeyNow = () => S.live ? "live" : ownSpot() ? "home" : S.placeKey || (GUEST ? "home" : "here");
const placeName = k => k === "home" ? T("Home") : k === "live" ? T("On the go") : k === "here" ? T("Elsewhere") : k;
// What the screen is watching, in words: the label, or the place's name.
const placeLabel = () => S.live ? T("On the go") : S.placeKey || clean(S.place);
// What a position request adds: the place, its centre and radius (the profile's own place needs nothing).
function placeQs(){
  const k = placeKeyNow();
  return placesRelay() && k !== "home" ? `?pl=${encodeURIComponent(k)}&pc=${(+S.lat).toFixed(4)},${(+S.lon).toFixed(4)}&pr=${+S.radiusKm || 15}` : "";
}
const sightPlaceQ = every => placesRelay() && !every ? `&place=${encodeURIComponent(placeKeyNow())}` : "";
async function placesLoad(){
  if (!placesRelay()) return places;
  try { const j = await fetchJSON(`${relay()}/places`, {}, 8000); places = {list: j.places || [], at: Date.now()}; } catch {}
  return places;
}
async function placesSave(list){
  const r = await fetch(`${relay()}/places`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({places: list})});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  places = {list: (await r.json()).places || [], at: Date.now()};
}
const placeOfS = k => ({k, n: String(S.place || "").trim().slice(0, 24), lat: +(+S.lat).toFixed(5), lon: +(+S.lon).toFixed(5), home: clean(S.home).slice(0, 3), r: +S.radiusKm || 15});
// Watch the same point under another label, or none (k empty).
function placeKeySet(k){
  const was = placeKeyNow();
  delete S.placeKey;
  applySettings(k ? {...S, placeKey: k} : {...S});
  if (placeKeyNow() !== was) placeAfter();
}
const placeAt = (p, lat, lon) => !!p && gcKm(+p.lat, +p.lon, +lat, +lon) < 0.05;
// Settings moved the point being watched: the label goes unless it still matches (Update moves a label on purpose).
function placeCheck(){
  if (!S.placeKey || !places.at) return;
  const p = places.list.find(q => q.k === S.placeKey);
  if (!placeAt(p, S.lat, S.lon)) placeKeySet("");
}
// Watch another place: the board turns to it, and Spotted today with it.
function placeAfter(){
  sightRev = null; fullDay = {at: 0, rev: null, date: null, list: null}; spotted = [];
  if (relayV5()) syncSightings();
}
function usePlace(p){
  if (!p) return;
  liveHalt();
  applySettings({...S, live: false, placeKey: p.k, lat: p.lat, lon: p.lon, place: p.n || p.k, home: p.home || S.home, radiusKm: p.r || S.radiusKm});
  placeAfter(); settingsSync();
}
/* Live location: the phone's position drives the board while the page is open (https, or the Android app). Small moves
   only move the point; a new town gets its name (OpenStreetMap, through the relay) and a new nearest airport. */
const liveOk = () => !!(window.OverheadAndroid && window.OverheadAndroid.locate) || (window.isSecureContext && !!navigator.geolocation);
let liveWatch = null, liveTimer = null, liveNamed = null, liveAir = null, liveSaved = 0, liveFirst = true;
function liveHalt(){
  if (liveWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(liveWatch);
  clearInterval(liveTimer); liveWatch = liveTimer = null; liveNamed = liveAir = null; liveFirst = true;
}
function liveRun(){
  liveHalt();
  if (window.OverheadAndroid && window.OverheadAndroid.locate) {
    const tick = () => hereNow().then(liveFix).catch(() => {});
    tick(); liveTimer = setInterval(tick, 60000);
  } else liveWatch = navigator.geolocation.watchPosition(p => liveFix({lat: p.coords.latitude, lon: p.coords.longitude}), () => {},
    {enableHighAccuracy: false, maximumAge: 30000, timeout: 60000});
}
// Where the board looked before following the phone, to go back to (a label, or just the point).
function liveStart(){
  if (!liveOk()) return;
  if (!S.live) S.livePrev = placeOfS(S.placeKey || "");
  S.live = true; saveSettings();
  liveRun(); placeAfter(); settingsSync();
}
function liveStop(){
  liveHalt();
  const was = S.livePrev && typeof S.livePrev === "object" ? S.livePrev : null;
  const saved = was && was.k ? places.list.find(p => p.k === was.k) : null;
  S.live = false; delete S.livePrev;
  if (saved) return usePlace(saved);
  if (was && !was.k && was.lat != null) { const {k, ...p} = was; delete S.placeKey; applySettings({...S, ...p, place: p.n || S.place, radiusKm: p.r || S.radiusKm}); }
  else { delete S.placeKey; applySettings({...S}); }

async function geoReverse(lat, lon){
  try { const j = await fetchJSON(`${relay()}/geo/reverse?lat=${lat.toFixed(3)}&lon=${lon.toFixed(3)}&lang=${LANG}`, {}, 15000); return j.status === "ok" ? j.name : ""; }
  catch { return ""; }
}
async function liveFix(p){
  if (!S.live) return;

  const extra = {};
  if (!liveNamed || gcKm(liveNamed[0], liveNamed[1], lat, lon) > 2) {

setTimeout(() => { placesLoad().then(placeCheck); if (S.live) { if (liveOk()) liveRun(); else { S.live = false; saveSettings(); } } }, 1500);
// The address search: OpenStreetMap, through the relay (Settings → Location).
async function geoSearch(q){

  if (j.status !== "ok") throw new Error(T("The address search isn't available right now."));

// The saved places (1.40: only the list; a new one is saved from Settings → Location → Place name): tap one to
// watch it, Update moves it to where the board is watching now, × deletes it.
async function placesCard(){
  if (!placesRelay()) return;

  const draw = note => {
    const cur = S.live ? "" : S.placeKey || "";
    const row = (p, i) => `<div class="plRow"><button class="cBtn plGo${p.k === cur ? " on" : ""}" type="button" data-go="${i}"><b>${escH(p.k)}</b>` +
      `<small>${escH([p.n, p.home, `${p.r || 15} km`].filter(Boolean).join(" · "))}</small></button>` +
      `<button class="cBtn plUp" type="button" data-up="${i}">${escH(T("Update"))}</button>` +

      (places.list.length ? places.list.map(row).join("")
        : `<p class="note">${escH(T("No saved places yet. Set the location in Settings, type a name under Place name and press its Save."))}</p>`) +
      `<p class="note" data-n aria-live="polite">${escH(note || "")}</p>` +
      `<p class="note">${escH(T("Every place's planes go into the same logbook; Spotted today shows the place you're watching. Update moves a saved place to where the board is watching now."))}</p>`, el => {
      const say = t => { el.querySelector("[data-n]").textContent = t; };
      for (const b of el.querySelectorAll("[data-go]")) b.onclick = () => { ctlSound.press(); const p = places.list[+b.dataset.go]; cardClose(); usePlace(p); };
      for (const b of el.querySelectorAll("[data-up]")) b.onclick = async () => {

/* ---------- airport mode ----------
   For someone at an airport, looking out of the window: the planes taking off from the home airport and the ones
   coming in to land there, worked out from the positions around it. A plane is taking off when it rolls fast along
   the ground or climbs away low and close; it is landing when it comes down towards the airport, and LANDED once it
   rolls out on the ground. The board shows the two lists in place of the plane overhead (Settings → Board). */
const airportMode = () => S.mode === "airport";

  if (!ok) { const ta = $("diagText"); ta.value = text; ta.focus(); ta.select(); try { ok = document.execCommand("copy"); } catch {} }
  btn.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.textContent = "Copy log"; }, 2000);
};

function forText(sec){
  const m = Math.floor(sec / 60);
  return m < 1 ? "< 1 min" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
}

/* ---------- saying hello to the relay ---------- */
// The relay (version 12 or newer) keeps a list of the screens using it. Every minute, and when the page is hidden or
// shown, the board tells it this screen's name, how big it is drawn and at what quality; closing the page says goodbye.
const relayV12 = () => !!relay() && !relayLegacy && (window.OVERHEAD_RELAY_VERSION || 0) >= 12;
function sayHello(){
  if (!relayV12()) return;
  const q = quality() === "high" ? "4K" : quality();
  const params = new URLSearchParams({name: "", w: Math.round(W * PX), h: Math.round(H * PX),
    q: (S.quality || "auto") === "auto" ? `auto (${q})` : q, vis: document.visibilityState || ""});
  timedFetch(`${relay()}/hello?${params}`, {}, 6000).catch(() => {});
}
setTimeout(sayHello, 2000);
setInterval(sayHello, 60000);
document.addEventListener("visibilitychange", sayHello);
addEventListener("pagehide", () => { try { if (relayV12() && navigator.sendBeacon) navigator.sendBeacon(tagged(`${relay()}/bye`)); } catch {} });

/* ---------- fullscreen, wake lock, idle cursor ---------- */
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
function toggleFullscreen(){
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); } catch {}
}
// A tap (or a click) opens what is under it; a double tap goes full screen (1.34; one tap used to).
let tapAt = 0, tapTimer = 0;
fx.addEventListener("click", e => {
  audioInit(); keepAwake();
  const now = Date.now(), r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / K, y = (e.clientY - r.top) / K;
  clearTimeout(tapTimer);
  if (now - tapAt < 330) { tapAt = 0; toggleFullscreen(); return; }
  tapAt = now;
  tapTimer = setTimeout(() => { try { boardTap(x, y); } catch (err) { dlog("debug", `Tap: ${err.message}`); } }, 330);
});
// The field under a point of the board (board units), among these ids.
function fieldAt(ids, x, y){
  for (const id of ids) {
    const f = fields[id];
    if (!f || f.hidden || f.x == null) continue;
    const w = f.kind === "chars" ? f.n * f.step : f.wordW || f.n * f.step;
    if (x >= f.x - 4 && x <= f.x + w + 4 && y >= f.y - 4 && y <= f.y + f.ch + 4) return id;
  }
  return null;
}
const radarObj = ac => radar.planes.find(p => p.ac.hex === ac.hex) || {ac, alt: typeof ac.alt_baro === "number" ? ac.alt_baro : null};
function boardTap(x, y){
  if (bigFlap.on || switching || cardOpenNow()) return;
  if (view === "radar") {
    const hit = (radar.hits || []).reduce((a, h) => { const d = Math.hypot(h.x - x, h.y - y); return d < 36 && (!a || d < a.d) ? {o: h.o, d} : a; }, null);
    if (hit) planeCard(hit.o);
    return;
  }
  if (view === "spotted" && !svLegend) {
    const {part} = svPart(), i = Math.floor((y - 305) / 36), e = part[i];
    if (i < 0 || !e || x < M - 10 || x > W - M + 10) return;
    if (x >= SV_X.plus - 8) return listsOk() ? listSheet(e) : undefined;
    if (x >= SV_X.airline && x < SV_X.from) return e.airline ? airlineCard(e) : undefined;
    if (x >= SV_X.from && x < SV_X.to) return e.from ? placeCard(e.from) : undefined;
    if (x >= SV_X.to && x < SV_X.type) return e.to ? placeCard(e.to) : undefined;
    if (x >= SV_X.type && x < SV_X.dist - 120) return e.type ? typeCard(e) : undefined;
  }
  if (view) return;
  const top = fieldAt(TOP_IDS, x, y);
  if (top && feat && feat.o) {
    const info = feat.info || baseInfo(feat.o.ac);
    if (top === "airline") return airlineCard(liveFacts(feat.o.ac, info));
    if (top === "fromCode" || top === "fromCity") return placeCard(info.from);
    if (top === "toCode" || top === "toCity") return placeCard(info.to);
    if (top === "type") return typeCard({typeCode: feat.o.ac.t, type: info.type});
    return planeCard(feat.o);
  }
  if (page === "spotted") {
    for (let i = 0; i < LIST_ROWS; i++) {
      const e = recentShown()[i], b = plusBox(i);
      if (!e) continue;
      if (listsOk() && x >= b.x - 6 && x <= b.x + b.w + 8 && y >= b.y - 4 && y <= b.y + b.h + 4) return listSheet(e);
      const id = fieldAt([`l${i}logo`, `l${i}from`, `l${i}to`, `l${i}type`], x, y);
      if (!id) continue;
      if (id.endsWith("logo")) return airlineCard(e);
      if (id.endsWith("from")) return placeCard(e.from);
      if (id.endsWith("to")) return placeCard(e.to);
      if (id.endsWith("type")) return typeCard(e);
    }
  }
  if (page === "aplists") {
    for (const [k, list] of [["d", AP.deps], ["a", AP.arrs]]) for (let i = 0; i < 5; i++) {
      const id = fieldAt(["time", "flight", "city", "st"].map(c => `apl${k}${i}${c}`), x, y), e = list[i];
      if (!id || !e) continue;
      if (id.endsWith("city")) return placeCard(e.info && (k === "d" ? e.info.to : e.info.from));
      return planeCard(radarObj(e.ac));
    }
  }
  if (isAc(page) && feat && feat.o) {
    const id = fieldAt(["acReg", "acHex", "acFlight", "acType", "acOwner", "acCountry", "acRoute"], x, y), info = feat.info || baseInfo(feat.o.ac);
    if (id === "acOwner") return airlineCard(liveFacts(feat.o.ac, info));
    if (id === "acType") return typeCard({typeCode: feat.o.ac.t, type: info.type});
    if (id === "acRoute") return placeCard(x < fields.acRoute.x + fields.acRoute.n * fields.acRoute.step / 2 ? info.from : info.to);
    if (id) return planeCard(feat.o);
  }
}
// The lists changed (a favourite, a hidden plane): draw what depends on them.
function listsChanged(){ if (!view) { renderFeatured(); renderPage(); } else if (view === "spotted") renderSpottedBoard(); }
function planeAgain(){ if (planeShown && cardOpenNow()) { const b = planeBody(planeShown); const el = $("cardBox").querySelector(".cardIn"); if (el) { el.innerHTML = `<button class="cardX" type="button" aria-label="${escH(T("Close"))}">×</button>` + b.html; el.querySelector(".cardX").onclick = cardClose; b.wire(el); } } }
["pointerdown", "keydown", "touchstart", "touchend"].forEach(ev => addEventListener(ev, () => { audioInit(); keepAwake(); }, {passive: true, capture: true}));
let idleT = null;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 4000); }
["mousemove","keydown","touchstart"].forEach(ev => addEventListener(ev, wake, {passive: true}));
addEventListener("resize", resize);

/* ---------- main loop ---------- */
let timer = null, busy = false;
// Each update is numbered: when a forced one starts while another is on its way (a new place, a new style), only the
// newest answer counts, and only one timer stays running. A bug while drawing isn't a failed update (it used to count
// as one, and three in a row showed OFFLINE).
let pollSeq = 0;
async function poll(force){
  if (busy && !force) return;
  clearTimeout(timer); busy = true;
  const seq = ++pollSeq;
  let list = null;
  try {
    list = S.demo ? demoAircraft() : await getAircraft();
    if (seq !== pollSeq) { list = null; return; }
    if (S.demo) DIAG.polls.push({t: Date.now(), ok: true, ms: 0, n: list.length});
    if (!lastOk && !S.demo) dlog("info", `First position data from ${feedName}: ${list.length} aircraft within ${QUERY_KM} km`);
    if (failures) dlog("info", `Position data back after ${failures} failed attempt${failures > 1 ? "s" : ""}`);
    if (wasOffline) dlog("info", "Back online");
    failures = 0; lastOk = Date.now(); wasOffline = false;
  } catch (e) {
    if (seq !== pollSeq) return;
    failures++;
    DIAG.polls.push({t: Date.now(), ok: false, err: e.message});
    dlog(failures >= 3 ? "error" : "warn", `Position update failed: ${e.message || e}`);
    if (isOffline()) {
      if (!wasOffline) dlog("error", "Showing OFFLINE: no position data for over a minute");
      wasOffline = true; feat = null; renderFeatured();
    }
  } finally {
    if (seq === pollSeq) {
      if (DIAG.polls.length > 60) DIAG.polls.splice(0, DIAG.polls.length - 60);
      busy = false; updateFooter(); scheduleDiag();
      const every = Math.min(60, Math.max(3, +S.refreshS || 10)) * 1000;          // Settings → Update every (the app: 5 s)
      clearTimeout(timer);
      timer = setTimeout(poll, S.demo ? 2000 : failures >= 3 ? every * 2 : every);
    }
  }
  if (!list) return;
  try { skyCheck(); listsLoad(); process(list); watchAsk(list); if (typeof arFeed === "function") arFeed(list); }
  catch (e) { dlog("error", `Couldn't draw the update: ${e && e.message || e}`); }
}

async function start(){
  pickLang();
  try {
    await Promise.race([
      Promise.all(["700 40px", "600 20px", "400 40px"].map(s => document.fonts.load(`${s} ${(THEMES[S.theme] || THEMES.classic).font}`))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch {}
  applyTheme(); applyNight(true);
  resize(); wake();
  if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => { clearTiles(); drawStatic(); redrawAll(); });
  tickClock(); setInterval(tickClock, 1000);
  audioInit();   // starts at once where the browser allows it (kiosk setups); otherwise on the first click or key press
  renderPage(); updateFooter(); keepAwake();
  if (relayV5()) syncSightings();
  const h = location.hash.slice(1);
  updateRail();
  for (const b of $("modeSw").children) b.onclick = e => { e.stopPropagation(); setMode(b.dataset.mode); };
  if (VIEWS.includes(h)) switchView(h, {instant: true});
  else if (airportMode()) switchView(null, {instant: true, page: "aplists"});
  dlog("info", `Board started · ${S.demo ? "demo mode" : relay() ? "using the home relay" : "no relay"} · watching ${S.lat.toFixed(4)}, ${S.lon.toFixed(4)}, radius ${+S.radiusKm || 15} km`);
  if (/(^|[?&])debug\b/.test(location.search)) openDiag();
  listsLoad(true).then(() => listsMigrate());
  setTimeout(() => boardTips(view), 20000);
  poll(); if (relayV5()) fetchLogbook(); if (airportMode()) airportPos();   // everything at once on the first load, then the usual timers
}
start();
})();
</script>
