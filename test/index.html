<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallblatt (Test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed 1920x1080 airport flight-information board, scaled to fit any screen.
   Top: gate-style feature of the plane overhead. Bottom: today's sightings as a departures list. */
:root{
  color-scheme: dark;
  --housing:#0b0b0c;
  --wall:#050505;
  --ink:#f3f0e8;
  --amber:#f0b429;
  --muted:#7f838b;
  --line:#26272b;
  --surface:#151618;
  --f-board:"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif;
  --k:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font:15px/1.45 var(--f-board);overflow:hidden;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#stage{position:absolute;background:var(--housing);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{cursor:pointer}

footer{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 calc(64px*var(--k)) calc(20px*var(--k));
  font-size:max(11px,calc(17px*var(--k)));letter-spacing:.03em;color:var(--muted);
  transition:opacity .6s;
}
body.idle footer{opacity:0;pointer-events:none}
footer{background:linear-gradient(transparent,rgba(0,0,0,.6));padding-top:calc(6px*var(--k));padding-bottom:calc(10px*var(--k));z-index:4;pointer-events:none}
footer #status,footer .actions{pointer-events:auto}
.pip{position:absolute;left:calc(20px*var(--k));bottom:calc(18px*var(--k));width:max(6px,calc(9px*var(--k)));height:max(6px,calc(9px*var(--k)));
  border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none}
body.idle .pip[data-state=warn]{opacity:.8;background:var(--amber)}
body.idle .pip[data-state=off]{opacity:.9;background:#e0483d}
#status{display:flex;align-items:center;gap:.6em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:.5em;height:.5em;border-radius:50%;background:var(--muted);flex:none}
.dot[data-state=live]{background:#22a058}
.dot[data-state=demo]{background:var(--amber)}
.dot[data-state=off]{background:#c7372d}
.dot[data-state=warn]{background:var(--amber)}
#diag{position:fixed;top:16px;right:16px;bottom:16px;width:min(640px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;
  background:#0e0f11;border:1px solid var(--line);border-radius:12px;padding:16px 18px;z-index:4;
  font:13px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);-webkit-user-select:text;user-select:text;cursor:auto}
#diag header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#diag h2{font:700 22px/1 var(--f-board);letter-spacing:.06em;text-transform:uppercase;margin:0}
#diag h2 span{color:var(--muted);font-weight:400}
#diag h3{font:600 12px/1 var(--f-board);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.dstats{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.dstats dt{color:var(--muted)}
.dstats dd{margin:0;min-width:0;overflow-wrap:anywhere}
.spark{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:8px}
.spark i{width:6px;height:12px;border-radius:1px;background:#27a85e}
.spark i.f{background:#cb3a2f}.spark i.s{background:var(--amber)}
.dsrc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dsrc td{padding:3px 10px 3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dsrc td:last-child{color:var(--muted);overflow-wrap:anywhere}
#diagLogWrap{display:flex;flex-direction:column;flex:1;min-height:0}
#diagLog{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
#diagLog li{display:grid;grid-template-columns:auto 3.6em 1fr;gap:10px;padding:2px 0}
#diagLog time,#diagLog .tag{color:var(--muted)}
.lv-warn{color:var(--amber)}.lv-error{color:#ff6b5e}.lv-debug{color:#a3a7ae}.good{color:#45d483}.bad{color:#ff6b5e}.meh{color:var(--amber)}
#diagText{position:fixed;left:-9999px;top:0;width:10px;height:10px}
.actions{display:flex;gap:.4em;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:.25em .7em;cursor:pointer}
button:hover,button:focus-visible{color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.empty{color:var(--muted);margin:0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 16px}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
label.check{flex-direction:row;align-items:center;gap:8px}
input,select{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--amber)}
output{color:var(--ink);letter-spacing:0}
input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--amber)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.primary{background:var(--amber);color:#15130e;border-color:var(--amber);font-weight:600}
.primary:hover,.primary:focus-visible{color:#15130e;opacity:.92}
textarea.fav{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-height:2.4em;resize:vertical}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
.times{display:flex;gap:8px;align-items:center}
.times input{width:auto;flex:1}
#shade{position:absolute;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none;transition:opacity 2s}
.photo{position:absolute;overflow:hidden;pointer-events:none}
.photo canvas{display:block;width:100%;height:100%}
.photo.plain{border-radius:6px;box-shadow:inset 0 0 0 2px #000,0 6px 18px rgba(0,0,0,.6)}
.photo.screen{border-radius:calc(5px*var(--k));box-shadow:0 0 calc(20px*var(--k)) rgba(165,190,225,.13)}
.photo.screen.on{animation:screenOn .95s ease-out both}
body.lite .photo.screen.on{animation:screenOnLite .8s ease-out both}
@keyframes screenOnLite{0%{opacity:0}16%{opacity:.8}24%{opacity:.45}100%{opacity:1}}
@keyframes screenOn{0%{opacity:0;filter:brightness(.5) saturate(.2)}16%{opacity:.8}24%{opacity:.45}38%{opacity:1;filter:brightness(1.4) saturate(.75)}100%{opacity:1;filter:none}}
#photoImg{display:none}
#stage canvas#flipCv{z-index:2;pointer-events:none}
/* push buttons: plain ivory caps that light up warm white, with a small flicker as the bulb comes on */
.rail{position:absolute;display:flex;z-index:2}
.cap{position:relative;flex:none;width:calc(104px*var(--k));height:calc(44px*var(--k));margin:0 0 0 calc(14px*var(--k));padding:0;border:0;border-radius:calc(4px*var(--k));
  display:grid;place-items:center;text-align:center;font:700 calc(12.5px*var(--k))/1.1 var(--f-board);letter-spacing:.07em;text-transform:uppercase;
  color:rgba(24,22,18,.74);background:linear-gradient(#97928a,#7b776e 70%,#6e6a63);
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(4px*var(--k)) 0 calc(3px*var(--k)) #000,inset 0 calc(1px*var(--k)) 0 rgba(255,255,255,.28),inset 0 calc(-3px*var(--k)) calc(5px*var(--k)) rgba(0,0,0,.3);
  transition:box-shadow .4s ease-out,transform .14s ease-out,filter .3s}
.cap:first-child{margin-left:0}
.cap[aria-current=page],.cap[aria-pressed=true]{color:#17140e;background:radial-gradient(75% 70% at 50% 44%,#fffdf6,#f6ecd4 60%,#e2d0a4);transform:translateY(calc(2.5px*var(--k)));
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(255,224,150,.3),
    inset 0 0 calc(12px*var(--k)) rgba(255,206,120,.5);
  animation:lampOn .55s linear}
.cap.go[aria-pressed=true]{background:radial-gradient(75% 70% at 50% 44%,#eaffd8,#9be07f 58%,#55a443);box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,
  0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(140,235,110,.3),inset 0 0 calc(12px*var(--k)) rgba(40,120,20,.4)}
@keyframes lampOn{0%{filter:brightness(.45)}12%{filter:brightness(1.12)}19%{filter:brightness(.72)}32%{filter:brightness(1.04)}100%{filter:none}}
body.lite .cap[aria-current=page],body.lite .cap[aria-pressed=true]{animation:none}
.cap:hover:not([aria-current]):not([aria-pressed=true]):not(:disabled){filter:brightness(1.12)}
.cap:active:not(:disabled){transform:translateY(calc(3.5px*var(--k)))}
.cap:disabled{cursor:default;filter:brightness(.6)}
.cap.small{width:auto;min-width:calc(64px*var(--k));height:calc(34px*var(--k));padding:0 calc(12px*var(--k));font-size:calc(12px*var(--k))}
.cap.big{width:calc(150px*var(--k));height:calc(56px*var(--k));font-size:calc(16px*var(--k))}
#viewTools{z-index:2}
#modeSw button{position:absolute;z-index:3;padding:0;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:calc(6px*var(--k));outline:none}
#modeSw button:focus-visible{box-shadow:0 0 0 calc(2px*var(--k)) #f6c54a}
#radarCv{position:absolute;z-index:1;pointer-events:none}
#stage #radarCv{inset:auto}

/* Settings: a cockpit panel. Plates with screws, rotary selectors, flip switches, thumbwheels and amber read-outs. */
#cockpit{position:absolute;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.12fr);grid-template-rows:minmax(0,1.12fr) minmax(0,1fr);gap:calc(18px*var(--k));
  font-family:var(--f-board);color:#d8d3c6}
.plate{position:relative;min-width:0;overflow:hidden;background:linear-gradient(#28292c,#1a1b1d);border-radius:calc(8px*var(--k));padding:calc(10px*var(--k)) calc(22px*var(--k)) calc(12px*var(--k));
  box-shadow:0 calc(6px*var(--k)) calc(16px*var(--k)) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 4px rgba(0,0,0,.5);
  display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-content:start;align-items:stretch;gap:calc(8px*var(--k))}
.plate>i{position:absolute;width:calc(9px*var(--k));height:calc(9px*var(--k));border-radius:50%;
  background:linear-gradient(35deg,transparent 42%,rgba(0,0,0,.75) 42% 58%,transparent 58%),radial-gradient(circle at 35% 35%,#8d9095,#45474c 60%,#1b1c1f)}
.plate>i:nth-of-type(1){left:calc(8px*var(--k));top:calc(8px*var(--k))}.plate>i:nth-of-type(2){right:calc(8px*var(--k));top:calc(8px*var(--k))}
.plate>i:nth-of-type(3){left:calc(8px*var(--k));bottom:calc(8px*var(--k))}.plate>i:nth-of-type(4){right:calc(8px*var(--k));bottom:calc(8px*var(--k))}
.plate h3{grid-column:1/-1;display:flex;align-items:center;gap:calc(10px*var(--k));margin:0 0 calc(4px*var(--k));font:600 calc(13px*var(--k))/1 var(--f-board);
  letter-spacing:.22em;text-transform:uppercase;color:rgba(214,208,194,.72);text-shadow:0 -1px 0 rgba(0,0,0,.8)}
.plate h3::before,.plate h3::after{content:"";flex:1;height:1px;background:rgba(214,208,194,.25)}
/* each control sits in its own recessed cell, with its name engraved on a strip above it */
.inst{grid-column:span var(--span,1);min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--k));padding:calc(5px*var(--k)) calc(6px*var(--k)) calc(6px*var(--k));
  border-radius:calc(5px*var(--k));background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.12));box-shadow:inset 0 calc(1px*var(--k)) calc(3px*var(--k)) rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.05)}
.inst>span{order:-1;align-self:stretch;padding:0 calc(2px*var(--k)) calc(5px*var(--k));border-bottom:1px solid rgba(214,208,194,.16);
  font:700 calc(11.5px*var(--k))/1.15 var(--f-board);letter-spacing:.09em;text-transform:uppercase;color:rgba(238,233,220,.9);text-align:center;text-shadow:0 -1px 0 rgba(0,0,0,.85)}
.inst.wide{grid-column:1/-1;align-items:stretch}
.inst.wide>span{text-align:left}
.inst .lcd{width:100%;box-sizing:border-box}
.inst.loc{justify-content:flex-start;gap:calc(8px*var(--k))}
.inst.loc p{margin:0;font:500 calc(12.5px*var(--k))/1.3 var(--f-board);color:rgba(214,208,194,.7);text-align:center}
.inst.loc .ask{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(10px*var(--k))}
.inst.loc .ask[hidden],.inst.loc .cap[hidden]{display:none}
.inst.loc .ask .cap{margin:0}
.lcd{font:600 calc(20px*var(--k))/1 var(--f-board);letter-spacing:.08em;text-transform:uppercase;color:#f6c54a;background:linear-gradient(#0b0e09,#151b10);
  border:0;border-radius:calc(4px*var(--k));padding:calc(6px*var(--k)) calc(10px*var(--k));text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.45);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #050505,0 1px 0 calc(3px*var(--k)) rgba(255,255,255,.05);-webkit-user-select:text;user-select:text}
.lcd:focus{outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #f6c54a}
/* rotary selector: a fluted knob, its pointer on the chosen position, the positions engraved round it */
.rotary{position:relative;width:calc(140px*var(--k));height:calc(100px*var(--k));outline:none;cursor:pointer}
.rotary .knob{position:absolute;left:50%;top:calc(58px*var(--k));width:calc(54px*var(--k));height:calc(54px*var(--k));margin:calc(-27px*var(--k)) 0 0 calc(-27px*var(--k));border-radius:50%;
  background:repeating-conic-gradient(#1a1b1e 0 6deg,#3b3d42 6deg 12deg);box-shadow:0 calc(4px*var(--k)) calc(8px*var(--k)) rgba(0,0,0,.7),0 0 0 calc(2px*var(--k)) #0b0b0c;
  transform:rotate(var(--rot,0deg));transition:transform .3s cubic-bezier(.3,1.45,.55,1)}
.rotary .knob::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#62656b,#2a2b2f 60%,#18191b)}
.rotary .knob::after{content:"";position:absolute;left:50%;top:7%;width:calc(3px*var(--k));height:38%;margin-left:calc(-1.5px*var(--k));border-radius:2px;background:#f3f0e8;box-shadow:0 0 calc(4px*var(--k)) rgba(255,255,255,.4)}
.rotary:focus-visible .knob{box-shadow:0 0 0 calc(2px*var(--k)) #f6c54a}
.rotary b{position:absolute;left:50%;top:calc(58px*var(--k));font:600 calc(11px*var(--k))/1 var(--f-board);letter-spacing:.06em;color:rgba(214,208,194,.55);white-space:nowrap;
  transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-46px*var(--k))) rotate(calc(-1*var(--a)));transition:color .2s,text-shadow .2s}
.rotary b.on{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.55)}
/* flip switch: an aircraft toggle. A chrome bat handle with a ball tip sticks out of a knurled bushing in a hex nut and
   snaps between tilted up (on) and tilted down (off), swinging through the middle in 3D. */
.toggle{position:relative;width:calc(72px*var(--k));height:calc(90px*var(--k));padding:0;border:0;background:none;cursor:pointer;outline:none;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:700 calc(10.5px*var(--k))/1 var(--f-board);letter-spacing:.12em;color:rgba(214,208,194,.36)}
.toggle .sw{position:relative;width:calc(40px*var(--k));height:calc(40px*var(--k));perspective:calc(150px*var(--k))}
.toggle .sw::before{content:"";position:absolute;inset:0;clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);
  background:linear-gradient(165deg,#e0e2e6,#9a9ea4 28%,#55585e 58%,#2b2d31 85%)}
.toggle .sw::after{content:"";position:absolute;inset:calc(-3px*var(--k));z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent)}
.toggle .bush{position:absolute;inset:21%;border-radius:50%;
  background:radial-gradient(circle,#050506 0 34%,#3a3c40 36%,transparent 40%),repeating-conic-gradient(#a8acb1 0 6deg,#4f5257 6deg 12deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 calc(3px*var(--k)) rgba(0,0,0,.85)}
.toggle .shade{position:absolute;left:50%;top:50%;width:calc(9px*var(--k));height:calc(24px*var(--k));margin-left:calc(-4.5px*var(--k));border-radius:calc(5px*var(--k));
  background:rgba(0,0,0,.55);filter:blur(calc(2.5px*var(--k)));transform-origin:50% 0;transform:translateY(calc(4px*var(--k))) scaleY(1);transition:transform .11s}
.toggle[aria-pressed=true] .shade{transform:translateY(calc(2px*var(--k))) scaleY(.35)}
.toggle .bat{position:absolute;left:50%;top:50%;width:calc(8px*var(--k));height:calc(40px*var(--k));margin:calc(-40px*var(--k)) 0 0 calc(-4px*var(--k));
  border-radius:calc(4px*var(--k));transform-origin:50% 100%;transform-style:preserve-3d;transform:rotateX(-122deg);transition:transform .11s cubic-bezier(.55,0,.35,1.3);
  background:linear-gradient(90deg,#4a4d52,#c9ccd1 30%,#ffffff 44%,#b4b7bc 64%,#3f4246)}
.toggle .bat::after{content:"";position:absolute;left:50%;top:calc(-4px*var(--k));width:calc(14px*var(--k));height:calc(14px*var(--k));margin-left:calc(-7px*var(--k));border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff,#d6d9dd 28%,#80848a 66%,#3a3c40);transform:rotateX(122deg) translateZ(calc(6px*var(--k)));transition:transform .11s cubic-bezier(.55,0,.35,1.3)}
.toggle[aria-pressed=true] .bat{transform:rotateX(-58deg)}
.toggle[aria-pressed=true] .bat::after{transform:rotateX(58deg) translateZ(calc(6px*var(--k)))}
.toggle.guard .bat::after{background:radial-gradient(circle at 38% 32%,#ffb1a6,#e0473b 34%,#9e2a20 70%,#4e100b)}
.toggle .up,.toggle .down{transition:color .2s,text-shadow .2s}
.toggle[aria-pressed=true] .up,.toggle[aria-pressed=false] .down{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.5)}
.toggle:focus-visible .sw::after{background:radial-gradient(closest-side,rgba(246,197,74,.6),transparent)}
/* thumbwheel: a ridged drum with a number in a window */
.wheels{display:flex;align-items:center;gap:calc(4px*var(--k))}
.wheels>em{font:700 calc(26px*var(--k))/1 var(--f-board);font-style:normal;color:#d8d3c6}
.wheel{display:flex;flex-direction:column;align-items:center;outline:none}
.wheel button{width:calc(52px*var(--k));height:calc(18px*var(--k));padding:0;border:0;border-radius:calc(3px*var(--k));font-size:calc(9px*var(--k));color:rgba(214,208,194,.6);
  background:repeating-linear-gradient(#3c3e43 0 calc(2px*var(--k)),#1a1b1e calc(2px*var(--k)) calc(4px*var(--k)));box-shadow:0 0 0 calc(2px*var(--k)) #0b0b0c}
.wheel button:hover{color:#f6c54a}
.wheel .win{position:relative;overflow:hidden;width:calc(52px*var(--k));height:calc(44px*var(--k));margin:calc(4px*var(--k)) 0;border-radius:calc(4px*var(--k));display:grid;place-items:center;
  font:700 calc(28px*var(--k))/1 var(--f-board);color:#f3f0e8;background:linear-gradient(#2a2b2f,#17181b 50%,#0e0f11 50%,#1f2023);
  box-shadow:inset 0 0 0 calc(2px*var(--k)) #000,0 calc(2px*var(--k)) calc(4px*var(--k)) rgba(0,0,0,.6)}
.wheel .win::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.9)}
.wheel:focus-visible .win{box-shadow:inset 0 0 0 calc(2px*var(--k)) #f6c54a}
.wheel .win b.up{animation:rollUp .22s ease-out}.wheel .win b.down{animation:rollDown .22s ease-out}
@keyframes rollUp{0%{transform:translateY(60%);opacity:.2}100%{transform:none;opacity:1}}
@keyframes rollDown{0%{transform:translateY(-60%);opacity:.2}100%{transform:none;opacity:1}}
.plate p{grid-column:1/-1;margin:0;font:500 calc(14px*var(--k))/1.35 var(--f-board);color:rgba(214,208,194,.6)}

.plate .vers h4{margin:0 0 calc(6px*var(--k));display:flex;align-items:baseline;gap:calc(14px*var(--k));font:700 calc(22px*var(--k))/1 var(--f-board);color:#d8d3c6}
.plate .vers li.now h4 b{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.4)}

.plate h4.lg:first-child{margin-top:0}

  font:700 calc(13px*var(--k))/1.25 var(--f-board);color:#17140e;background:linear-gradient(#efe9da,#bdb5a2);box-shadow:0 calc(2px*var(--k)) 0 #050505}

<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fx" role="img" aria-label="Flight board showing planes passing overhead"></canvas>
  <div id="modeSw"><button type="button" data-mode="overhead" aria-label="Overhead">​</button><button type="button" data-mode="airport" aria-label="Airport">​</button></div>
  <div class="photo screen" id="photoFrame" hidden><canvas id="photoCv"></canvas></div>
  <img id="photoImg" alt="" referrerpolicy="no-referrer">
  <canvas id="radarCv" hidden aria-hidden="true"></canvas>
  <canvas id="flipCv" hidden aria-hidden="true"></canvas>
  <div class="rail" id="railPages" aria-label="Pages"></div>
  <div class="rail" id="railViews" aria-label="Views"></div>
  <div class="rail" id="viewTools" hidden></div>
  <section id="cockpit" hidden aria-label="Settings"></section>
  <div id="shade"></div>
  <span class="pip" id="pip" aria-hidden="true"></span>
  <footer>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
    <div class="actions">
      <button id="btnDiag" type="button">Diagnostics</button>
    </div>
  </footer>
</div>

<aside id="diag" hidden aria-label="Diagnostics">
  <header>
    <h2>Diagnostics <span>Diagnose</span></h2>
    <div class="actions"><button id="diagCopy" type="button">Copy log</button><button id="diagClose" type="button">Close</button></div>
  </header>
  <dl class="dstats" id="diagStats"></dl>
  <div id="diagSources"></div>
  <div id="diagLogWrap"><h3>Connection log</h3><ol id="diagLog"></ol></div>
  <textarea id="diagText" aria-hidden="true" tabindex="-1"></textarea>
</aside>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const W = 1920, H = 1080, M = 64, IW = W - 2 * M;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let FONT = '"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif';
const COL = {housing:"#0b0b0c", rule:"#25262a", ink:"#f3f0e8", amber:"#f0b429", muted:"#7f838b", labelEn:"#6d7179"};
const FLAP = ["#2b2c2f", "#232427", "#1c1d1f", "#161719"];
const THEMES = {
  classic:   {font:'"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif', flap:["#2b2c2f","#232427","#1c1d1f","#161719"],
              ink:"#f3f0e8", accent:"#f0b429", label2:"#6d7179", metal:["#1d1e21","#141517","#18191c"]},
  frankfurt: {font:'"Oswald","Archivo Narrow","Arial Narrow",sans-serif', flap:["#222222","#1b1b1b","#151515","#101010"],
              ink:"#ffd21f", accent:"#ffffff", label2:"#8c8c8c", metal:["#1a1a1a","#111111","#161616"]},
  blue:      {font:'"Barlow Condensed","Archivo Narrow","Arial Narrow",sans-serif', flap:["#29406e","#21365f","#1b2d51","#152443"],
              ink:"#f5f7fb", accent:"#9ccaff", label2:"#71809c", metal:["#151d2d","#0e1422","#121a29"]}
};
let METAL = THEMES.classic.metal;
// Aircraft worth running to the window for. Type codes are ICAO designators.
const SPECIAL_TYPES = {A388:"SUPERJUMBO", B741:"JUMBO", B742:"JUMBO", B743:"JUMBO", B744:"JUMBO", B748:"JUMBO", B74S:"JUMBO", B74R:"JUMBO",
  A3ST:"BELUGA", A337:"BELUGA", A124:"ANTONOV", A225:"ANTONOV", AN22:"ANTONOV", CONC:"CONCORDE",
  C17:"MILITARY", C5M:"MILITARY", A400:"MILITARY", C130:"MILITARY", C30J:"MILITARY", K35R:"MILITARY", EUFI:"MILITARY", F16:"MILITARY", F35:"MILITARY", P3:"MILITARY",
  C295:"MILITARY", E390:"MILITARY",
  EC35:"HELICOPTER", EC45:"HELICOPTER", EC30:"HELICOPTER", EC55:"HELICOPTER", EC75:"HELICOPTER", AS50:"HELICOPTER", AS65:"HELICOPTER",
  A139:"HELICOPTER", A169:"HELICOPTER", H160:"HELICOPTER", B06:"HELICOPTER", B407:"HELICOPTER", R44:"HELICOPTER", R66:"HELICOPTER",
  S76:"HELICOPTER", NH90:"HELICOPTER", UH1:"HELICOPTER", H60:"HELICOPTER", AS32:"HELICOPTER"};
// Home airports the board knows runways for (true track of each runway direction).
const AIRPORTS = {VIE: {icao:"LOWW", name:"Vienna", lat:48.1103, lon:16.5697, rwys:[[116,"11"],[296,"29"],[164,"16"],[344,"34"]],
  strips:[[48.1228, 16.5334, 48.1090, 16.5756], [48.1198, 16.5782, 48.0886, 16.5913]]}};   // runway ends (OurAirports), for the radar

/* Drums: the order a real flap module turns through. */
const DRUM_ALPHA = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-/:,'&()";
const DRUM_DIGIT = " 0123456789:";
const DRUM_ALT = " 0123456789,.FTKMH/";   /* short drums for values that change often */
const DRUM_POS = " 0123456789.:KMNESWICADORV";       // the letters of "in … sec" in every language too
const TRENDS = ["", "UP", "LEVEL", "DOWN"];
const TREND_COLOR = {UP: "#45d483", LEVEL: "#c9c6bf", DOWN: "#f6be35"};
const REMARKS = ["", "OVERHEAD", "INBOUND", "FLYING BY", "OUTBOUND", "PASSED", "NEARBY", "NO TRAFFIC", "OFFLINE", "ARRIVING", "DEPARTING", "OVERFLIGHT",
  "CLOSE BY", "NEW TYPE", "NEW AIRLINE", "FAVOURITE", "SUPERJUMBO", "JUMBO", "BELUGA", "ANTONOV", "CONCORDE", "MILITARY", "HELICOPTER", "SPECIAL", "EMERGENCY",
  "TAKE-OFF", "CLIMBING", "APPROACH", "FINAL", "LANDED"];
// The airport statuses show a plane taking off or landing in front of the word (tile).
const AP_ICON = {"TAKE-OFF": "dep", CLIMBING: "dep", APPROACH: "arr", FINAL: "arr", LANDED: "arr"};
const GOLD = {fill:["#e6b94a","#c99a24"], fg:"#1b1508"};
const REMARK_LOOK = {
  OVERHEAD:{fill:["#27a85e","#1d8a4b"], fg:"#ffffff"},
  INBOUND:{fill:["#f6be35","#dc9f1d"], fg:"#17140d"},
  PASSED:{fill:["#3d3f44","#303237"], fg:"#d9d6cf"},
  NEARBY:{fill:["#2c6ec4","#215aa2"], fg:"#ffffff"},
  "FLYING BY":{fill:["#2c6ec4","#215aa2"], fg:"#ffffff"},
  OUTBOUND:{fill:["#3d3f44","#303237"], fg:"#d9d6cf"},
  "NO TRAFFIC":{fill:["#2f3135","#26282b"], fg:"#a6a49e"},
  OFFLINE:{fill:["#cb3a2f","#aa2d24"], fg:"#ffffff"},
  ARRIVING:{fg:"#45d483"}, DEPARTING:{fg:"#f6be35"}, OVERFLIGHT:{fg:"#86b8ff"}, "CLOSE BY":{fg:"#86b8ff"},
  "NEW TYPE":{fill:["#f4ecd8","#e2d6b8"], fg:"#8c1c1c", tint:"#efe2c0"}, "NEW AIRLINE":{fill:["#f4ecd8","#e2d6b8"], fg:"#8c1c1c", tint:"#efe2c0"},
  FAVOURITE:{fill:["#c93d80","#a72f68"], fg:"#ffffff"},
  SUPERJUMBO:GOLD, JUMBO:GOLD, BELUGA:GOLD, ANTONOV:GOLD, CONCORDE:GOLD, SPECIAL:GOLD,
  MILITARY:{fill:["#66743f","#525e31"], fg:"#f1f0de"}, HELICOPTER:{fill:["#22908f","#187473"], fg:"#ffffff"},
  EMERGENCY:{fill:["#e0372c","#bb2a20"], fg:"#ffffff"},
  "TAKE-OFF":{fill:["#f6be35","#dc9f1d"], fg:"#17140d"}, CLIMBING:{fill:["#3d3f44","#303237"], fg:"#f6be35"},
  APPROACH:{fill:["#2c6ec4","#215aa2"], fg:"#ffffff"}, FINAL:{fill:["#27a85e","#1d8a4b"], fg:"#ffffff"},
  LANDED:{fill:["#3d3f44","#303237"], fg:"#d9d6cf"}
};

/* ---------- settings ---------- */
const DEFAULTS = {place:"Vienna", lat:48.2085, lon:16.3731, radiusKm:15, home:"VIE", maxAltFt:60000, units:"metric", sound:true, speedPct:85, quick:false, refreshS:10, logos:true, overKm:3, demo:false,
  theme:"classic", rotateS:30, favs:"", chimes:true, imperfect:true, night:true, nightFrom:"22:30", nightTo:"07:00", nightDim:40, airtimeMin:3, quality:"auto", mode:"overhead", lang:"auto"};
// A guest (friends and family, relay 19+) keeps their own settings: in this browser under their own key, and on their
// profile, which the relay hands back (OVERHEAD_GUEST). Their place comes first, in the phone app's welcome.
const GUEST = window.OVERHEAD_GUEST || null;
if (GUEST && !(GUEST.settings && GUEST.settings.located)) location.replace("/app/");
const SKEY = GUEST ? "od.settings.g." + GUEST.id : "od.settings";
function loadSettings(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; } catch {}
  if (saved.v !== 2) ["lat", "lon", "place", "home", "radiusKm", "units"].forEach(k => delete saved[k]);  // older saves stored every field
  delete saved.v;
  return {...DEFAULTS, ...(GUEST && GUEST.settings || {}), ...saved};
}
function saveSettings(){
  const changed = {v: 2};
  for (const [k, v] of Object.entries(S)) if (k !== "proxy" && JSON.stringify(v) !== JSON.stringify(DEFAULTS[k])) changed[k] = v;
  try { localStorage.setItem(SKEY, JSON.stringify(changed)); } catch {}
  if (GUEST) {                                       // the profile learns them too, always with the place
    const {v, ...mine} = changed;
    fetch(`${relay()}/me`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({settings: {...mine, lat: S.lat, lon: S.lon, radiusKm: S.radiusKm, place: S.place, located: true}})}).catch(() => {});
  }
}
Object.assign(DEFAULTS, window.OVERHEAD_DEFAULTS || {});  // location etc. supplied by the home relay
let S = loadSettings();
S.sound = S.sound === true || (typeof S.sound === "string" && S.sound !== "off");
(() => { // URL overrides for this session, handy for kiosk setups: ?lat=..&lon=..&radius=..&home=..&place=..&demo
  const q = new URLSearchParams(location.search);
  const num = k => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : null; };
  if (num("lat") != null) S.lat = num("lat");
  if (num("lon") != null) S.lon = num("lon");
  if (num("radius") != null) S.radiusKm = num("radius");
  if (num("over") != null) S.overKm = num("over");
  if (num("maxalt") != null) S.maxAltFt = num("maxalt");
  if (q.get("home")) S.home = q.get("home").toUpperCase();
  if (q.get("place")) S.place = q.get("place");
  if (q.get("units")) S.units = q.get("units") === "metric" ? "metric" : "aviation";
  if (q.has("sound")) { const v = q.get("sound"); S.sound = !(v === "0" || v === "off"); }
  if (q.get("proxy")) S.proxy = q.get("proxy");
  if (q.has("hd")) S.hd = q.get("hd") !== "0";
  if (q.has("logos")) S.logos = !(q.get("logos") === "0" || q.get("logos") === "off");
  if (num("speed") != null) S.speedPct = num("speed");
  if (num("refresh") != null) S.refreshS = Math.min(60, Math.max(3, num("refresh")));
  if (q.has("demo") || /demo/i.test(location.hash)) S.demo = q.get("demo") !== "0";
  if (q.get("theme") && THEMES[q.get("theme")]) S.theme = q.get("theme");
  if (num("rotate") != null) S.rotateS = num("rotate");
  if (q.get("favs")) S.favs = q.get("favs");
  if (q.get("lang")) S.lang = q.get("lang");
  if (q.get("mode")) S.mode = q.get("mode") === "airport" ? "airport" : "overhead";
  if (q.has("chimes")) S.chimes = q.get("chimes") !== "0";
  if (q.has("night")) S.night = q.get("night") !== "0";
  if (num("airtime") != null) S.airtimeMin = Math.max(0, num("airtime"));
  if (q.get("quality")) S.quality = q.get("quality");
})();

/* ---------- diagnostics log ---------- */
const DIAG = {log: [], polls: [], relayEvents: [], relayStatus: null, closest: null, open: false};
let diagQueued = false;
function dlog(level, msg){
  DIAG.log.unshift({t: Date.now(), level, msg: String(msg), src: "board"});
  if (DIAG.log.length > 400) DIAG.log.length = 400;
  scheduleDiag();
}
function scheduleDiag(){ if (DIAG.open && !diagQueued) { diagQueued = true; requestAnimationFrame(() => renderDiag()); } }

/* ---------- text helpers ---------- */
function clean(s){
  return String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "SS").replace(/[Øø]/g, "O").replace(/[Łł]/g, "L")
    .toUpperCase().replace(/[^A-Z0-9 .\-\/:,'&()]/g, "").replace(/\s+/g, " ").trim();
}
function trimTo(s, w){
  if (s.length <= w) return s;
  let cut = -1;
  for (let i = Math.min(w, s.length - 1); i > 0; i--) if (" -/".includes(s[i])) { cut = i; break; }
  return (cut >= Math.ceil(w * .5) ? s.slice(0, cut) : s.slice(0, w)).replace(/[\s,.:\/&'-]+$/, "");   // "PENDIK, ISTANBUL" → "PENDIK", not "PENDIK,"
}
const nf = new Intl.NumberFormat("en-US");
function hhmm(d = new Date()){ return d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"}); }

/* ---------- canvas, scaling ---------- */
/* Drawing quality. Fire TV and LG TVs have little graphics power: they draw at 1080p, at 30 frames a second,
   with shorter flap runs and a smaller cache ("1080p, lighter for TVs"). Everything else draws as sharp as the
   screen allows, up to 4K. Settings → Drawing quality, or ?quality=1080 / 1440 / high. */
const WEAK_TV = /AFT[A-Z]|Silk\/|AmazonWebAppPlatform|Web0S|webOS|NetCast|Android TV|GoogleTV|BRAVIA|AndroidTV/i.test(navigator.userAgent || "");
const quality = () => { const q = S.quality || "auto"; return q === "auto" ? (WEAK_TV ? "1080" : "high") : q; };
const LITE = () => quality() === "1080";
const pxCap = () => ({"1080": 1, "1440": 4 / 3}[quality()] || 2);
const stage = $("stage"), bg = $("bg"), fx = $("fx");
const bgx = bg.getContext("2d"), fxx = fx.getContext("2d");
let PX = 1, K = 1;

/* ---------- fields ---------- */
const fields = {}, allCells = [];
const LIST_ROWS = 8;
function def(id, o){ fields[id] = {id, drum: DRUM_ALPHA, style: "ink", align: "left", loud: .7, ...o}; }
def("clock",   {kind:"chars", n:5, drum:DRUM_DIGIT, dur:95, loud:.8});
def("flight",  {kind:"chars", n:7, dur:82, label:["Flight","Flug"], loud:1});
def("airline", {kind:"word",  n:12, dur:120, words:"airline", label:["Airline","Fluglinie"], loud:1});
def("remarks", {kind:"word",  n:9, dur:120, words:"remarks", label:["Status",""], loud:1});
def("fromCode",{kind:"chars", n:3, dur:82, style:"amber", label:["From","Von"], loud:1});
def("fromCity",{kind:"chars", n:11, dur:82, loud:1});
def("toCode",  {kind:"chars", n:3, dur:82, style:"amber", label:["To","Nach"], loud:1});
def("toCity",  {kind:"chars", n:11, dur:82, loud:1});
def("type",    {kind:"chars", n:18, dur:66, label:["Aircraft","Flugzeug"]});
def("reg",     {kind:"chars", n:7, dur:66, label:["Reg.","Kennz."]});
def("alt",     {kind:"chars", n:9, dur:66, drum:DRUM_ALT, align:"right", label:["Altitude","Höhe"]});
def("trend",   {kind:"word",  n:2, dur:110, words:"trend"});
def("speed",   {kind:"chars", n:8, dur:66, drum:DRUM_ALT, align:"right", label:["Speed","Geschw."]});
def("pos",     {kind:"chars", n:9, dur:66, drum:DRUM_POS, label:["Position",""]});
def("depTime", {kind:"chars", n:5, dur:80, drum:DRUM_DIGIT, label:["Departure","Abflug"]});
def("arrTime", {kind:"chars", n:5, dur:80, drum:DRUM_DIGIT, label:["Arrival","Ankunft"]});
def("airTime", {kind:"chars", n:5, dur:80, drum:DRUM_DIGIT, label:["Flight time","Flugzeit"]});
for (let i = 0; i < LIST_ROWS; i++) {
  const lab = (en, de) => i === 0 ? [en, de] : null;
  def(`l${i}time`,   {kind:"chars", n:5, drum:DRUM_DIGIT, dur:60, style:"amber", loud:.5, label:lab("Time","Zeit")});
  def(`l${i}logo`,   {kind:"logo",  n:3, dur:95, loud:.5});
  def(`l${i}flight`, {kind:"chars", n:7, dur:60, loud:.5, label:lab("Flight","Flug")});
  def(`l${i}from`,   {kind:"chars", n:11, dur:60, loud:.5, label:lab("From","Von")});
  def(`l${i}to`,     {kind:"chars", n:11, dur:60, loud:.5, label:lab("To","Nach")});
  def(`l${i}type`,   {kind:"chars", n:18, dur:60, loud:.5, label:lab("Aircraft","Flugzeug")});
  def(`l${i}remarks`,{kind:"word",  n:10, dur:95, words:"remarks", small:true, loud:.5, label:lab("Remarks","Hinweis")});
}
// The lower half rotates between pages. Spotted today uses the list flaps; the other pages have their own.
const LIST_IDS = [];
for (let i = 0; i < LIST_ROWS; i++) LIST_IDS.push(`l${i}time`, `l${i}logo`, `l${i}flight`, `l${i}from`, `l${i}to`, `l${i}type`, `l${i}remarks`);
const PAGE_FIELDS = {stats: [], aircraft: [], aplists: []};
function pdef(pg, id, o){ def(id, {...o, pageOff: true}); PAGE_FIELDS[pg].push(id); }
pdef("stats", "stPlanes",   {kind:"chars", n:4, dur:70, drum:DRUM_DIGIT, align:"right", label:["Planes","Flugzeuge"]});
pdef("stats", "stAirlines", {kind:"chars", n:3, dur:70, drum:DRUM_DIGIT, align:"right", label:["Airlines","Airlines"]});
pdef("stats", "stTypes",    {kind:"chars", n:3, dur:70, drum:DRUM_DIGIT, align:"right", label:["Types","Typen"]});
pdef("stats", "stOver",     {kind:"chars", n:3, dur:70, drum:DRUM_DIGIT, align:"right", label:["Overhead","Direkt drüber"]});
pdef("stats", "stHour",     {kind:"chars", n:5, dur:70, drum:DRUM_DIGIT, style:"amber", label:["Busiest hour","Meiste Flüge"]});
pdef("stats", "stLow",      {kind:"chars", n:24, dur:60, label:["Lowest pass","Tiefster Überflug"]});
pdef("stats", "stHigh",     {kind:"chars", n:24, dur:60, label:["Highest pass","Höchster Überflug"]});
pdef("stats", "stFast",     {kind:"chars", n:24, dur:60, label:["Fastest","Schnellster"]});
pdef("stats", "stTop",      {kind:"chars", n:24, dur:60, label:["Most seen airline","Häufigste Airline"]});
pdef("stats", "stFirst",    {kind:"chars", n:24, dur:60, label:["First of the day","Erster des Tages"]});

function emptyNote(){
  if (view) return "";
  if (page === "aircraft") return feat ? "" : T("No plane to show right now");
  if (page === "apdep") return apFocus("dep") ? "" : T("No plane taking off right now");
  if (page === "apland") return apFocus("arr") ? "" : T("No plane landing right now");
  if (page === "stats") return spotted.length ? "" : T("Nothing spotted yet today.");
  return "";
}

function screw(g, x, y, r){
  const sg = g.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
  sg.addColorStop(0, "#8d9095"); sg.addColorStop(.6, "#45474c"); sg.addColorStop(1, "#1b1c1f");
  g.fillStyle = sg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.save(); g.translate(x, y); g.rotate((x * 7 + y * 3) % Math.PI); g.fillStyle = "rgba(0,0,0,.7)"; g.fillRect(-r * .75, -r * .14, r * 1.5, r * .28); g.restore();
}

/* ---------- the aircraft photo: on a small screen set into the board, or engraved into the metal ---------- */
const BEZEL = 16;
const photoStyle = () => "screen";      // the photo always sits on its screen (the engraved and plain styles were dropped in 1.8.1)

function photoBox(){              // where the picture itself goes, in board units

  if (st === "screen") return {x: x + BEZEL, y: y + BEZEL, w: w - 2 * BEZEL, h: h - 2 * BEZEL};
  if (st === "engraved") return {x: x + 18, y: y + 18, w: w - 36, h: h - 36};
  return {x, y, w, h};
}
function photoReady(){
  const d = feat && detailsOf(feat.hex), img = $("photoImg");

}
function drawCover(g, img, x, y, w, h){
  const sc = Math.max(w / img.naturalWidth, h / img.naturalHeight), iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
  g.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}
// The housing: a raised frame with four screws, and the glass of a switched-off screen in it.
function drawBezel(g){

  g.fillStyle = hg; rr(g, x, y, w, h, 10); g.fill();

  edge.addColorStop(0, "rgba(255,255,255,.13)"); edge.addColorStop(.5, "rgba(255,255,255,.03)"); edge.addColorStop(1, "rgba(0,0,0,.5)");
  g.lineWidth = 1.4; g.strokeStyle = edge; rr(g, x + .7, y + .7, w - 1.4, h - 1.4, 9.5); g.stroke();
  g.fillStyle = "#010202"; rr(g, b.x - 4, b.y - 4, b.w + 8, b.h + 8, 6); g.fill();               // the recess

  g.fillStyle = "#08090b"; g.fillRect(b.x, b.y, b.w, b.h);                                  // the screen, switched off
  g.translate(b.x, b.y); glass(g, b.w, b.h, 1.4);

      g.font = `500 16px ${FONT}`; g.fillStyle = "rgba(170,190,215,.42)"; g.fillText(T("The page fills in as soon as there is one."), b.w / 2, b.h / 2 + 24);
    } else { g.fillStyle = "rgba(170,190,215,.32)"; g.fillText(T("NO PICTURE"), b.w / 2, b.h / 2 + 5); }

  const lx = x + w - 34, ly = y + h - 8, led = g.createRadialGradient(lx, ly, 0, lx, ly, 9);

// Glass: a soft sheen from the top left with a faint sharp edge, like a window reflected in it.
function glass(g, w, h, k = 1){
  const s = g.createLinearGradient(0, 0, w * .55, h);
  s.addColorStop(0, `rgba(255,255,255,${.07 * k})`); s.addColorStop(.44, `rgba(255,255,255,${.022 * k})`);
  s.addColorStop(.445, "rgba(255,255,255,0)"); s.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = s; g.fillRect(0, 0, w, h);
  const top = g.createLinearGradient(0, 0, 0, 12);                       // the bezel's shadow on the glass
  top.addColorStop(0, "rgba(0,0,0,.6)"); top.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = top; g.fillRect(0, 0, w, 12);
  const left = g.createLinearGradient(0, 0, 9, 0);
  left.addColorStop(0, "rgba(0,0,0,.4)"); left.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = left; g.fillRect(0, 0, 9, h);
}
// What the screen shows: the photo, a little softer than a print, faint scan lines, darker towards the edges.
function paintScreen(g, w, h, img){
  g.fillStyle = "#08090b"; g.fillRect(0, 0, w, h);
  g.save();
  try { g.filter = "saturate(.86) contrast(1.05) brightness(.95)"; } catch {}
  drawCover(g, img, 0, 0, w, h);
  g.restore();
  g.fillStyle = "rgba(0,0,0,.11)";
  for (let y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
  const v = g.createRadialGradient(w / 2, h / 2, h * .32, w / 2, h / 2, w * .62);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.42)");
  g.fillStyle = v; g.fillRect(0, 0, w, h);
  g.font = `600 13px ${FONT}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
  if ("letterSpacing" in g) g.letterSpacing = "1.5px";
  g.shadowColor = "rgba(0,0,0,.8)"; g.shadowBlur = 3 * PX;
  g.fillStyle = "rgba(235,240,245,.62)"; g.fillText(T("PHOTO") + "  AIRPORT-DATA.COM", w - 12, h - 11);
  g.shadowColor = "transparent"; g.shadowBlur = 0;
  if ("letterSpacing" in g) g.letterSpacing = "0px";
  g.textAlign = "left";
  glass(g, w, h);
}
function paintPlain(g, w, h, img){
  g.fillStyle = "#060607"; g.fillRect(0, 0, w, h);
  g.save(); try { g.filter = "saturate(.9) contrast(1.05)"; } catch {} drawCover(g, img, 0, 0, w, h); g.restore();
  g.font = `600 13px ${FONT}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
  const t = "Photo: airport-data.com", tw = g.measureText(t).width;
  g.fillStyle = "rgba(0,0,0,.55)"; rr(g, w - tw - 20, h - 28, tw + 12, 20, 3); g.fill();
  g.fillStyle = "#d9d6cf"; g.fillText(t, w - 14, h - 13); g.textAlign = "left";
}
// Engraved: the photo cut into the panel as fine lines, wider where the picture is darker.
function drawPlaque(g){
  const x = M, y = Y.list0 + 6, w = PHOTO.w, h = PHOTO.h;
  for (const [i, a] of [[3, .55], [9, .4]]) {                          // a double groove round the plate
    g.lineWidth = 1.3; g.strokeStyle = `rgba(0,0,0,${a})`; rr(g, x + i, y + i, w - 2 * i, h - 2 * i, 6); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.07)"; rr(g, x + i + .9, y + i + .9, w - 2 * i, h - 2 * i, 6); g.stroke();
  }
  g.font = `600 12px ${FONT}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
  if ("letterSpacing" in g) g.letterSpacing = "1.5px";
  g.fillStyle = "rgba(0,0,0,.6)"; g.fillText(T("PHOTO") + "  AIRPORT-DATA.COM", x + w - 16, y + h - 13);
  g.fillStyle = "rgba(255,255,255,.2)"; g.fillText(T("PHOTO") + "  AIRPORT-DATA.COM", x + w - 16, y + h - 12);
  if ("letterSpacing" in g) g.letterSpacing = "0px";
  g.textAlign = "left";
  const img = photoReady();
  if (!img) return;
  engravedSrc = img.getAttribute("src");
  try { engrave(g, img, photoBox()); }
  catch (e) { dlog("debug", `Couldn't engrave the photo: ${e.message}`); }
}
function engrave(g, img, b){
  const cw = Math.max(1, Math.round(b.w * PX)), ch = Math.max(1, Math.round(b.h * PX));
  const mk = () => { const c = document.createElement("canvas"); c.width = cw; c.height = ch; return c; };
  const a = mk(), ga = a.getContext("2d");
  ga.fillStyle = "#fff"; ga.fillRect(0, 0, cw, ch);
  ga.filter = `grayscale(1) invert(1) contrast(.5) brightness(1.36) blur(${(.6 * PX).toFixed(2)}px)`;
  drawCover(ga, img, 0, 0, cw, ch);
  ga.filter = "none";
  const e = 30 * PX;                                                   // fade out towards the edges of the plate
  for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, 0, 0, e, 0, 0, cw, e], [0, ch, 0, ch - e, 0, ch - e, cw, e], [0, 0, e, 0, 0, 0, e, ch], [cw, 0, cw - e, 0, cw - e, 0, e, ch]]) {
    const lg = ga.createLinearGradient(x0, y0, x1, y1);
    lg.addColorStop(0, "rgba(255,255,255,1)"); lg.addColorStop(1, "rgba(255,255,255,0)");
    ga.fillStyle = lg; ga.fillRect(rx, ry, rw, rh);
  }
  const per = Math.max(3, Math.round(4 * PX)), pc = document.createElement("canvas");   // one line of the engraving
  pc.width = 4; pc.height = per;
  const gp = pc.getContext("2d");
  for (let r = 0; r < per; r++) {
    const v = Math.round(255 * (.53 + .47 * Math.abs(2 * (r + .5) / per - 1)));
    gp.fillStyle = `rgb(${v},${v},${v})`; gp.fillRect(0, r, 4, 1);
  }
  ga.globalCompositeOperation = "multiply"; ga.fillStyle = ga.createPattern(pc, "repeat"); ga.fillRect(0, 0, cw, ch);
  const cut = mk(), gc = cut.getContext("2d");
  gc.filter = "contrast(24)"; gc.drawImage(a, 0, 0);                                    // the cuts: black on white
  const lit = mk(), gl = lit.getContext("2d");
  gl.filter = "invert(1)"; gl.drawImage(cut, 0, 0);                                     // and white on black
  g.save();
  g.globalCompositeOperation = "multiply"; g.globalAlpha = .75; g.drawImage(cut, b.x, b.y - .9, b.w, b.h);    // the cut's shaded upper wall
  g.globalCompositeOperation = "screen"; g.globalAlpha = .3; g.drawImage(lit, b.x, b.y + .4, b.w, b.h);       // its bright floor
  g.restore();
}

/* ---------- sound: synthesised flap clatter, only after a click or key press ---------- */
let actx = null, noise = null, lastClack = 0;
function audioInit(){
  if (!S.sound && !S.chimes) return;
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(actx.sampleRate * .012);
      noise = actx.createBuffer(1, len, actx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
    }
    actx.resume();
  } catch { actx = null; }
}
// Every sound goes through one output (sfxOut): a cut of the deepest rumble and of the hiss above ~6.5 kHz, a short room
// and a limiter. Phone and TV speakers play neither the low tones nor the top octaves and add a room of their own;
// headphones play everything, bone-dry, so the synthesised clicks sounded hissy and fake there (the noise bursts reach
// up to 20 kHz). The limiter keeps overlapping clicks from distorting.
let sfxBus = null;
function sfxOut(){
  if (sfxBus) return sfxBus;
  try {
    const sr = actx.sampleRate, hp = actx.createBiquadFilter(), lim = actx.createDynamicsCompressor(), trim = actx.createGain();
    hp.type = "highpass"; hp.frequency.value = 110; hp.Q.value = .7;
    const lp = actx.createBiquadFilter(), lp2 = actx.createBiquadFilter();   // two in a row: a steep enough slope
    lp.type = lp2.type = "lowpass"; lp.frequency.value = lp2.frequency.value = 6500; lp.Q.value = lp2.Q.value = .6;
    lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1;
    trim.gain.value = .82;                            // the compressor's own make-up gain, taken back
    const room = actx.createConvolver(), wet = actx.createGain(), n = Math.floor(sr * .22), ir = actx.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {                     // a small room: decaying noise, different in each ear
      const d = ir.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4) * Math.min(1, i / (sr * .004));
    }
    room.buffer = ir; wet.gain.value = .1;
    hp.connect(lp).connect(lp2); lp2.connect(lim); lp2.connect(room).connect(wet).connect(lim); lim.connect(trim).connect(actx.destination);
    sfxBus = hp;
  } catch { sfxBus = actx.destination; }
  return sfxBus;
}
function clack(n){
  if (!S.sound || nightOn || !actx || actx.state !== "running") return;
  const t = actx.currentTime; if (t - lastClack < (S.quick ? .035 : .014)) return; lastClack = t;    // quick flaps whirr, not buzz
  const src = actx.createBufferSource(); src.buffer = noise; src.playbackRate.value = .7 + Math.random() * .5;
  const fl = actx.createBiquadFilter(); fl.type = "bandpass"; fl.frequency.value = 1400 + Math.random() * 1800; fl.Q.value = 1;
  const gn = actx.createGain(); gn.gain.value = Math.min(.3, .05 + n * .008);
  src.connect(fl).connect(gn).connect(sfxOut()); src.start();
}

// A soft station chime: two falling notes for special aircraft, three rising ones for favourites.
function chime(kind){
  if (!S.chimes || nightOn || !actx || actx.state !== "running") return;
  const notes = kind === "fav" ? [[523.25, 0], [659.25, .17], [783.99, .34]] : kind === "emergency" ? [[587.33, 0], [440, .32], [587.33, .64], [440, .96]] : [[659.25, 0], [523.25, .55]];
  const t0 = actx.currentTime + .03, out = actx.createGain();
  out.gain.value = .55; out.connect(sfxOut());
  for (const [freq, dt] of notes) {
    for (const [mult, amp] of [[1, .26], [2.01, .07], [3.02, .035], [4.2, .015]]) {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + dt;
      o.type = "sine"; o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8 / mult);
      o.connect(g).connect(out); o.start(t); o.stop(t + 1.9);
    }
  }
}

/* ---------- board styles and night mode ---------- */
function applyTheme(){
  const T = THEMES[S.theme] || THEMES.classic;
  FONT = T.font; FLAP.splice(0, 4, ...T.flap); METAL = T.metal;
  COL.ink = T.ink; COL.amber = T.accent; COL.labelEn = T.label2;
  const root = document.documentElement.style;
  root.setProperty("--f-board", T.font); root.setProperty("--accent", T.accent);
  const redraw = () => { clearTiles(); geometry(); drawStatic(); redrawAll(); };
  try {
    Promise.race([Promise.all(["700 40px", "600 20px", "400 40px"].map(w => document.fonts.load(`${w} ${T.font}`))), new Promise(r => setTimeout(r, 2500))])
      .then(redraw, redraw);
  } catch { redraw(); }
}
let nightOn = false, nightKnown = false;
function nightNow(){
  if (!S.night) return false;
  const mins = v => { const [h, m] = String(v || "").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  const d = new Date(), n = d.getHours() * 60 + d.getMinutes(), a = mins(S.nightFrom), b = mins(S.nightTo);
  return a === b ? false : a < b ? n >= a && n < b : n >= a || n < b;
}
function applyNight(force){
  const on = nightNow();
  if (on === nightOn && nightKnown && !force) return;
  if (nightKnown && on !== nightOn) dlog("info", on ? `Night mode: dimmed to ${S.nightDim}% and muted until ${S.nightTo}` : "Night mode over");
  nightOn = on; nightKnown = true;
  $("shade").style.opacity = on ? String(1 - Math.min(100, Math.max(10, +S.nightDim || 40)) / 100) : "0";
}

/* The board keeps the newest 400 sightings; the Spotted today tab asks the relay (version 10 or newer) for the whole

let fullDay = {at: 0, rev: null, date: null, list: null};

  fullDay.busy = true; fullDay.at = now;

/* ---------- special aircraft and favourites ---------- */

/* ---------- tracking ---------- */

/* Every plane that comes within the spotting radius gets one entry per pass; its closest

    const prior = spotted.find(e => e.hex === o.ac.hex && now - entryTime(e) < SAME_PASS_MS);
    if (prior) {
      if (prior.minDist == null || o.dist < prior.minDist - .05) {

    const p = enrich(o.ac);

    p.then(info => { fillEntry(e, info); saveLog(); renderPage(); renderSpottedBoard(); });

/* Airtime. Planes that hang around (a police helicopter over an incident, a circling light aircraft) get at most

  const now = Date.now();

    h.busy = true; h.t = now;

      .then(d => {
        h.d = d;

        else if (d.status === "ok") dlog("debug", `Times for ${fn}: ${d.kind === "arr" ? "arrives" : "departed"} ${hhmm(new Date(d.actual || d.sched))}, planned ${d.sched ? hhmm(new Date(d.sched)) : "?"} (Vienna Airport: ${d.text || d.code})`);
        if (feat && feat.info && feat.info.flightNo === fn) renderTimes();

// The instrument's housing and the legend, engraved into the panel.
function radarStatic(g){

  ["To keep it like an app: on Android, Chrome's menu → Add to home screen; on an iPhone, Safari → Share → Add to Home Screen.", "Als App behalten: auf Android Chrome-Menü → Zum Startbildschirm hinzufügen; auf dem iPhone Safari → Teilen → Zum Home-Bildschirm.", "Pour l'avoir comme une appli : sur Android, menu de Chrome → Ajouter à l'écran d'accueil ; sur iPhone, Safari → Partager → Sur l'écran d'accueil.", "Para tenerla como app: en Android, menú de Chrome → Añadir a pantalla de inicio; en iPhone, Safari → Compartir → Añadir a pantalla de inicio.", "Als app bewaren: op Android Chrome-menu → Toevoegen aan startscherm; op een iPhone Safari → Deel → Zet op beginscherm."],
  ["Privacy: the relay keeps your name, the devices you joined on, your settings and the planes spotted around your location, nothing else. Flight positions come from adsb.lol, adsb.fi and airplanes.live (ODbL), routes and aircraft from adsbdb, photos from airport-data.com.", "Datenschutz: Das Relay speichert deinen Namen, die Geräte, mit denen du beigetreten bist, deine Einstellungen und die Flugzeuge rund um deinen Standort, sonst nichts. Flugpositionen kommen von adsb.lol, adsb.fi und airplanes.live (ODbL), Routen und Flugzeuge von adsbdb, Fotos von airport-data.com.", "Confidentialité : le relais conserve votre nom, les appareils avec lesquels vous avez rejoint, vos réglages et les avions repérés autour de votre position, rien d'autre. Les positions viennent d'adsb.lol, adsb.fi et airplanes.live (ODbL), les routes et avions d'adsbdb, les photos d'airport-data.com.", "Privacidad: el relé guarda tu nombre, los dispositivos con los que te uniste, tus ajustes y los aviones vistos cerca de tu ubicación, nada más. Las posiciones vienen de adsb.lol, adsb.fi y airplanes.live (ODbL), las rutas y aviones de adsbdb, las fotos de airport-data.com.", "Privacy: de relay bewaart je naam, de apparaten waarmee je bent aangesloten, je instellingen en de vliegtuigen rond je locatie, verder niets. Posities komen van adsb.lol, adsb.fi en airplanes.live (ODbL), routes en toestellen van adsbdb, foto's van airport-data.com."],
  ["Turn the knobs and flip the switches, then press Save. Settings are kept with your profile, on every device you use.", "Drehe die Knöpfe und lege die Schalter um, dann Speichern drücken. Die Einstellungen gehören zu deinem Profil, auf jedem Gerät.", "Tournez les boutons et basculez les interrupteurs, puis appuyez sur Enregistrer. Les réglages suivent votre profil, sur chaque appareil.", "Gira los mandos y acciona los interruptores, luego pulsa Guardar. Los ajustes van con tu perfil, en cada dispositivo.", "Draai aan de knoppen en zet de schakelaars om, druk dan op Opslaan. De instellingen horen bij je profiel, op elk apparaat."],

  ["A plane can be more than one of these; the board shows the most special one, in the order listed. Arriving, Departing and Overflight only show in the lists.", "Ein Flugzeug kann mehreres davon sein; die Tafel zeigt das Besonderste, in der Reihenfolge der Liste. Ankunft, Abflug und Überflug erscheinen nur in den Listen.", "Un avion peut cumuler plusieurs de ces statuts ; le tableau affiche le plus spécial, dans l'ordre de la liste. Arrivée, Départ et Survol n'apparaissent que dans les listes.", "Un avión puede ser varias de estas cosas; el panel muestra la más especial, en el orden de la lista. Llegada, Salida y Sobrevuelo solo aparecen en las listas.", "Een vliegtuig kan meer dan één hiervan zijn; het bord toont de meest bijzondere, in de volgorde van de lijst. Aankomst, Vertrek en Overvlucht staan alleen in de lijsten."],
  ["The logbook is kept by the home relay (version 5 or newer), so every screen shares it and nothing is lost on a restart.", "Das Logbuch führt das Relais zu Hause (ab Version 5), so teilen es alle Bildschirme und bei einem Neustart geht nichts verloren.", "Le carnet est tenu par le relais à la maison (version 5 ou plus), donc tous les écrans le partagent et rien n'est perdu au redémarrage.", "El registro lo guarda el relé de casa (versión 5 o posterior), así que todas las pantallas lo comparten y no se pierde nada al reiniciar.", "Het logboek wordt bijgehouden door het relais thuis (versie 5 of nieuwer), zodat alle schermen het delen en er bij een herstart niets verloren gaat."],

  ["shows the plane flying over you right now on a split-flap board, like the ones in airport halls, with what passed today, a lifetime logbook and a radar. In Airport style it follows the planes taking off and landing at an airport.", "zeigt das Flugzeug, das gerade über dich fliegt, auf einer Fallblattanzeige wie in Flughafenhallen, dazu was heute vorbeikam, ein Logbuch und ein Radar. In der Flughafen-Ansicht folgt sie den startenden und landenden Flugzeugen eines Flughafens.", "affiche l'avion qui passe au-dessus de vous sur un tableau à palettes comme dans les halls d'aéroport, avec ce qui est passé aujourd'hui, un carnet de bord et un radar. En vue Aéroport, il suit les avions qui décollent et atterrissent.", "muestra el avión que pasa ahora sobre ti en un panel de paletas como los de los aeropuertos, con lo que pasó hoy, un registro y un radar. En la vista Aeropuerto sigue los aviones que despegan y aterrizan.", "toont het vliegtuig dat nu boven je vliegt op een klapbord zoals in vertrekhallen, met wat vandaag langskwam, een logboek en een radar. In de luchthavenweergave volgt het de vliegtuigen die opstijgen en landen."],

  ["Positions from adsb.lol, adsb.fi and airplanes.live through the relay at home; routes and aircraft from adsbdb and adsb.lol, flight numbers from Flightradar24, times from Vienna Airport, airports from OurAirports, photos from airport-data.com, logos from Aviasales.", "Positionen von adsb.lol, adsb.fi und airplanes.live über das Relais zu Hause; Routen und Flugzeuge von adsbdb und adsb.lol, Flugnummern von Flightradar24, Zeiten vom Flughafen Wien, Flughäfen von OurAirports, Fotos von airport-data.com, Logos von Aviasales.", "Positions d'adsb.lol, adsb.fi et airplanes.live via le relais à la maison ; trajets et avions d'adsbdb et adsb.lol, numéros de vol de Flightradar24, horaires de l'aéroport de Vienne, aéroports d'OurAirports, photos d'airport-data.com, logos d'Aviasales.", "Posiciones de adsb.lol, adsb.fi y airplanes.live a través del relé de casa; rutas y aviones de adsbdb y adsb.lol, números de vuelo de Flightradar24, horarios del aeropuerto de Viena, aeropuertos de OurAirports, fotos de airport-data.com, logotipos de Aviasales.", "Posities van adsb.lol, adsb.fi en airplanes.live via het relais thuis; routes en toestellen van adsbdb en adsb.lol, vluchtnummers van Flightradar24, tijden van Vienna Airport, luchthavens van OurAirports, foto's van airport-data.com, logo's van Aviasales."],

  ["Changes apply when you press Save. Settings are kept on this screen only, so every screen can have its own.", "Änderungen gelten nach Speichern. Die Einstellungen gelten nur für diesen Bildschirm, jeder Bildschirm kann eigene haben.", "Les changements s'appliquent quand vous appuyez sur Enregistrer. Les réglages ne valent que pour cet écran, chaque écran peut avoir les siens.", "Los cambios se aplican al pulsar Guardar. Los ajustes solo valen para esta pantalla, cada pantalla puede tener los suyos.", "Wijzigingen gelden zodra je op Opslaan drukt. De instellingen gelden alleen voor dit scherm, elk scherm kan zijn eigen hebben."],

  ["Settings", "Einstellungen", "Réglages", "Ajustes", "Instellingen"],
  ["The phone didn't say where it is. Is location turned on?", "Das Telefon hat seinen Standort nicht gemeldet. Ist die Standortermittlung an?", "Le téléphone n'a pas indiqué sa position. La localisation est-elle activée ?", "El teléfono no ha dicho dónde está. ¿Está activada la ubicación?", "De telefoon gaf geen locatie door. Staat locatie aan?"],
  ["Update the Fallblatt app to use the phone's location.", "Aktualisiere die Fallblatt-App, um den Standort des Telefons zu nutzen.", "Mettez à jour l'app Fallblatt pour utiliser la position du téléphone.", "Actualiza la app Fallblatt para usar la ubicación del teléfono.", "Werk de Fallblatt-app bij om de locatie van de telefoon te gebruiken."],
  ["This screen can't share its location: browsers only do that for https pages or pages opened on the relay's own computer. Type the latitude and longitude instead.", "Dieser Bildschirm kann seinen Standort nicht teilen: Browser tun das nur für https-Seiten oder Seiten auf dem Computer des Relais. Gib Breite und Länge stattdessen ein.", "Cet écran ne peut pas partager sa position : les navigateurs ne le font que pour les pages https ou ouvertes sur l'ordinateur du relais. Saisissez plutôt la latitude et la longitude.", "Esta pantalla no puede compartir su ubicación: los navegadores solo lo hacen en páginas https o abiertas en el ordenador del relé. Escribe la latitud y la longitud.", "Dit scherm kan zijn locatie niet delen: browsers doen dat alleen voor https-pagina's of pagina's op de computer van het relais. Typ de breedte- en lengtegraad in."],
  ["Location access was turned down. Allow it in the browser's site settings.", "Standortzugriff wurde abgelehnt. Erlaube ihn in den Website-Einstellungen des Browsers.", "L'accès à la position a été refusé. Autorisez-le dans les réglages du site du navigateur.", "Se denegó el acceso a la ubicación. Permítelo en los ajustes del sitio del navegador.", "Toegang tot locatie is geweigerd. Sta het toe in de site-instellingen van de browser."],

/* ---------- airport mode ----------
   For someone at an airport, looking out of the window: the planes taking off from the home airport and the ones
   coming in to land there, worked out from the positions around it. A plane is taking off when it rolls fast along
   the ground or climbs away low and close; it is landing when it comes down towards the airport, and LANDED once it
   rolls out on the ground. The board shows the two lists in place of the plane overhead (Settings → Board). */
const airportMode = () => S.mode === "airport";
const AP_ROWS = 5;
const AP = {code: "", lat: null, lon: null, name: "", city: "", asked: "", deps: [], arrs: [], seen: new Map()};
// The home airport's position: from the board's own table (Vienna), otherwise asked of the relay (18 or newer).
function airportPos(){
  const code = clean(S.home).slice(0, 3);
  if (AP.code !== code) Object.assign(AP, {code, lat: null, lon: null, name: "", city: "", asked: "", deps: [], arrs: [], seen: new Map()});
  const known = AIRPORTS[code];
  if (known && AP.lat == null) Object.assign(AP, {lat: known.lat, lon: known.lon, city: known.name});
  if (AP.lat == null && code.length === 3 && AP.asked !== code && relay() && (window.OVERHEAD_RELAY_VERSION || 0) >= 18) {
    AP.asked = code;
    fetchJSON(`${relay()}/airport?code=${code}`, {}, 8000).then(j => {
      if (AP.code !== code) return;
      if (j.status === "ok") { Object.assign(AP, {lat: j.lat, lon: j.lon, name: j.name || "", city: j.city || ""}); airportChanged(); }
      else if (j.status === "loading") setTimeout(() => { if (AP.asked === code) AP.asked = ""; }, 3000);
    }).catch(() => setTimeout(() => { if (AP.asked === code) AP.asked = ""; }, 10000));
  }
  return AP.lat == null ? null : [AP.lat, AP.lon];
}
// Where to ask for positions: around the home airport in airport mode, around the board's location otherwise.
const queryCenter = () => (airportMode() && airportPos()) || [S.lat, S.lon];
const apName = () => AP.code ? `${AP.city || AP.name || AP.code} (${AP.code})` : "";
function airportProcess(list){
  const at = airportPos(), now = Date.now();
  if (!at) { AP.deps = []; AP.arrs = []; renderAirport(); return; }
  const [alat, alon] = at, kx = 111.32 * Math.cos(alat * Math.PI / 180), ky = 110.57;
  const deps = [], arrs = [], here = new Set();
  for (const ac of list) {
    if (ac.lat == null || ac.lon == null || !ac.hex) continue;
    const x = (ac.lon - alon) * kx, y = (ac.lat - alat) * ky, dist = Math.hypot(x, y);
    if (dist > 50) continue;
    const ground = ac.alt_baro === "ground", alt = typeof ac.alt_baro === "number" ? ac.alt_baro : typeof ac.alt_geom === "number" ? ac.alt_geom : null;
    const gs = ac.gs || 0, kmMin = gs * 1.852 / 60;
    const prev = AP.seen.get(ac.hex);
    let rate = typeof ac.baro_rate === "number" ? ac.baro_rate : typeof ac.geom_rate === "number" ? ac.geom_rate : null;
    if (rate == null && prev && prev.alt != null && alt != null && now - prev.at > 4000) rate = (alt - prev.alt) / ((now - prev.at) / 60000);
    // 0°: flying straight away from the airport, 180°: straight towards it
    const out = ac.track == null || dist < .3 ? 90 : Math.abs(((ac.track - Math.atan2(x, y) * 180 / Math.PI) % 360 + 540) % 360 - 180);
    let kind = null, st = "", t = null;
    if (ground) {
      if (dist <= 5 && gs >= 30) {                    // on the runway at speed: a take-off roll, or rolling out after landing
        kind = prev && prev.kind ? prev.kind : prev && prev.gs != null && gs < prev.gs - 2 ? "arr" : "dep";
        st = kind === "arr" ? "LANDED" : "TAKE-OFF";
      } else if (prev && prev.kind === "arr" && dist <= 5) { kind = "arr"; st = "LANDED"; }
      if (kind === "arr") t = prev && prev.landed ? prev.landed : now;
      if (kind === "dep") t = now;
    } else if (alt != null && alt <= 12000) {
      const climbing = rate != null ? rate > 250 : prev && prev.kind === "dep";
      const descending = rate != null ? rate < -150 : alt <= 4000;
      if (prev && prev.kind === "dep" && dist <= 35 && !(rate != null && rate < -500)) { kind = "dep"; }
      else if (climbing && dist <= 30 && out <= 75 && alt <= 10000) kind = "dep";
      else if (prev && prev.kind === "arr" && dist <= 45 && !(rate != null && rate > 800 && out < 60)) kind = "arr";
      else if (descending && dist <= 45 && out >= 135 && alt <= 10000) kind = "arr";
      if (kind === "dep") {
        st = dist <= 4 && alt <= 3000 ? "TAKE-OFF" : "CLIMBING";
        t = prev && prev.off ? prev.off : now - (kmMin > 1 ? dist / kmMin : 0) * 60000;      // when it left the ground
      } else if (kind === "arr") {
        st = dist <= 12 || alt <= 3500 ? "FINAL" : "APPROACH";
        t = now + (kmMin > 1 ? dist / kmMin + 1 : 5) * 60000;                                 // expected on the ground
      }
    }
    const rec = {kind, gs, alt, at: now, off: prev && prev.off, landed: prev && prev.landed, since: prev ? prev.since : now};
    if (kind === "dep" && !rec.off) rec.off = t;
    if (st === "LANDED" && !rec.landed) rec.landed = now;
    AP.seen.set(ac.hex, rec);
    here.add(ac.hex);
    if (!kind) continue;
    if (kind === "arr" && st === "LANDED" && now - rec.landed > 4 * 60000) continue;      // landed a while ago: off the list
    if (kind === "dep" && st === "CLIMBING" && rec.off && now - rec.off > 12 * 60000) continue;
    const p = enrich(ac), e = {ac, hex: ac.hex, kind, st, t, dist, alt: ground ? null : alt, ground, info: p.info};
    p.then(info => { e.info = info; scheduleAirport(); });
    (kind === "dep" ? deps : arrs).push(e);
  }
  for (const [hex, r] of AP.seen) if (!here.has(hex) && now - r.at > 5 * 60000) AP.seen.delete(hex);
  // Take-offs: the ones on the runway first, then the most recent. Landings: next one down first, the landed ones after.
  deps.sort((a, b) => (a.st === "TAKE-OFF" ? 0 : 1) - (b.st === "TAKE-OFF" ? 0 : 1) || b.t - a.t);
  arrs.sort((a, b) => (a.st === "LANDED" ? 1 : 0) - (b.st === "LANDED" ? 1 : 0) || (a.st === "LANDED" ? b.t - a.t : a.t - b.t));
  AP.deps = deps.slice(0, AP_ROWS); AP.arrs = arrs.slice(0, AP_ROWS);
  renderAirport();
}
// The plane for the top half: the one taking off or landing right now. On the Landing and Take-off pages, that one.
function apFocus(which){
  const coming = AP.arrs.find(e => e.st !== "LANDED"), going = AP.deps[0];
  if (which === "arr") return coming || AP.arrs[0] || null;
  if (which === "dep") return going || null;
  return AP.deps.find(e => e.st === "TAKE-OFF") || AP.arrs.find(e => e.st === "FINAL") || coming || going || AP.arrs[0] || null;
}
function apFeature(all){
  if (all) AP.all = all;
  const pg = typeof page === "string" ? page : "";          // the app has no pages
  const e = apFocus(pg === "apland" ? "arr" : pg === "apdep" ? "dep" : null);
  const o = e && (AP.all || []).find(x => x.ac.hex === e.hex);
  if (o) { setFeat(o, "ap"); feat.apSt = e.st; }
  else feat = null;
  renderFeatured();
  if (feat) lookupDetails(feat.hex);
  if (feat && typeof preloadPhoto === "function") preloadPhoto();
  if (typeof noteFeatured === "function") noteFeatured();
  if (typeof renderAircraftInfo === "function") renderAircraftInfo();
  if (typeof renderPage === "function" && (pg === "apland" || pg === "apdep")) renderPage();
}
let apTimer = 0;
function scheduleAirport(){ if (!apTimer) apTimer = setTimeout(() => { apTimer = 0; renderAirport(); }, 300); }
const apFlight = e => (e.info && e.info.flightNo) || String(e.ac.flight || "").trim() || e.ac.r || e.hex.toUpperCase();
const apPlace = e => { const p = e.info && (e.kind === "dep" ? e.info.to : e.info.from); return p ? p.city || p.code || "" : ""; };

function cockpitOpen(){
  draft = {...S, quality: S.quality || "auto"};
  const box = $("cockpit");
  Object.assign(box.style, {left: `calc(${M}px * var(--k))`, top: `calc(266px * var(--k))`, width: `calc(${IW}px * var(--k))`, height: `calc(${Y.rail - 18 - 266}px * var(--k))`});
  box.innerHTML = COCKPIT.map(plateHtml).join("");
  box.onclick = e => e.stopPropagation();
  for (const el of box.querySelectorAll("[data-k]")) {
    const it = ITEMS.find(x => x.k === el.dataset.k);
    if (el.classList.contains("lcd")) el.oninput = () => { draft[it.k] = el.value; cockpitDirty(); };
    else if (el.classList.contains("rotary")) {
      const turn = i => { const was = rotaryIndex(it); draft[it.k] = it.opts[(i + it.opts.length) % it.opts.length][0]; cockpitShow(); ctlSound.rotary(Math.abs(rotaryIndex(it) - was)); };
      el.onclick = e => { const b = e.target.closest("b"); turn(b ? +b.dataset.i : rotaryIndex(it) + 1); };
      el.onwheel = e => { e.preventDefault(); const i = rotaryIndex(it), j = i + (e.deltaY > 0 ? 1 : -1); if (j >= 0 && j < it.opts.length) turn(j); };
      el.onkeydown = e => { const d = /Right|Up/.test(e.key) ? 1 : /Left|Down/.test(e.key) ? -1 : 0; if (d) { e.preventDefault(); const j = rotaryIndex(it) + d; if (j >= 0 && j < it.opts.length) turn(j); } };
    } else if (el.classList.contains("toggle")) el.onclick = () => {
      draft[it.k] = it.on ? (draft[it.k] === it.on ? it.off : it.on) : !draft[it.k]; cockpitShow(); ctlSound.toggle(el.getAttribute("aria-pressed") === "true");
    };
    else if (el.classList.contains("wheel")) {
      const roll = d => { const was = draft[it.k]; wheelStep(it, el.dataset.part, d); cockpitShow(el, d); if (draft[it.k] !== was) ctlSound.wheel(); };
      el.querySelector(".inc").onclick = () => roll(1);

    ctlSound.press();
    if (b.dataset.act === "save") { applySettings(draft); switchView(null); }
    else if (b.dataset.act === "about") switchView("about");
    else switchView(null);
  };

}

// The remarks and what they mean, with each one in its colours as on the flaps.
function remarkChip(r){
  const L = REMARK_LOOK[r] || {}, bg = L.fill ? `background:linear-gradient(${L.fill[0]},${L.fill[1]});` : "background:#26282b;";
  return `<b class="chip" style="${bg}color:${L.fg || "#e8e3d6"}">${escH(T(r))}</b>`;

function legendHtml(){

    items.map(([r, t]) => `<li>${remarkChip(r)}<span>${escH(t)}</span></li>`).join("") + "</ul>").join("") +

function wheelStep(it, part, d){
  if (it.type === "time") {
    const [h, m] = String(draft[it.k] || "00:00").split(":").map(Number);
    const nh = part === "h" ? (h + d + 24) % 24 : h, nm = part === "m" ? (Math.round(m / 5) * 5 + d * 5 + 60) % 60 : m;
    draft[it.k] = `${String(nh).padStart(2, "0")}:${String(nm).padStart(2, "0")}`;
  } else draft[it.k] = Math.min(it.max, Math.max(it.min, Math.round((+draft[it.k] || it.min) / it.step) * it.step + d * it.step));
}
// Show the draft on the controls: knob positions, switch levers, wheel numbers. A wheel that just turned rolls.
function cockpitShow(rolled, dir){
  const box = $("cockpit");
  for (const el of box.querySelectorAll("[data-k]")) {
    const it = ITEMS.find(x => x.k === el.dataset.k), v = draft[it.k];
    if (el.classList.contains("rotary")) {
      const i = rotaryIndex(it);
      el.querySelector(".knob").style.setProperty("--rot", rotaryAngles(it.opts.length)[i] + "deg");
      el.querySelectorAll("b").forEach((b, j) => b.classList.toggle("on", j === i));
      el.setAttribute("aria-valuetext", it.opts[i][1]);
    } else if (el.classList.contains("toggle")) el.setAttribute("aria-pressed", String(it.on ? v === it.on : !!v));
    else if (el.classList.contains("wheel")) {
      const b = el.querySelector(".win b"), [h, m] = String(v || "00:00").split(":");
      b.textContent = it.type === "time" ? (el.dataset.part === "h" ? h : m) : String(v);
      if (el === rolled) { b.className = ""; void b.offsetWidth; b.className = dir > 0 ? "up" : "down"; }
    }
  }

}
function cockpitDirty(){
  const dirty = ITEMS.some(it => String(draft[it.k] ?? "") !== String((it.k === "quality" ? S.quality || "auto" : S[it.k]) ?? ""));
  const b = $("cockpit").querySelector('[data-act="save"]');
