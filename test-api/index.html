<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overhead Flight Board (Test API)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed 1920x1080 airport flight-information board, scaled to fit any screen.
   Top: gate-style feature of the plane overhead. Bottom: today's sightings as a departures list. */
:root{
  color-scheme: dark;
  --housing:#0b0b0c;
  --wall:#050505;
  --ink:#f3f0e8;
  --amber:#f0b429;
  --muted:#7f838b;
  --line:#26272b;
  --surface:#151618;
  --f-board:"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif;
  --k:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font:15px/1.45 var(--f-board);overflow:hidden;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#stage{position:absolute;background:var(--housing);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{cursor:pointer}

footer{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 calc(64px*var(--k)) calc(20px*var(--k));
  font-size:max(11px,calc(17px*var(--k)));letter-spacing:.03em;color:var(--muted);
  transition:opacity .6s;
}
body.idle footer{opacity:0;pointer-events:none}
footer{background:linear-gradient(transparent,rgba(0,0,0,.6));padding-top:calc(6px*var(--k));padding-bottom:calc(10px*var(--k));z-index:4;pointer-events:none}
footer #status,footer .actions{pointer-events:auto}
.pip{position:absolute;left:calc(20px*var(--k));bottom:calc(18px*var(--k));width:max(6px,calc(9px*var(--k)));height:max(6px,calc(9px*var(--k)));
  border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none}
body.idle .pip[data-state=warn]{opacity:.8;background:var(--amber)}
body.idle .pip[data-state=off]{opacity:.9;background:#e0483d}
#status{display:flex;align-items:center;gap:.6em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:.5em;height:.5em;border-radius:50%;background:var(--muted);flex:none}
.dot[data-state=live]{background:#22a058}
.dot[data-state=demo]{background:var(--amber)}
.dot[data-state=off]{background:#c7372d}
.dot[data-state=warn]{background:var(--amber)}
#diag{position:fixed;top:16px;right:16px;bottom:16px;width:min(640px,calc(100% - 32px));display:flex;flex-direction:column;gap:14px;
  background:#0e0f11;border:1px solid var(--line);border-radius:12px;padding:16px 18px;z-index:4;
  font:13px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--ink);-webkit-user-select:text;user-select:text;cursor:auto}
#diag header{display:flex;align-items:center;justify-content:space-between;gap:12px}
#diag h2{font:700 22px/1 var(--f-board);letter-spacing:.06em;text-transform:uppercase;margin:0}
#diag h2 span{color:var(--muted);font-weight:400}
#diag h3{font:600 12px/1 var(--f-board);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.dstats{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.dstats dt{color:var(--muted)}
.dstats dd{margin:0;min-width:0;overflow-wrap:anywhere}
.spark{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:8px}
.spark i{width:6px;height:12px;border-radius:1px;background:#27a85e}
.spark i.f{background:#cb3a2f}.spark i.s{background:var(--amber)}
.dsrc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.dsrc td{padding:3px 10px 3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dsrc td:last-child{color:var(--muted);overflow-wrap:anywhere}
#diagLogWrap{display:flex;flex-direction:column;flex:1;min-height:0}
#diagLog{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
#diagLog li{display:grid;grid-template-columns:auto 3.6em 1fr;gap:10px;padding:2px 0}
#diagLog time,#diagLog .tag{color:var(--muted)}
.lv-warn{color:var(--amber)}.lv-error{color:#ff6b5e}.lv-debug{color:#a3a7ae}.good{color:#45d483}.bad{color:#ff6b5e}.meh{color:var(--amber)}
#diagText{position:fixed;left:-9999px;top:0;width:10px;height:10px}
.actions{display:flex;gap:.4em;flex:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:.25em .7em;cursor:pointer}
button:hover,button:focus-visible{color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.empty{color:var(--muted);margin:0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 16px}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
label.check{flex-direction:row;align-items:center;gap:8px}
input,select{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--amber)}
output{color:var(--ink);letter-spacing:0}
input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--amber)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.primary{background:var(--amber);color:#15130e;border-color:var(--amber);font-weight:600}
.primary:hover,.primary:focus-visible{color:#15130e;opacity:.92}
textarea.fav{font:15px var(--f-board);color:var(--ink);background:var(--housing);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-height:2.4em;resize:vertical}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
.times{display:flex;gap:8px;align-items:center}
.times input{width:auto;flex:1}
#shade{position:absolute;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none;transition:opacity 2s}
.photo{position:absolute;overflow:hidden;pointer-events:none}
.photo canvas{display:block;width:100%;height:100%}
.photo.plain{border-radius:6px;box-shadow:inset 0 0 0 2px #000,0 6px 18px rgba(0,0,0,.6)}
.photo.screen{border-radius:calc(5px*var(--k));box-shadow:0 0 calc(20px*var(--k)) rgba(165,190,225,.13)}
.photo.screen.on{animation:screenOn .95s ease-out both}
body.lite .photo.screen.on{animation:screenOnLite .8s ease-out both}
@keyframes screenOnLite{0%{opacity:0}16%{opacity:.8}24%{opacity:.45}100%{opacity:1}}
@keyframes screenOn{0%{opacity:0;filter:brightness(.5) saturate(.2)}16%{opacity:.8}24%{opacity:.45}38%{opacity:1;filter:brightness(1.4) saturate(.75)}100%{opacity:1;filter:none}}
#photoImg{display:none}
#stage canvas#flipCv{z-index:2;pointer-events:none}
/* push buttons: plain ivory caps that light up warm white, with a small flicker as the bulb comes on */
.rail{position:absolute;display:flex;z-index:2}
.cap{position:relative;flex:none;width:calc(104px*var(--k));height:calc(44px*var(--k));margin:0 0 0 calc(14px*var(--k));padding:0;border:0;border-radius:calc(4px*var(--k));
  display:grid;place-items:center;text-align:center;font:700 calc(12.5px*var(--k))/1.1 var(--f-board);letter-spacing:.07em;text-transform:uppercase;
  color:rgba(24,22,18,.74);background:linear-gradient(#97928a,#7b776e 70%,#6e6a63);
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(4px*var(--k)) 0 calc(3px*var(--k)) #000,inset 0 calc(1px*var(--k)) 0 rgba(255,255,255,.28),inset 0 calc(-3px*var(--k)) calc(5px*var(--k)) rgba(0,0,0,.3);
  transition:box-shadow .4s ease-out,transform .14s ease-out,filter .3s}
.cap:first-child{margin-left:0}
.cap[aria-current=page],.cap[aria-pressed=true]{color:#17140e;background:radial-gradient(75% 70% at 50% 44%,#fffdf6,#f6ecd4 60%,#e2d0a4);transform:translateY(calc(2.5px*var(--k)));
  box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(255,224,150,.3),
    inset 0 0 calc(12px*var(--k)) rgba(255,206,120,.5);
  animation:lampOn .55s linear}
.cap.go[aria-pressed=true]{background:radial-gradient(75% 70% at 50% 44%,#eaffd8,#9be07f 58%,#55a443);box-shadow:0 0 0 calc(3px*var(--k)) #050505,0 calc(1.5px*var(--k)) 0 calc(3px*var(--k)) #000,
  0 0 calc(24px*var(--k)) calc(3px*var(--k)) rgba(140,235,110,.3),inset 0 0 calc(12px*var(--k)) rgba(40,120,20,.4)}
@keyframes lampOn{0%{filter:brightness(.45)}12%{filter:brightness(1.12)}19%{filter:brightness(.72)}32%{filter:brightness(1.04)}100%{filter:none}}
body.lite .cap[aria-current=page],body.lite .cap[aria-pressed=true]{animation:none}
.cap:hover:not([aria-current]):not([aria-pressed=true]):not(:disabled){filter:brightness(1.12)}
.cap:active:not(:disabled){transform:translateY(calc(3.5px*var(--k)))}
.cap:disabled{cursor:default;filter:brightness(.6)}
.cap.small{width:auto;min-width:calc(64px*var(--k));height:calc(34px*var(--k));padding:0 calc(12px*var(--k));font-size:calc(12px*var(--k))}
.cap.big{width:calc(150px*var(--k));height:calc(56px*var(--k));font-size:calc(16px*var(--k))}
#viewTools{z-index:2}
#radarCv{position:absolute;z-index:1;pointer-events:none}
#stage #radarCv{inset:auto}

/* Settings: a cockpit panel. Plates with screws, rotary selectors, flip switches, thumbwheels and amber read-outs. */
#cockpit{position:absolute;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.12fr);grid-template-rows:minmax(0,1.12fr) minmax(0,1fr);gap:calc(18px*var(--k));
  font-family:var(--f-board);color:#d8d3c6}
.plate{position:relative;min-width:0;overflow:hidden;background:linear-gradient(#28292c,#1a1b1d);border-radius:calc(8px*var(--k));padding:calc(14px*var(--k)) calc(26px*var(--k)) calc(12px*var(--k));
  box-shadow:0 calc(6px*var(--k)) calc(16px*var(--k)) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 4px rgba(0,0,0,.5);
  display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-end;gap:calc(10px*var(--k)) calc(22px*var(--k))}
.plate>i{position:absolute;width:calc(9px*var(--k));height:calc(9px*var(--k));border-radius:50%;
  background:linear-gradient(35deg,transparent 42%,rgba(0,0,0,.75) 42% 58%,transparent 58%),radial-gradient(circle at 35% 35%,#8d9095,#45474c 60%,#1b1c1f)}
.plate>i:nth-of-type(1){left:calc(8px*var(--k));top:calc(8px*var(--k))}.plate>i:nth-of-type(2){right:calc(8px*var(--k));top:calc(8px*var(--k))}
.plate>i:nth-of-type(3){left:calc(8px*var(--k));bottom:calc(8px*var(--k))}.plate>i:nth-of-type(4){right:calc(8px*var(--k));bottom:calc(8px*var(--k))}
.plate h3{flex:0 0 100%;display:flex;align-items:center;gap:calc(10px*var(--k));margin:0 0 calc(4px*var(--k));font:600 calc(13px*var(--k))/1 var(--f-board);
  letter-spacing:.22em;text-transform:uppercase;color:rgba(214,208,194,.72);text-shadow:0 -1px 0 rgba(0,0,0,.8)}
.plate h3::before,.plate h3::after{content:"";flex:1;height:1px;background:rgba(214,208,194,.25)}
.inst{display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--k))}
.inst>span{font:600 calc(11.5px*var(--k))/1.15 var(--f-board);letter-spacing:.12em;text-transform:uppercase;color:rgba(214,208,194,.66);text-align:center;max-width:calc(170px*var(--k))}
.inst.wide{flex:1 1 100%;align-items:stretch}
.inst.wide>span{text-align:left;max-width:none}
.lcd{font:600 calc(21px*var(--k))/1 var(--f-board);letter-spacing:.08em;text-transform:uppercase;color:#f6c54a;background:linear-gradient(#0b0e09,#151b10);
  border:0;border-radius:calc(4px*var(--k));padding:calc(9px*var(--k)) calc(12px*var(--k));text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.45);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #050505,0 1px 0 calc(3px*var(--k)) rgba(255,255,255,.05);-webkit-user-select:text;user-select:text}
.lcd:focus{outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 0 0 calc(2px*var(--k)) #f6c54a}
/* rotary selector: a fluted knob, its pointer on the chosen position, the positions engraved round it */
.rotary{position:relative;width:calc(140px*var(--k));height:calc(116px*var(--k));outline:none;cursor:pointer}
.rotary .knob{position:absolute;left:50%;top:calc(66px*var(--k));width:calc(54px*var(--k));height:calc(54px*var(--k));margin:calc(-27px*var(--k)) 0 0 calc(-27px*var(--k));border-radius:50%;
  background:repeating-conic-gradient(#1a1b1e 0 6deg,#3b3d42 6deg 12deg);box-shadow:0 calc(4px*var(--k)) calc(8px*var(--k)) rgba(0,0,0,.7),0 0 0 calc(2px*var(--k)) #0b0b0c;
  transform:rotate(var(--rot,0deg));transition:transform .3s cubic-bezier(.3,1.45,.55,1)}
.rotary .knob::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#62656b,#2a2b2f 60%,#18191b)}
.rotary .knob::after{content:"";position:absolute;left:50%;top:7%;width:calc(3px*var(--k));height:38%;margin-left:calc(-1.5px*var(--k));border-radius:2px;background:#f3f0e8;box-shadow:0 0 calc(4px*var(--k)) rgba(255,255,255,.4)}
.rotary:focus-visible .knob{box-shadow:0 0 0 calc(2px*var(--k)) #f6c54a}
.rotary b{position:absolute;left:50%;top:calc(66px*var(--k));font:600 calc(11px*var(--k))/1 var(--f-board);letter-spacing:.06em;color:rgba(214,208,194,.55);white-space:nowrap;
  transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(-50px*var(--k))) rotate(calc(-1*var(--a)));transition:color .2s,text-shadow .2s}
.rotary b.on{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.55)}
/* flip switch: a chrome bat handle on a nut, flipped up for on */
.toggle{position:relative;width:calc(66px*var(--k));height:calc(112px*var(--k));padding:0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  font:700 calc(11px*var(--k))/1 var(--f-board);letter-spacing:.1em;color:rgba(214,208,194,.45)}
.toggle .nut{position:relative;width:calc(34px*var(--k));height:calc(34px*var(--k));border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#b9bcc1,#6d7075 45%,#2c2d31 75%);box-shadow:0 0 0 calc(4px*var(--k)) #111214,0 calc(3px*var(--k)) calc(6px*var(--k)) rgba(0,0,0,.7)}
.toggle .lever{position:absolute;left:50%;bottom:50%;width:calc(11px*var(--k));height:calc(34px*var(--k));margin-left:calc(-5.5px*var(--k));border-radius:calc(6px*var(--k)) calc(6px*var(--k)) calc(3px*var(--k)) calc(3px*var(--k));
  background:linear-gradient(90deg,#7c7f84,#eceef1 45%,#9a9da2 70%,#5d6065);transform-origin:50% 100%;transform:scaleY(-1);transition:transform .16s cubic-bezier(.5,0,.4,1.4);
  box-shadow:0 calc(2px*var(--k)) calc(3px*var(--k)) rgba(0,0,0,.6)}
.toggle[aria-pressed=true] .lever{transform:scaleY(1)}
.toggle .up,.toggle .down{transition:color .2s,text-shadow .2s}
.toggle[aria-pressed=true] .up,.toggle[aria-pressed=false] .down{color:#f6c54a;text-shadow:0 0 calc(6px*var(--k)) rgba(246,197,74,.5)}
.toggle.guard .lever{background:linear-gradient(90deg,#7a1d16,#e0473b 45%,#9e2a20 70%,#5c140f)}
/* thumbwheel: a ridged drum with a number in a window */
.wheels{display:flex;align-items:center;gap:calc(4px*var(--k))}
.wheels>em{font:700 calc(26px*var(--k))/1 var(--f-board);font-style:normal;color:#d8d3c6}
.wheel{display:flex;flex-direction:column;align-items:center;outline:none}
.wheel button{width:calc(52px*var(--k));height:calc(18px*var(--k));padding:0;border:0;border-radius:calc(3px*var(--k));font-size:calc(9px*var(--k));color:rgba(214,208,194,.6);
  background:repeating-linear-gradient(#3c3e43 0 calc(2px*var(--k)),#1a1b1e calc(2px*var(--k)) calc(4px*var(--k)));box-shadow:0 0 0 calc(2px*var(--k)) #0b0b0c}
.wheel button:hover{color:#f6c54a}
.wheel .win{position:relative;overflow:hidden;width:calc(52px*var(--k));height:calc(44px*var(--k));margin:calc(4px*var(--k)) 0;border-radius:calc(4px*var(--k));display:grid;place-items:center;
  font:700 calc(28px*var(--k))/1 var(--f-board);color:#f3f0e8;background:linear-gradient(#2a2b2f,#17181b 50%,#0e0f11 50%,#1f2023);
  box-shadow:inset 0 0 0 calc(2px*var(--k)) #000,0 calc(2px*var(--k)) calc(4px*var(--k)) rgba(0,0,0,.6)}
.wheel .win::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.9)}
.wheel:focus-visible .win{box-shadow:inset 0 0 0 calc(2px*var(--k)) #f6c54a}
.wheel .win b.up{animation:rollUp .22s ease-out}.wheel .win b.down{animation:rollDown .22s ease-out}
@keyframes rollUp{0%{transform:translateY(60%);opacity:.2}100%{transform:none;opacity:1}}
@keyframes rollDown{0%{transform:translateY(-60%);opacity:.2}100%{transform:none;opacity:1}}
.plate p{flex:0 0 100%;margin:0;font:500 calc(14px*var(--k))/1.35 var(--f-board);color:rgba(214,208,194,.6)}
.plate .acts{flex:0 0 100%;display:flex;gap:calc(22px*var(--k));justify-content:center;padding:calc(10px*var(--k)) 0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="fx" role="img" aria-label="Flight board showing planes passing overhead"></canvas>
  <div class="photo screen" id="photoFrame" hidden><canvas id="photoCv"></canvas></div>
  <img id="photoImg" alt="" referrerpolicy="no-referrer">
  <canvas id="radarCv" hidden aria-hidden="true"></canvas>
  <canvas id="flipCv" hidden aria-hidden="true"></canvas>
  <div class="rail" id="railPages" aria-label="Pages"></div>
  <div class="rail" id="railViews" aria-label="Views"></div>
  <div class="rail" id="viewTools" hidden></div>
  <section id="cockpit" hidden aria-label="Settings"></section>
  <div id="shade"></div>
  <span class="pip" id="pip" aria-hidden="true"></span>
  <footer>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
    <div class="actions">
      <button id="btnDiag" type="button">Diagnostics</button>
    </div>
  </footer>
</div>

<aside id="diag" hidden aria-label="Diagnostics">
  <header>
    <h2>Diagnostics <span>Diagnose</span></h2>
    <div class="actions"><button id="diagCopy" type="button">Copy log</button><button id="diagClose" type="button">Close</button></div>
  </header>
  <dl class="dstats" id="diagStats"></dl>
  <div id="diagSources"></div>
  <div id="diagLogWrap"><h3>Connection log</h3><ol id="diagLog"></ol></div>
  <textarea id="diagText" aria-hidden="true" tabindex="-1"></textarea>
</aside>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const W = 1920, H = 1080, M = 64, IW = W - 2 * M;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let FONT = '"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif';
const COL = {housing:"#0b0b0c", rule:"#25262a", ink:"#f3f0e8", amber:"#f0b429", muted:"#7f838b", labelEn:"#6d7179"};
const FLAP = ["#2b2c2f", "#232427", "#1c1d1f", "#161719"];
const THEMES = {
  classic:   {font:'"Archivo Narrow","Roboto Condensed","Arial Narrow",sans-serif', flap:["#2b2c2f","#232427","#1c1d1f","#161719"],
              ink:"#f3f0e8", accent:"#f0b429", label2:"#6d7179", metal:["#1d1e21","#141517","#18191c"]},
  frankfurt: {font:'"Oswald","Archivo Narrow","Arial Narrow",sans-serif', flap:["#222222","#1b1b1b","#151515","#101010"],
              ink:"#ffd21f", accent:"#ffffff", label2:"#8c8c8c", metal:["#1a1a1a","#111111","#161616"]},
  blue:      {font:'"Barlow Condensed","Archivo Narrow","Arial Narrow",sans-serif', flap:["#29406e","#21365f","#1b2d51","#152443"],
              ink:"#f5f7fb", accent:"#9ccaff", label2:"#71809c", metal:["#151d2d","#0e1422","#121a29"]}
};

/* ---------- text helpers ---------- */
function clean(s){
  return String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "SS").replace(/[Øø]/g, "O").replace(/[Łł]/g, "L")
    .toUpperCase().replace(/[^A-Z0-9 .\-\/:,'&()]/g, "").replace(/\s+/g, " ").trim();
}
function trimTo(s, w){
  if (s.length <= w) return s;
  let cut = -1;
  for (let i = Math.min(w, s.length - 1); i > 0; i--) if (" -/".includes(s[i])) { cut = i; break; }
  return (cut >= Math.ceil(w * .5) ? s.slice(0, cut) : s.slice(0, w)).replace(/[\s,.:\/&'-]+$/, "");   // "PENDIK, ISTANBUL" → "PENDIK", not "PENDIK,"
}

/* layout in board units (1920 x 1080) */
function placeRow(ids, gaps, y, step, ratio, x0 = M){
  let x = x0;
  ids.forEach((id, i) => {
    const f = fields[id];
    f.x = x; f.y = y; f.step = step; f.cw = step * .9; f.ch = f.cw * ratio;
    f.wordW = f.n * step - (step - f.cw);
    x += f.n * step + (gaps[i] || 0) * step;
  });
}

    for (const b of box.children) b.onclick = e => {

  const box = $("viewTools");

    const k = b.dataset.t, n = counts[k];

/* Radar: a plan view of everything around, north up, in an instrument set into the board. The nearest planes are
   listed on flaps next to it. */
const radar = {raf: 0, last: 0, at: 0, planes: [], trails: new Map(), px: 1};
const RADAR_COL = {over: "#27a85e", soon: "#f6be35", by: "#4f8fe0", away: "#8a8d93", high: "#4a4d53", special: "#b483ff", emergency: "#e0372c", fav: "#ef6fae"};

function rgba(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function radarTrack(all, now){
  radar.planes = all; radar.at = now;
  for (const o of all) {
    let tr = radar.trails.get(o.ac.hex);
    if (!tr) radar.trails.set(o.ac.hex, tr = []);
    const last = tr[tr.length - 1];
    if (!last || last.lat !== o.ac.lat || last.lon !== o.ac.lon) tr.push({lat: o.ac.lat, lon: o.ac.lon, t: now});
    while (tr.length && (tr.length > 36 || now - tr[0].t > 4 * 60000)) tr.shift();
  }
  for (const [k, tr] of radar.trails) if (!tr.length || now - tr[tr.length - 1].t > 90000) radar.trails.delete(k);
}
const radarRange = () => Math.max(20, Math.ceil((+S.radiusKm || 15) * 1.6 / 5) * 5);
function radarBox(){ const {cx, cy, R} = RADAR_GEO, m = 36; return {x: cx - R - m, y: cy - R - m, w: 2 * (R + m), h: 2 * (R + m)}; }
function resizeRadar(){
  const cv = $("radarCv"), b = radarBox();
  radar.px = Math.min(PX, LITE() ? 1 : 1.5);
  cv.width = Math.round(b.w * radar.px); cv.height = Math.round(b.h * radar.px);
  Object.assign(cv.style, {left: b.x * K + "px", top: b.y * K + "px", width: b.w * K + "px", height: b.h * K + "px"});
}
function startRadar(){
  resizeRadar(); $("radarCv").hidden = false;
  const every = LITE() ? 100 : 66;
  const loop = t => {
    if (view !== "radar") return;
    if (t - radar.last > every) { radar.last = t; drawRadar(t); }
    radar.raf = requestAnimationFrame(loop);
  };
  cancelAnimationFrame(radar.raf); radar.raf = requestAnimationFrame(loop);
}
function stopRadar(){ cancelAnimationFrame(radar.raf); }
// The instrument's housing and the legend, engraved into the panel.
function radarStatic(g){
  const {cx, cy, R} = RADAR_GEO, TAU = Math.PI * 2;
  g.save();
  g.shadowColor = "rgba(0,0,0,.7)"; g.shadowBlur = 18 * PX; g.shadowOffsetY = 6 * PX;
  const ring = g.createLinearGradient(0, cy - R - 26, 0, cy + R + 26);
  ring.addColorStop(0, "#303135"); ring.addColorStop(.5, "#1d1e21"); ring.addColorStop(1, "#141517");
  g.fillStyle = ring; g.beginPath(); g.arc(cx, cy, R + 26, 0, TAU); g.fill();
  g.restore();
  g.strokeStyle = "rgba(255,255,255,.1)"; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, R + 25, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  g.fillStyle = "#050607"; g.beginPath(); g.arc(cx, cy, R + 4, 0, TAU); g.fill();
  const scope = g.createRadialGradient(cx, cy, 0, cx, cy, R);
  scope.addColorStop(0, "#15191b"); scope.addColorStop(1, "#090b0c");
  g.fillStyle = scope; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + Math.PI / 8; screw(g, cx + Math.cos(a) * (R + 15), cy + Math.sin(a) * (R + 15), 4); }
  const dot = (c, t, x, y) => {
    g.fillStyle = c; g.beginPath(); g.arc(x + 7, y - 6, 7, 0, TAU); g.fill();
    g.fillStyle = COL.muted; g.font = `500 18px ${FONT}`; g.fillText(t, x + 22, y); return x + 36 + g.measureText(t).width;
  };
  let x = 940;
  [[RADAR_COL.over, "Overhead"], [RADAR_COL.soon, "Inbound"], [RADAR_COL.by, "Flying by"], [RADAR_COL.away, "Outbound"],
   [RADAR_COL.special, "Special"], [RADAR_COL.fav, "Favourite"], [RADAR_COL.high, "Too high"]].forEach(([c, t]) => { x = dot(c, t, x, 924); });
}
function altShort(ft){
  if (ft == null) return "";
  return S.units === "metric" ? nf.format(Math.round(ft * .3048 / 50) * 50) + " m" : ft >= 18000 ? "FL" + Math.round(ft / 100) : nf.format(Math.round(ft / 100) * 100) + " ft";
}
function radarColor(o){
  const x = liveFacts(o.ac, (infoCache.get(o.ac.hex + "|" + String(o.ac.flight || "").trim().toUpperCase()) || {}).info || baseInfo(o.ac));
  const sp = specialOf(x);
  if (sp === "EMERGENCY") return RADAR_COL.emergency;
  if (SPECIAL_BIG.has(sp) || sp === "MILITARY") return RADAR_COL.special;
  if (isFav(x)) return RADAR_COL.fav;

function drawRadar(t){
  const cv = $("radarCv"), g = cv.getContext("2d"), now = Date.now(), b = radarBox();
  g.setTransform(radar.px, 0, 0, radar.px, -b.x * radar.px, -b.y * radar.px);
  g.clearRect(b.x, b.y, b.w, b.h);
  const {cx, cy, R} = RADAR_GEO, range = radarRange(), k = R / range, TAU = Math.PI * 2;
  const kx = 111.32 * Math.cos(S.lat * Math.PI / 180), ky = 110.57;
  const toXY = (lat, lon) => [cx + (lon - S.lon) * kx * k, cy - (lat - S.lat) * ky * k];
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
  const a0 = (t / 7000) * TAU;                                  // slow sweep
  for (let i = 0; i < 28; i++) {
    g.fillStyle = rgba(COL.amber, .075 * (1 - i / 28));
    g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a0 - (i + 1) * .028 - Math.PI / 2, a0 - i * .028 - Math.PI / 2); g.closePath(); g.fill();

  g.beginPath(); g.moveTo(cx - R, cy); g.lineTo(cx + R, cy); g.moveTo(cx, cy - R); g.lineTo(cx, cy + R); g.stroke();
  g.font = `600 16px ${FONT}`; g.textAlign = "left"; g.textBaseline = "alphabetic";

    g.strokeStyle = "rgba(255,255,255,.1)"; g.lineWidth = 1.2; g.beginPath(); g.arc(cx, cy, r * k, 0, TAU); g.stroke();
    g.fillStyle = "rgba(255,255,255,.32)"; g.fillText(`${r} km`, cx + Math.sin(.42) * r * k + 6, cy - Math.cos(.42) * r * k + 16);
  }
  g.setLineDash([12, 9]); g.strokeStyle = rgba(COL.amber, .6); g.lineWidth = 2;
  g.beginPath(); g.arc(cx, cy, (+S.radiusKm || 15) * k, 0, TAU); g.stroke(); g.setLineDash([]);
  const ap = AIRPORTS[S.home];
  if (ap && ap.strips) {
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineCap = "round"; g.lineWidth = 5;
    for (const [la1, lo1, la2, lo2] of ap.strips) { const [x1, y1] = toXY(la1, lo1), [x2, y2] = toXY(la2, lo2); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
    const [ax, ay] = toXY(ap.lat, ap.lon);
    g.font = `700 18px ${FONT}`; g.fillStyle = "rgba(255,255,255,.6)"; g.fillText(S.home, ax + 20, ay + 28); g.lineCap = "butt";
  }
  const dt = Math.min(20, (now - radar.at) / 1000), shown = [];
  for (const o of radar.planes) {
    const ac = o.ac, v = (ac.gs || 0) * 1.852 / 3600 * dt, th = (ac.track || 0) * Math.PI / 180;
    const lat = ac.lat + v * Math.cos(th) / ky, lon = ac.lon + v * Math.sin(th) / kx;
    const [x, y] = toXY(lat, lon);
    if (Math.hypot(x - cx, y - cy) > R + 10) continue;
    const col = radarColor(o), tr = radar.trails.get(ac.hex);
    if (tr && tr.length > 1) {
      g.strokeStyle = rgba(col, .35); g.lineWidth = 2.5; g.beginPath();
      tr.forEach((p, i) => { const [px, py] = toXY(p.lat, p.lon); i ? g.lineTo(px, py) : g.moveTo(px, py); });
      g.lineTo(x, y); g.stroke();

    g.save(); g.translate(x, y); g.rotate(th - Math.PI / 4);

    g.restore();

  }
  g.font = `700 16px ${FONT}`;
  for (const {o, x, y, col} of shown) {
    if (!o.kind) continue;
    const info = (infoCache.get(o.ac.hex + "|" + String(o.ac.flight || "").trim().toUpperCase()) || {}).info;
    const name = (info && info.flightNo) || String(o.ac.flight || "").trim() || o.ac.r || o.ac.hex.toUpperCase();
    g.fillStyle = COL.ink; g.fillText(name, x + 20, y - 4);
    g.font = `500 14px ${FONT}`; g.fillStyle = col; g.fillText(altShort(o.alt), x + 20, y + 13); g.font = `700 16px ${FONT}`;
  }
  g.restore();
  g.strokeStyle = "rgba(255,255,255,.22)"; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke();
  const glass = g.createLinearGradient(cx - R, cy - R, cx + R * .2, cy + R * .4);          // the instrument's glass
  glass.addColorStop(0, "rgba(255,255,255,.06)"); glass.addColorStop(.5, "rgba(255,255,255,.015)"); glass.addColorStop(.501, "rgba(255,255,255,0)");
  g.fillStyle = glass; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
  g.font = `700 20px ${FONT}`; g.fillStyle = COL.muted; g.textAlign = "center"; g.textBaseline = "middle";
  [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([l, deg]) => { const a = deg * Math.PI / 180; g.fillText(l, cx + Math.sin(a) * (R - 18), cy - Math.cos(a) * (R - 18)); });
  pictogram(g, cx - 12, cy - 12, 24);
  g.textAlign = "left"; g.textBaseline = "alphabetic";
}

  pb.innerHTML = PAGE_ORDER.map(p => `<button class="cap" type="button" data-page="${p}"><span>${PAGE_KEYS[p] || p}</span></button>`).join("");
  vb.innerHTML = RAIL_VIEWS.map(([v, t]) => `<button class="cap" type="button" data-view="${v}" aria-pressed="false"><span>${t}</span></button>`).join("");
  for (const b of pb.children) b.onclick = e => { e.stopPropagation(); const p = b.dataset.page; view ? switchView(null, {page: p}) : pickPage(p); };

/* ---------- footer ---------- */
function updateFooter(){
  const dot = $("dot"), txt = $("statusText");
  dot.dataset.state = ""; txt.textContent = "Connecting…";
  if (S.demo) { dot.dataset.state = "demo"; txt.textContent = "Demo mode · sample flights, not live data"; }
  else if (isOffline()) { dot.dataset.state = "off"; txt.textContent = relay() ? "No flight data for over a minute · retrying · press D for details" : "No flight data here · open the board through your home relay"; }
  else if (!lastOk && failures) { dot.dataset.state = "warn"; txt.textContent = `Waiting for flight data · ${failures} failed attempt${failures > 1 ? "s" : ""} · press D for details`; }
  else if (lastOk) {
    const age = Math.round((Date.now() - lastOk) / 1000), stale = lastFreshness.startsWith("stale");
    dot.dataset.state = failures || stale ? "warn" : "live";
    txt.textContent = `Live via ${feedName}${stale ? " (last good copy)" : ""} · updated ${age < 3 ? "just now" : age + " s ago"}${failures ? " · retrying" : ""} · ${nearbyCount ?? 0} aircraft within ${QUERY_KM} km${apiOn() ? " · flight numbers by Flightradar24" : ""}`;

  if (nightOn) txt.textContent += " · night mode";
  else if ((S.sound || S.chimes) && !(actx && actx.state === "running")) txt.textContent += " · click or press any key for sound";

function cockpitOpen(){

function wheelStep(it, part, d){
  if (it.type === "time") {
    const [h, m] = String(draft[it.k] || "00:00").split(":").map(Number);
    const nh = part === "h" ? (h + d + 24) % 24 : h, nm = part === "m" ? (Math.round(m / 5) * 5 + d * 5 + 60) % 60 : m;
    draft[it.k] = `${String(nh).padStart(2, "0")}:${String(nm).padStart(2, "0")}`;
  } else draft[it.k] = Math.min(it.max, Math.max(it.min, Math.round((+draft[it.k] || it.min) / it.step) * it.step + d * it.step));

// Show the draft on the controls: knob positions, switch levers, wheel numbers. A wheel that just turned rolls.
function cockpitShow(rolled, dir){

    const it = ITEMS.find(x => x.k === el.dataset.k), v = draft[it.k];
    if (el.classList.contains("rotary")) {

      el.querySelectorAll("b").forEach((b, j) => b.classList.toggle("on", j === i));

  if (e.key === "Escape") { closeDiag(); if (view) switchView(null); return; }
  if (t && t.closest && t.closest("#cockpit") && /^Arrow/.test(e.key)) return;     // the knobs and wheels use the arrow keys

  if (e.key === "r" || e.key === "R") toggleView("radar");

  if (e.key === "ArrowRight") { if (view === "spotted") svStep(1); else if (!view) stepPage(1); }
  if (e.key === "ArrowLeft") { if (view === "spotted") svStep(-1); else if (!view) stepPage(-1); }

    }).join("") + "</tbody></table>" + (st.screens && st.screens.length ? `<h3>Screens using the relay · ${st.screens.length}</h3><table class="dsrc"><tbody>` +
      st.screens.map(x => `<tr><td>${escH(x.name || x.device)}${x.sid === SID ? " <b>(this screen)</b>" : ""}</td><td>${escH(x.ip + (x.host ? " · " + x.host : ""))}</td>` +
        `<td>${escH([x.board, x.size].filter(Boolean).join(" · "))}</td><td>on for ${escH(forText(x.on_s))}</td></tr>`).join("") + "</tbody></table>" : "");
  const f = st && st.fr24;
  if (f && f.state && f.state !== "off") {
    const say = {ok: "Working", ready: "Ready, no lookups yet", budget: "Monthly budget used up, using the free sources",
      refused: "Key refused, using the free sources", error: "Problem: " + (f.error || "unknown")}[f.state] || f.state;
    $("diagSources").insertAdjacentHTML("beforeend", `<h3>Flightradar24</h3><p class="${f.state === "ok" || f.state === "ready" ? "good" : "meh"}">${escH(say)} · ` +
      `${nf.format(f.credits)} of ${nf.format(f.budget)} credits used this month · ${nf.format(f.lookupsToday)} lookups today (${nf.format(f.creditsToday)} credits)` +
      `${f.queue ? ` · ${f.queue} waiting` : ""}${f.airports ? "" : " · airport names not loaded yet"}</p>`);
  }
  const lines = mergedLog();
  $("diagLog").innerHTML = lines.length ? lines.map(e => `<li class="lv-${e.level}"><time>${clockStr(e.t)}</time><span class="tag">${e.src}</span><span>${escH(e.msg)}</span></li>`).join("")
    : `<li class="lv-debug"><time></time><span class="tag"></span><span>Nothing logged yet.</span></li>`;
}
async function refreshRelayStatus(){
  if (!DIAG.open || !relay() || relayLegacy || S.demo) return;
  try { const j = await fetchJSON(`${relay()}/status`, {}, 4000); DIAG.relayStatus = j; DIAG.relayEvents = j.events || []; }
  catch (e) { DIAG.relayStatus = {error: netError(e, "relay")}; }
  scheduleDiag();
}
let diagTimer = null;
function openDiag(){
  DIAG.open = true; $("diag").hidden = false;
  refreshRelayStatus(); renderDiag();
  clearInterval(diagTimer); diagTimer = setInterval(() => { refreshRelayStatus(); renderDiag(); }, 3000);
}
function closeDiag(){ DIAG.open = false; $("diag").hidden = true; clearInterval(diagTimer); }
function diagText(){
  const head = diagRows().map(([k, v]) => `${k}: ${v}`).join("\n");
  const src = (DIAG.relayStatus && DIAG.relayStatus.sources ? "\n\nRelay sources\n" + DIAG.relayStatus.sources.map(x => `${x.name}: ${x.state}${x.resting_s ? " " + x.resting_s + " s" : ""} · ${x.ok} ok · ${x.fail} failed · ${x.last_error || ""}`).join("\n") : "") +
    (DIAG.relayStatus && DIAG.relayStatus.screens ? "\n\nScreens using the relay\n" + DIAG.relayStatus.screens.map(x => `${x.name || x.device}${x.sid === SID ? " (this screen)" : ""} · ${x.device} · ${x.ip}${x.host ? " (" + x.host + ")" : ""} · ${x.board} · ${x.size} · on for ${forText(x.on_s)}`).join("\n") : "");
  const log = mergedLog().map(e => `${new Date(e.t).toISOString().slice(11, 19)}  ${e.src.padEnd(5)}  ${e.level.padEnd(5)}  ${e.msg}`).join("\n");
  return `Overhead board diagnostics · ${new Date().toString()}\n${navigator.userAgent}\n\n${head}${src}\n\nLog (newest first)\n${log}\n`;
}
$("btnDiag").onclick = e => { e.stopPropagation(); DIAG.open ? closeDiag() : openDiag(); };
$("diagClose").onclick = closeDiag;
$("diagCopy").onclick = async () => {
  const text = diagText(), btn = $("diagCopy");
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch {}
  if (!ok) { const ta = $("diagText"); ta.value = text; ta.focus(); ta.select(); try { ok = document.execCommand("copy"); } catch {} }
  btn.textContent = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.textContent = "Copy log"; }, 2000);
};

function forText(sec){
  const m = Math.floor(sec / 60);
  return m < 1 ? "< 1 min" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
}

/* ---------- saying hello to the relay ---------- */
// The relay (version 12 or newer) keeps a list of the screens using it. Every minute, and when the page is hidden or
// shown, the board tells it this screen's name, how big it is drawn and at what quality; closing the page says goodbye.
const relayV12 = () => !!relay() && !relayLegacy && (window.OVERHEAD_RELAY_VERSION || 0) >= 12;
function sayHello(){
  if (!relayV12()) return;
  const q = quality() === "high" ? "4K" : quality();
  const params = new URLSearchParams({name: S.screenName || "", w: Math.round(W * PX), h: Math.round(H * PX),
    q: (S.quality || "auto") === "auto" ? `auto (${q})` : q, vis: document.visibilityState || ""});
  timedFetch(`${relay()}/hello?${params}`, {}, 6000).catch(() => {});
}
setTimeout(sayHello, 2000);
setInterval(sayHello, 60000);
document.addEventListener("visibilitychange", sayHello);
addEventListener("pagehide", () => { try { if (relayV12() && navigator.sendBeacon) navigator.sendBeacon(tagged(`${relay()}/bye`)); } catch {} });

/* ---------- fullscreen, wake lock, idle cursor ---------- */
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
function toggleFullscreen(){
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); } catch {}
}
fx.addEventListener("click", () => { audioInit(); keepAwake(); toggleFullscreen(); });
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { audioInit(); keepAwake(); }, {passive: true, capture: true}));
let idleT = null;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 4000); }
["mousemove","keydown","touchstart"].forEach(ev => addEventListener(ev, wake, {passive: true}));
addEventListener("resize", resize);

/* ---------- main loop ---------- */
let timer = null, busy = false;
async function poll(force){
  if (busy && !force) return;
  clearTimeout(timer); busy = true;
  try {
    const list = S.demo ? demoAircraft() : await getAircraft();
    if (S.demo) DIAG.polls.push({t: Date.now(), ok: true, ms: 0, n: list.length});
    if (!lastOk && !S.demo) dlog("info", `First position data from ${feedName}: ${list.length} aircraft within ${QUERY_KM} km`);
    if (failures) dlog("info", `Position data back after ${failures} failed attempt${failures > 1 ? "s" : ""}`);
    if (wasOffline) dlog("info", "Back online");
    failures = 0; lastOk = Date.now(); wasOffline = false; process(list);
  } catch (e) {
    failures++;
    DIAG.polls.push({t: Date.now(), ok: false, err: e.message});
    dlog(failures >= 3 ? "error" : "warn", `Position update failed: ${e.message || e}`);
    if (isOffline()) {
      if (!wasOffline) dlog("error", "Showing OFFLINE: no position data for over a minute");
      wasOffline = true; feat = null; renderFeatured();
    }
  } finally {
    if (DIAG.polls.length > 60) DIAG.polls.splice(0, DIAG.polls.length - 60);
    busy = false; updateFooter(); scheduleDiag();
    timer = setTimeout(poll, S.demo ? 2000 : failures >= 3 ? POLL_MS * 2 : POLL_MS);
  }
}

async function start(){
  try {
    await Promise.race([
      Promise.all(["700 40px", "600 20px", "400 40px"].map(s => document.fonts.load(`${s} ${(THEMES[S.theme] || THEMES.classic).font}`))),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch {}
  applyTheme(); applyNight(true);
  resize(); wake();
  if (document.fonts) document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => { clearTiles(); drawStatic(); redrawAll(); });
  tickClock(); setInterval(tickClock, 1000);
  audioInit();   // starts at once where the browser allows it (kiosk setups); otherwise on the first click or key press
  renderPage(); updateFooter(); keepAwake();
  if (relayV5()) syncSightings();
  const h = location.hash.slice(1);
  updateRail();
  if (VIEWS.includes(h)) switchView(h, {instant: true});
  dlog("info", `Board started · ${S.demo ? "demo mode" : relay() ? "using the home relay" : "no relay"} · watching ${S.lat.toFixed(4)}, ${S.lon.toFixed(4)}, radius ${+S.radiusKm || 15} km`);
  if (/(^|[?&])debug\b/.test(location.search)) openDiag();
  setTimeout(poll, 500);
}
start();
})();
</script>
